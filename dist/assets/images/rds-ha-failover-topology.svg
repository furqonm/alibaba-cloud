<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <filter id="shadow-ha" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Client Application Tier -->
  <g transform="translate(320, 20)">
    <rect width="320" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-ha)"/>
    <text x="160" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e293b">Client Application Tier (ECS / ACK)</text>
    <text x="160" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0284c7">Virtual IP / DNS Endpoint: rm-xxx.mysql.rds.aliyuncs.com</text>
  </g>

  <!-- Traffic Line from Client to Primary (Normal State) -->
  <path d="M 400 90 L 400 130 L 250 130 L 250 160" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="255" y="105" width="130" height="22" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="320" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#15803d">Active SQL Traffic</text>

  <!-- Failover Route (Dashed Red) -->
  <path d="M 560 90 L 560 130 L 710 130 L 710 160" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-red)"/>
  <rect x="575" y="105" width="145" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="647" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">Auto-Failover (&lt; 30s)</text>

  <!-- Zone A Box -->
  <g transform="translate(60, 160)">
    <rect width="380" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6 6"/>
    <rect x="15" y="15" width="110" height="26" rx="4" fill="#dbeafe"/>
    <text x="70" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Availability Zone A</text>

    <!-- Primary Instance Card -->
    <rect x="40" y="55" width="300" height="100" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow-ha)"/>
    <text x="60" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#15803d">Primary Node (Master)</text>
    <text x="60" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Read / Write Engine (Port 3306)</text>
    <rect x="60" y="118" width="140" height="20" rx="4" fill="#dcfce7"/>
    <text x="130" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#166534">Active Read/Write Target</text>

    <!-- Zone A Storage -->
    <rect x="40" y="175" width="300" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="190" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155">ESSD Cloud Disk Storage</text>
    <text x="190" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Triplicate Distributed Pangu Layer</text>
  </g>

  <!-- Zone B Box -->
  <g transform="translate(520, 160)">
    <rect width="380" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6 6"/>
    <rect x="15" y="15" width="110" height="26" rx="4" fill="#e0e7ff"/>
    <text x="70" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4338ca">Availability Zone B</text>

    <!-- Standby Instance Card -->
    <rect x="40" y="55" width="300" height="100" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow-ha)"/>
    <text x="60" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0369a1">Secondary Node (Standby)</text>
    <text x="60" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Hot Standby Replica Node</text>
    <rect x="60" y="118" width="150" height="20" rx="4" fill="#e0f2fe"/>
    <text x="135" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0369a1">Auto-Promoted upon Failure</text>

    <!-- Zone B Storage -->
    <rect x="40" y="175" width="300" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="190" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155">ESSD Cloud Disk Storage</text>
    <text x="190" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Triplicate Distributed Pangu Layer</text>
  </g>

  <!-- Cross-Zone Replication & Heartbeat -->
  <path d="M 400 240 L 560 240" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="420" y="226" width="120" height="28" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="480" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0369a1">Semi-Sync Binlog</text>

  <!-- HA Heartbeat Monitor Pill -->
  <g transform="translate(415, 305)">
    <rect width="130" height="60" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow-ha)"/>
    <text x="65" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#b45309">HA Monitor Agent</text>
    <text x="65" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">Continuous Heartbeat</text>
  </g>
</svg>