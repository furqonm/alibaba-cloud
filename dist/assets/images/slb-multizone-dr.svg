<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="640" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Internet Cloud Node (Top Center) -->
  <g transform="translate(265, 20)">
    <rect width="110" height="44" rx="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 295 42 C 285 42 277 35 277 25 C 277 16 284 10 293 10 C 295 5 301 2 308 2 C 317 2 323 7 325 13 C 329 11 334 13 336 17 C 339 19 341 23 341 27 C 341 35 334 42 325 42 Z" fill="#0284c7" opacity="0.15" transform="translate(-265, -8)"/>
    <text x="55" y="27" text-anchor="middle" fill="#0369a1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Internet</text>
  </g>

  <!-- Region Boundary -->
  <g transform="translate(20, 95)">
    <rect width="600" height="365" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="250" y="-12" width="100" height="24" rx="4" fill="#334155"/>
    <text x="300" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Region</text>

    <!-- Primary Zone A (Left) -->
    <g transform="translate(20, 25)">
      <rect width="265" height="315" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
      <rect x="12" y="12" width="130" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="77" y="28" text-anchor="middle" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Primary Zone A</text>

      <!-- Failure Indicator Badge -->
      <g transform="translate(225, 24)">
        <circle cx="0" cy="0" r="10" fill="#ef4444"/>
        <line x1="-5" y1="-5" x2="5" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <line x1="5" y1="-5" x2="-5" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- SLB Master Node -->
      <g transform="translate(35, 55)" filter="url(#shadow)">
        <rect width="195" height="50" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
        <text x="97" y="30" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">SLB Master Node</text>
        <rect x="140" y="-8" width="50" height="16" rx="8" fill="#ef4444"/>
        <text x="165" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">OUTAGE</text>
      </g>

      <!-- ECS Instances in Zone A -->
      <g transform="translate(15, 160)">
        <rect width="110" height="55" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="55" y="32" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ECS</text>
        <circle cx="55" cy="12" r="3" fill="#ef4444"/>
      </g>
      <g transform="translate(140, 160)">
        <rect width="110" height="55" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="55" y="32" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ECS</text>
        <circle cx="55" cy="12" r="3" fill="#ef4444"/>
      </g>
      <g transform="translate(77, 235)">
        <rect width="110" height="55" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="55" y="32" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ECS</text>
        <circle cx="55" cy="12" r="3" fill="#ef4444"/>
      </g>
    </g>

    <!-- Backup Zone B (Right) -->
    <g transform="translate(315, 25)">
      <rect width="265" height="315" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect x="12" y="12" width="130" height="24" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <text x="77" y="28" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Backup Zone B</text>

      <!-- SLB Slave Node -->
      <g transform="translate(35, 55)" filter="url(#shadow)">
        <rect width="195" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="97" y="30" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">SLB Slave Node</text>
        <rect x="140" y="-8" width="50" height="16" rx="8" fill="#16a34a"/>
        <text x="165" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">ACTIVE</text>
      </g>

      <!-- ECS Instances in Zone B -->
      <g transform="translate(15, 160)">
        <rect width="110" height="55" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <text x="55" y="32" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ECS</text>
        <circle cx="55" cy="12" r="3" fill="#16a34a"/>
      </g>
      <g transform="translate(140, 160)">
        <rect width="110" height="55" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <text x="55" y="32" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ECS</text>
        <circle cx="55" cy="12" r="3" fill="#16a34a"/>
      </g>
      <g transform="translate(77, 235)">
        <rect width="110" height="55" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <text x="55" y="32" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ECS</text>
        <circle cx="55" cy="12" r="3" fill="#16a34a"/>
      </g>
    </g>
  </g>

  <!-- Inactive Route to Primary Zone A (Crossed) -->
  <line x1="285" y1="64" x2="152" y2="175" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <g transform="translate(210, 125)">
    <circle cx="0" cy="0" r="11" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Failover Active Route to Backup Zone B (Orange) -->
  <line x1="355" y1="64" x2="447" y2="175" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>

  <!-- Failover Distribution from Slave Node to Zone B ECS Fleet -->
  <line x1="447" y1="230" x2="385" y2="280" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="447" y1="230" x2="510" y2="280" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="447" y1="230" x2="447" y2="355" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
</svg>