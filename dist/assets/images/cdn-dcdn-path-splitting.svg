<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <filter id="dcdnShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="840" height="460" fill="#f8fafc" rx="12"/>

  <text x="420" y="30" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">DCDN (Dynamic Route for CDN): Static &amp; Dynamic Intelligent Separation</text>

  <!-- Left: Client User -->
  <g transform="translate(30, 60)">
    <rect width="140" height="360" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="2" filter="url(#dcdnShadow)"/>
    <rect width="140" height="38" rx="10" fill="#e0f2fe"/>
    <text x="70" y="24" fill="#0369a1" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">End User</text>

    <g transform="translate(15, 60)">
      <circle cx="20" cy="20" r="16" fill="#0284c7"/>
      <text x="20" y="25" fill="#ffffff" font-size="14" text-anchor="middle">👤</text>
      <text x="45" y="16" fill="#1e293b" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Mixed Requests</text>
      <text x="45" y="30" fill="#64748b" font-size="9.5" font-family="system-ui, sans-serif">Single Domain</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="110" height="60" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="55" y="20" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Static Asset</text>
      <text x="55" y="36" fill="#047857" font-size="9" font-family="system-ui, sans-serif">GET /style.css</text>
      <text x="55" y="50" fill="#047857" font-size="9" font-family="system-ui, sans-serif">GET /product.jpg</text>
    </g>

    <g transform="translate(15, 215)">
      <rect width="110" height="60" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <text x="55" y="20" fill="#9a3412" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Dynamic API</text>
      <text x="55" y="36" fill="#c2410c" font-size="9" font-family="system-ui, sans-serif">POST /api/order</text>
      <text x="55" y="50" fill="#c2410c" font-size="9" font-family="system-ui, sans-serif">GET /api/user/info</text>
    </g>

    <g transform="translate(15, 290)">
      <rect width="110" height="60" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
      <text x="55" y="20" fill="#5b21b6" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">WebSocket</text>
      <text x="55" y="36" fill="#7c3aed" font-size="9" font-family="system-ui, sans-serif">wss://app/live</text>
      <text x="55" y="50" fill="#7c3aed" font-size="9" font-family="system-ui, sans-serif">Full-Duplex Stream</text>
    </g>
  </g>

  <!-- Middle: DCDN Edge PoP -->
  <g transform="translate(230, 60)">
    <rect width="260" height="360" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#dcdnShadow)"/>
    <rect width="260" height="38" rx="10" fill="#ffedd5"/>
    <text x="130" y="24" fill="#c2410c" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">DCDN Intelligent Edge PoP</text>

    <!-- Inspection & Routing Engine -->
    <g transform="translate(15, 50)">
      <rect width="230" height="55" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
      <text x="115" y="20" fill="#92400e" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">🚦 Path &amp; Protocol Inspector</text>
      <text x="115" y="36" fill="#78350f" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Separates Static Caching vs Dynamic Tunneling</text>
      <text x="115" y="48" fill="#475569" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif">TLS 1.3 / QUIC Termination at Edge</text>
    </g>

    <!-- Branch 1: Edge Cache -->
    <g transform="translate(15, 120)">
      <rect width="230" height="65" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
      <text x="115" y="20" fill="#065f46" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">📂 Edge Caching Engine</text>
      <text x="115" y="36" fill="#047857" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Matches static file extensions (.jpg, .js, .css)</text>
      <text x="115" y="52" fill="#059669" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">⚡ Immediate Local Hit Response</text>
    </g>

    <!-- Branch 2: Dynamic Routing Engine -->
    <g transform="translate(15, 195)">
      <rect width="230" height="75" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
      <text x="115" y="20" fill="#9a3412" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">🌐 Smart Dynamic Routing</text>
      <text x="115" y="36" fill="#c2410c" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">• Real-time multi-path latency probing</text>
      <text x="115" y="50" fill="#c2410c" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">• Private high-speed backbone bypass</text>
      <text x="115" y="64" fill="#c2410c" font-size="9" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">• Pre-warmed persistent connection pool</text>
    </g>

    <!-- Branch 3: WebSocket Gateway -->
    <g transform="translate(15, 280)">
      <rect width="230" height="65" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="115" y="20" fill="#5b21b6" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">🔄 WebSocket Edge Gateway</text>
      <text x="115" y="36" fill="#6d28d9" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Maintains persistent client connection</text>
      <text x="115" y="52" fill="#7c3aed" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Low-latency full duplex proxying</text>
    </g>
  </g>

  <!-- Right: Origin Datacenter -->
  <g transform="translate(560, 60)">
    <rect width="250" height="360" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" filter="url(#dcdnShadow)"/>
    <rect width="250" height="38" rx="10" fill="#e0e7ff"/>
    <text x="125" y="24" fill="#3730a3" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Enterprise Origin Infrastructure</text>

    <g transform="translate(15, 60)">
      <rect width="220" height="80" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
      <text x="110" y="22" fill="#312e81" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">API Gateways / ALB Clusters</text>
      <text x="110" y="42" fill="#4338ca" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Receives pre-warmed backend connections</text>
      <text x="110" y="58" fill="#4338ca" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Eliminates repeated SSL/TLS handshakes</text>
      <text x="110" y="72" fill="#6366f1" font-size="9" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Processes order &amp; user business logic</text>
    </g>

    <g transform="translate(15, 160)">
      <rect width="220" height="75" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
      <text x="110" y="22" fill="#312e81" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">WebSocket State Servers</text>
      <text x="110" y="42" fill="#4338ca" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Real-time chat, market ticker feeds</text>
      <text x="110" y="58" fill="#4338ca" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Long-lived sessions managed smoothly</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="220" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="110" y="20" fill="#1e293b" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Performance Improvement</text>
      <text x="110" y="38" fill="#059669" font-size="10" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">🚀 30% - 50% Latency Reduction</text>
      <text x="110" y="56" fill="#475569" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">• 0% packet drop over private backbone</text>
      <text x="110" y="70" fill="#475569" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">• Bypasses public internet congestion</text>
    </g>
  </g>

  <!-- Connectors -->
  <line x1="170" y1="165" x2="225" y2="155" stroke="#059669" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <line x1="170" y1="245" x2="225" y2="235" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrOrange)"/>
  <line x1="170" y1="320" x2="225" y2="310" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrPurple)"/>

  <!-- DCDN -> Origin (Dynamic & WebSocket) -->
  <path d="M 490 235 L 555 200" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrOrange)"/>
  <path d="M 490 310 L 555 200" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrPurple)"/>
</svg>
