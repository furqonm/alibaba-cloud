<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <filter id="shadow-rw" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="m-write" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="m-read" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#0284c7"/>
    </marker>
    <marker id="m-sync" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Applications -->
  <g transform="translate(330, 20)">
    <rect width="300" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-rw)"/>
    <text x="150" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Application Servers (ECS / ACK Fleet)</text>
    <text x="150" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">Sends Reads (SELECT) &amp; Writes (INSERT/UPDATE)</text>
  </g>

  <!-- Connection to Proxy -->
  <line x1="480" y1="80" x2="480" y2="120" stroke="#475569" stroke-width="2"/>

  <!-- Dedicated Database Proxy -->
  <g transform="translate(260, 120)">
    <rect width="440" height="74" rx="10" fill="#f8fafc" stroke="#f97316" stroke-width="2" filter="url(#shadow-rw)"/>
    <rect x="15" y="12" width="50" height="50" rx="8" fill="#ffedd5"/>
    <text x="40" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20">⚡</text>
    <text x="75" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#c2410c">RDS Dedicated Database Proxy (R/W Splitting)</text>
    <text x="75" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Cluster Endpoint: rm-xxx.rwlb.rds.aliyuncs.com | Connection Pool</text>
  </g>

  <!-- Write Flow (Left - Red) -->
  <path d="M 370 194 L 370 240 L 190 240 L 190 270" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#m-write)"/>
  <rect x="220" y="222" width="110" height="20" rx="4" fill="#fee2e2"/>
  <text x="275" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">Writes (INSERT/UPD)</text>

  <!-- Read Flow (Right - Blue) -->
  <path d="M 590 194 L 590 240 L 680 240 L 680 270" fill="none" stroke="#0284c7" stroke-width="2.2" marker-end="url(#m-read)"/>
  <rect x="610" y="222" width="130" height="20" rx="4" fill="#e0f2fe"/>
  <text x="675" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0369a1">Reads (Weighted RR)</text>

  <!-- Primary Instance Card -->
  <g transform="translate(60, 275)">
    <rect width="260" height="150" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadow-rw)"/>
    <rect x="0" y="0" width="260" height="34" rx="10" fill="#dc2626"/>
    <rect x="0" y="24" width="260" height="10" fill="#dc2626"/>
    <text x="130" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Primary Instance (R/W)</text>
    <text x="20" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">• Master Database Engine</text>
    <text x="20" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">• Handles all Transactions &amp; DDL</text>
    <text x="20" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">• Generates Binary Log Stream</text>
    <rect x="20" y="112" width="220" height="24" rx="4" fill="#fef2f2"/>
    <text x="130" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Weight: Configurable (0–100)</text>
  </g>

  <!-- Replication Arrow from Primary to RO fleet -->
  <path d="M 320 350 L 410 350" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#m-sync)"/>
  <rect x="330" y="328" width="70" height="18" rx="3" fill="#dcfce7"/>
  <text x="365" y="341" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Binlog Sync</text>

  <!-- Read-Only Replicas Fleet -->
  <g transform="translate(420, 275)">
    <!-- Container Box -->
    <rect width="480" height="150" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow-rw)"/>
    <rect x="0" y="0" width="480" height="34" rx="10" fill="#0284c7"/>
    <rect x="0" y="24" width="480" height="10" fill="#0284c7"/>
    <text x="240" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Read-Only Replicas Fleet (Up to 10 Nodes)</text>

    <!-- RO 1 -->
    <g transform="translate(20, 48)">
      <rect width="130" height="85" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="65" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0369a1">Read Replica 1</text>
      <text x="65" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">Port 3306 (Read)</text>
      <rect x="15" y="56" width="100" height="18" rx="3" fill="#e0f2fe"/>
      <text x="65" y="69" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">Weight: 100</text>
    </g>

    <!-- RO 2 -->
    <g transform="translate(175, 48)">
      <rect width="130" height="85" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="65" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0369a1">Read Replica 2</text>
      <text x="65" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">Port 3306 (Read)</text>
      <rect x="15" y="56" width="100" height="18" rx="3" fill="#e0f2fe"/>
      <text x="65" y="69" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">Weight: 100</text>
    </g>

    <!-- RO N -->
    <g transform="translate(330, 48)">
      <rect width="130" height="85" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="65" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0369a1">Read Replica N</text>
      <text x="65" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">Port 3306 (Read)</text>
      <rect x="15" y="56" width="100" height="18" rx="3" fill="#e0f2fe"/>
      <text x="65" y="69" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">Weight: 100</text>
    </g>
  </g>
</svg>