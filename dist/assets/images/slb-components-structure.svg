<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-card" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- Top Container: LoadBalancer Instance -->
  <rect x="40" y="25" width="760" height="150" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  
  <!-- LoadBalancer Header Label & Icon -->
  <g transform="translate(65, 38)">
    <!-- SLB Interconnect Icon -->
    <circle cx="12" cy="18" r="4" fill="#0284c7"/>
    <circle cx="28" cy="10" r="4" fill="#0284c7"/>
    <circle cx="28" cy="26" r="4" fill="#0284c7"/>
    <line x1="12" y1="18" x2="28" y2="10" stroke="#0284c7" stroke-width="2"/>
    <line x1="12" y1="18" x2="28" y2="26" stroke="#0284c7" stroke-width="2"/>
    <text x="40" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-style="italic" font-weight="800" fill="#0369a1">LoadBalancer</text>
  </g>

  <!-- Listener 1 Box -->
  <g transform="translate(100, 75)">
    <rect width="280" height="75" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.8" stroke-dasharray="5 5"/>
    <text x="140" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#c2410c">Listener_1</text>
    <text x="140" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ea580c">Port 80 (TCP / HTTP)</text>
  </g>

  <!-- Listener 2 Box -->
  <g transform="translate(460, 75)">
    <rect width="280" height="75" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" stroke-dasharray="5 5"/>
    <text x="140" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#047857">Listener_2</text>
    <text x="140" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#059669">Port 443 (TCP / HTTPS)</text>
  </g>

  <!-- Bottom Container: Backend Server Group -->
  <rect x="40" y="275" width="760" height="150" rx="12" fill="#f8fafc" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 6"/>

  <!-- Routing Lines from Listener 1 (Orange) -->
  <!-- To Server 1 -->
  <line x1="210" y1="150" x2="160" y2="305" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <!-- To Server 2 -->
  <line x1="240" y1="150" x2="390" y2="305" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <!-- To Server 3 -->
  <line x1="270" y1="150" x2="630" y2="305" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Routing Lines from Listener 2 (Green) -->
  <!-- To Server 1 -->
  <line x1="570" y1="150" x2="210" y2="305" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <!-- To Server 2 -->
  <line x1="600" y1="150" x2="440" y2="305" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <!-- To Server 3 -->
  <line x1="630" y1="150" x2="680" y2="305" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Server 1 Card -->
  <g transform="translate(80, 310)">
    <rect width="200" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-card)"/>
    <!-- ECS Server Icon -->
    <g transform="translate(20, 24)">
      <rect width="28" height="8" rx="2" fill="#0284c7"/>
      <circle cx="23" cy="28" r="1.5" fill="#ffffff"/>
      <rect y="12" width="28" height="8" rx="2" fill="#0284c7"/>
      <rect y="24" width="28" height="8" rx="2" fill="#0284c7"/>
    </g>
    <text x="60" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">BackendServer_1</text>
    <text x="60" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">ECS Instance</text>
  </g>

  <!-- Server 2 Card -->
  <g transform="translate(320, 310)">
    <rect width="200" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-card)"/>
    <!-- ECS Server Icon -->
    <g transform="translate(20, 24)">
      <rect width="28" height="8" rx="2" fill="#0284c7"/>
      <rect y="12" width="28" height="8" rx="2" fill="#0284c7"/>
      <rect y="24" width="28" height="8" rx="2" fill="#0284c7"/>
    </g>
    <text x="60" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">BackendServer_2</text>
    <text x="60" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">ECS Instance</text>
  </g>

  <!-- Server 3 Card -->
  <g transform="translate(560, 310)">
    <rect width="200" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-card)"/>
    <!-- ECS Server Icon -->
    <g transform="translate(20, 24)">
      <rect width="28" height="8" rx="2" fill="#0284c7"/>
      <rect y="12" width="28" height="8" rx="2" fill="#0284c7"/>
      <rect y="24" width="28" height="8" rx="2" fill="#0284c7"/>
    </g>
    <text x="60" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">BackendServer_3</text>
    <text x="60" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">ECS Instance</text>
  </g>
</svg>
