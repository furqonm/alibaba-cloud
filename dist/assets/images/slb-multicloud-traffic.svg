<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <marker id="mc-arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="mc-arr-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FF6A00"/>
    </marker>
    <marker id="mc-arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <filter id="mc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Ingress: Global Users -->
  <g transform="translate(265, 15)">
    <rect width="110" height="38" rx="19" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="55" y="24" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Client Ingress</text>
  </g>

  <!-- Middle Ingress: Global Traffic Manager (GTM / DNS) -->
  <g transform="translate(240, 75)" filter="url(#mc-shadow)">
    <rect width="160" height="46" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" fill="#0369a1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Global DNS / GTM</text>
  </g>
  <line x1="320" y1="53" x2="320" y2="73" stroke="#0284c7" stroke-width="2" marker-end="url(#mc-arr-blue)"/>

  <!-- Left Container: Alibaba Cloud -->
  <g transform="translate(20, 160)">
    <rect width="280" height="245" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="15" y="-12" width="110" height="24" rx="4" fill="#FF6A00"/>
    <text x="70" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Alibaba Cloud</text>

    <!-- SLB Node -->
    <g transform="translate(30, 25)" filter="url(#mc-shadow)">
      <rect width="220" height="45" rx="6" fill="#ffffff" stroke="#FF6A00" stroke-width="1.8"/>
      <text x="110" y="27" text-anchor="middle" fill="#c2410c" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SLB / ALB VIP</text>
    </g>

    <!-- ECS Fleet -->
    <g transform="translate(20, 95)">
      <rect width="115" height="55" rx="5" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
      <text x="57" y="32" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">ECS Instance</text>
      <circle cx="57" cy="12" r="3" fill="#10b981"/>
    </g>
    <g transform="translate(145, 95)">
      <rect width="115" height="55" rx="5" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
      <text x="57" y="32" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">ECS Instance</text>
      <circle cx="57" cy="12" r="3" fill="#10b981"/>
    </g>
    <g transform="translate(82, 165)">
      <rect width="115" height="55" rx="5" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
      <text x="57" y="32" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">ECS Instance</text>
      <circle cx="57" cy="12" r="3" fill="#10b981"/>
    </g>
    <line x1="140" y1="70" x2="80" y2="95" stroke="#ea580c" stroke-width="1.2"/>
    <line x1="140" y1="70" x2="200" y2="95" stroke="#ea580c" stroke-width="1.2"/>
  </g>

  <!-- Right Container: Secondary Cloud / On-Premise IDC -->
  <g transform="translate(340, 160)">
    <rect width="280" height="245" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="155" y="-12" width="110" height="24" rx="4" fill="#7c3aed"/>
    <text x="210" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Other Cloud / IDC</text>

    <!-- Secondary LB -->
    <g transform="translate(30, 25)" filter="url(#mc-shadow)">
      <rect width="220" height="45" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="110" y="27" text-anchor="middle" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Secondary LB</text>
    </g>

    <!-- App Servers -->
    <g transform="translate(20, 95)">
      <rect width="115" height="55" rx="5" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
      <text x="57" y="32" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">App Server</text>
      <circle cx="57" cy="12" r="3" fill="#10b981"/>
    </g>
    <g transform="translate(145, 95)">
      <rect width="115" height="55" rx="5" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
      <text x="57" y="32" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">App Server</text>
      <circle cx="57" cy="12" r="3" fill="#10b981"/>
    </g>
    <g transform="translate(82, 165)">
      <rect width="115" height="55" rx="5" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
      <text x="57" y="32" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">App Server</text>
      <circle cx="57" cy="12" r="3" fill="#10b981"/>
    </g>
    <line x1="140" y1="70" x2="80" y2="95" stroke="#7c3aed" stroke-width="1.2"/>
    <line x1="140" y1="70" x2="200" y2="95" stroke="#7c3aed" stroke-width="1.2"/>
  </g>

  <!-- Route from DNS to Alibaba Cloud (Primary Ingress) -->
  <line x1="280" y1="121" x2="160" y2="183" stroke="#FF6A00" stroke-width="2.5" marker-end="url(#mc-arr-orange)"/>

  <!-- Route from DNS to Other Cloud / IDC (Secondary Ingress) -->
  <line x1="360" y1="121" x2="480" y2="183" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#mc-arr-purple)"/>

  <!-- Hybrid Interconnect Tunnel (Bottom Bar) -->
  <g transform="translate(180, 425)">
    <rect width="280" height="34" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="140" y="21" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Express Connect / CEN / VPN Gateway</text>
  </g>
  <line x1="180" y1="442" x2="150" y2="405" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="460" y1="442" x2="490" y2="405" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>