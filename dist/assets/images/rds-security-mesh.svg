    <text x="30" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#475569">Zero public IP exposure;</text>
    <text x="30" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#475569">internal SDN routing only</text>

    <text x="22" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369a1">• IP Whitelist Groups</text>
    <text x="30" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#475569">Up to 1,000 IP entries across</text>
    <text x="30" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#475569">50 configurable groups</text>

    <text x="22" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369a1">• Security Group Binding</text>
    <text x="30" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#475569">Stateful ENI packet filter</text>
