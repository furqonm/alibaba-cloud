<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <filter id="shadow-sec" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Layer 1: Network Boundary -->
  <g transform="translate(30, 40)">
    <rect width="210" height="380" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow-sec)"/>
    <rect x="0" y="0" width="210" height="42" rx="10" fill="#0284c7"/>
    <rect x="0" y="32" width="210" height="10" fill="#0284c7"/>
    <text x="105" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Layer 1: Network Boundary</text>
    <text x="105" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28">🛡️</text>
    <text x="105" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0369a1">VPC Isolation &amp; ACL</text>

    <rect x="15" y="115" width="180" height="240" rx="6" fill="#f0f9ff"/>
    <text x="25" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">• Private VPC Access</text>
    <text x="35" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Zero public IP exposure by</text>
    <text x="35" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">default; accessible only in VPC</text>

    <text x="25" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">• IP Whitelist Groups</text>
    <text x="35" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Up to 1,000 IP entries across</text>
    <text x="35" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">50 independent groups</text>

    <text x="25" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">• Anti-DDoS &amp; WAF</text>
    <text x="35" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Real-time edge flood filtering</text>
    <text x="35" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">and SQL injection inspection</text>

    <text x="25" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">• Security Group Binding</text>
    <text x="35" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Stateful ENI microsegmentation</text>
  </g>

  <!-- Layer 2: In-Transit Encryption -->
  <g transform="translate(260, 40)">
    <rect width="210" height="380" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.8" filter="url(#shadow-sec)"/>
    <rect x="0" y="0" width="210" height="42" rx="10" fill="#10b981"/>
    <rect x="0" y="32" width="210" height="10" fill="#10b981"/>
    <text x="105" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Layer 2: In-Transit Security</text>
    <text x="105" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28">🔒</text>
    <text x="105" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#047857">SSL / TLS 1.3 Cryptography</text>

    <rect x="15" y="115" width="180" height="240" rx="6" fill="#f0fdf4"/>
    <text x="25" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">• One-Click TLS Enablement</text>
    <text x="35" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Enforces encrypted transport</text>
    <text x="35" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">between ECS and RDS nodes</text>

    <text x="25" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">• Custom CA Certificates</text>
    <text x="35" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Support for Alibaba Cloud CA or</text>
    <text x="35" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">custom enterprise certificates</text>

    <text x="25" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">• Force SSL Policy</text>
    <text x="35" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Rejects unencrypted plaintext</text>
    <text x="35" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">database login attempts</text>

    <text x="25" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">• Zero Application Code Shift</text>
    <text x="35" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Compatible with standard JDBC,</text>
    <text x="35" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">ODBC, and native clients</text>
  </g>

  <!-- Layer 3: At-Rest Encryption -->
  <g transform="translate(490, 40)">
    <rect width="210" height="380" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadow-sec)"/>
    <rect x="0" y="0" width="210" height="42" rx="10" fill="#f59e0b"/>
    <rect x="0" y="32" width="210" height="10" fill="#f59e0b"/>
    <text x="105" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Layer 3: Data-at-Rest TDE</text>
    <text x="105" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28">🔑</text>
    <text x="105" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#b45309">Transparent Data Encryption</text>

    <rect x="15" y="115" width="180" height="240" rx="6" fill="#fffbeb"/>
    <text x="25" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">• Envelope Encryption (KMS)</text>
    <text x="35" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Integrated with Key Management</text>
    <text x="35" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Service (Customer Master Key)</text>

    <text x="25" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">• AES-256 &amp; SM4 Ciphers</text>
    <text x="35" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">International standard and</text>
    <text x="35" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">national cryptographic compliant</text>

    <text x="25" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">• Zero Schema Modifications</text>
    <text x="35" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Encryption/decryption executed</text>
    <text x="35" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">in-flight by database engine</text>

    <text x="25" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">• Encrypted Backups</text>
    <text x="35" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">All snapshots &amp; log archives are</text>
    <text x="35" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">cryptographically protected</text>
  </g>

  <!-- Layer 4: Audit & Governance -->
  <g transform="translate(720, 40)">
    <rect width="210" height="380" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8" filter="url(#shadow-sec)"/>
    <rect x="0" y="0" width="210" height="42" rx="10" fill="#8b5cf6"/>
    <rect x="0" y="32" width="210" height="10" fill="#8b5cf6"/>
    <text x="105" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Layer 4: Audit &amp; Governance</text>
    <text x="105" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28">📋</text>
    <text x="105" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6d28d9">DMS &amp; SQL Audit</text>

    <rect x="15" y="115" width="180" height="240" rx="6" fill="#faf5ff"/>
    <text x="25" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#6d28d9">• DMS Fine-Grained RBAC</text>
    <text x="35" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Row/column level masking and</text>
    <text x="35" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">multi-tier approval workflows</text>

    <text x="25" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#6d28d9">• RAM Account Isolation</text>
    <text x="35" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Decouples cloud console actions</text>
    <text x="35" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">from internal database users</text>

    <text x="25" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#6d28d9">• Full SQL Audit Trail</text>
    <text x="35" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Logs who, what, when, query</text>
    <text x="35" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">latency, and impacted rows</text>

    <text x="25" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#6d28d9">• Regulatory Compliance</text>
    <text x="35" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">Complies with SOC 1/2/3, ISO</text>
    <text x="35" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">27001, and PCI-DSS Level 1</text>
  </g>
</svg>