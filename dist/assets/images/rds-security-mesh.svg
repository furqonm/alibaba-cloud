    <text x="22" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369a1">• Anti-DDoS &amp; WAF</text>
    <text x="30" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#475569">BGP edge scrubbing &amp;</text>
