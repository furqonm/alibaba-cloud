    <text x="30" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#475569">use official Alibaba Cloud CA</text>

    <text x="22" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857">• Force SSL Policy</text>
