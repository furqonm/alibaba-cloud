<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" height="auto">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Outer Restaurant Container -->
    <rect x="15" y="15" width="650" height="390" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Left Zone: Public Area / Dining Room -->
    <g filter="url(#shadow)">
      <rect x="30" y="32" width="260" height="356" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="5 4" />
      <rect x="45" y="44" width="230" height="28" rx="6" fill="#E0F2FE" />
      <text x="160" y="62" fill="#0369A1" font-size="12" font-weight="700" text-anchor="middle">Public Zone (Customer Area)</text>
    </g>

    <!-- Right Zone: Private Area / Kitchen -->
    <g filter="url(#shadow)">
      <rect x="350" y="32" width="300" height="356" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" />
      <rect x="365" y="44" width="270" height="28" rx="6" fill="#D1FAE5" />
      <text x="500" y="62" fill="#065F46" font-size="12" font-weight="700" text-anchor="middle">Private Zone (Kitchen Area)</text>
    </g>

    <!-- Center Partition Wall & Counter -->
    <!-- Top Wall Segment -->
    <rect x="305" y="32" width="30" height="72" rx="3" fill="#334155" stroke="#1E293B" stroke-width="1.5" />
    <line x1="305" y1="50" x2="335" y2="50" stroke="#475569" stroke-width="1.2" />
    <line x1="305" y1="68" x2="335" y2="68" stroke="#475569" stroke-width="1.2" />
    <line x1="305" y1="86" x2="335" y2="86" stroke="#475569" stroke-width="1.2" />
    
    <!-- Order Window / Counter Opening (Completely clear, no rotated text inside) -->
    <rect x="302" y="104" width="36" height="112" rx="4" fill="#FEF3C7" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4 3" />

    <!-- Service Window Label (Moved cleanly DOWN BELOW the window opening) -->
    <g filter="url(#shadow)">
      <rect x="265" y="218" width="110" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
      <text x="320" y="236" fill="#92400E" font-size="11" font-weight="800" text-anchor="middle">Service Window</text>
    </g>

    <!-- Bottom Wall Segment -->
    <rect x="305" y="248" width="30" height="140" rx="3" fill="#334155" stroke="#1E293B" stroke-width="1.5" />
    <line x1="305" y1="270" x2="335" y2="270" stroke="#475569" stroke-width="1.2" />
    <line x1="305" y1="295" x2="335" y2="295" stroke="#475569" stroke-width="1.2" />
    <line x1="305" y1="320" x2="335" y2="320" stroke="#475569" stroke-width="1.2" />
    <line x1="305" y1="345" x2="335" y2="345" stroke="#475569" stroke-width="1.2" />
    <line x1="305" y1="370" x2="335" y2="370" stroke="#475569" stroke-width="1.2" />
    <text x="320" y="305" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(-90 320 305)">Physical Wall</text>

    <!-- Customer Card -->
    <g filter="url(#shadow)">
      <rect x="42" y="86" width="105" height="136" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
      <!-- Customer Badge Icon -->
      <circle cx="94.5" cy="116" r="17" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1.2" />
      <circle cx="94.5" cy="111" r="5.5" fill="#0284C7" />
      <path d="M 85 127 C 85 120 89 119 94.5 119 C 100 119 104 120 104 127 Z" fill="#0284C7" />
      <!-- Title & Subtitle with generous spacing -->
      <text x="94.5" y="160" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">Customer</text>
      <text x="94.5" y="177" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">(External Client)</text>
      <rect x="52" y="189" width="85" height="18" rx="4" fill="#F1F5F9" />
      <text x="94.5" y="201" fill="#475569" font-size="9" font-weight="600" text-anchor="middle">Public Origin</text>
    </g>

    <!-- Cashier Card -->
    <g filter="url(#shadow)">
      <rect x="175" y="86" width="105" height="136" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" />
      <!-- Cashier Badge Icon -->
      <circle cx="227.5" cy="116" r="17" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.2" />
      <circle cx="227.5" cy="111" r="5.5" fill="#D97706" />
      <path d="M 218 127 C 218 120 222 119 227.5 119 C 233 119 237 120 237 127 Z" fill="#D97706" />
      <!-- Title & Subtitle with generous spacing -->
      <text x="227.5" y="160" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">Cashier</text>
      <text x="227.5" y="177" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">(Front Counter)</text>
      <rect x="185" y="189" width="85" height="18" rx="4" fill="#FEF3C7" />
      <text x="227.5" y="201" fill="#92400E" font-size="9" font-weight="600" text-anchor="middle">Trusted Proxy</text>
    </g>

    <!-- Cook / Chef Card -->
    <g filter="url(#shadow)">
      <rect x="365" y="86" width="115" height="136" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
      <!-- Chef Badge Icon -->
      <circle cx="422.5" cy="116" r="17" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1.2" />
      <path d="M 416 108 C 416 102 419 100 422.5 100 C 426 100 429 102 429 108 Z" fill="#FFFFFF" stroke="#059669" stroke-width="1" />
      <circle cx="422.5" cy="112" r="5" fill="#059669" />
      <path d="M 413 127 C 413 120 417 119 422.5 119 C 428 119 432 120 432 127 Z" fill="#059669" />
      <!-- Title & Subtitle with generous spacing -->
      <text x="422.5" y="160" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">Cook / Chef</text>
      <text x="422.5" y="177" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">(Core Worker)</text>
      <rect x="377" y="189" width="91" height="18" rx="4" fill="#D1FAE5" />
      <text x="422.5" y="201" fill="#065F46" font-size="9" font-weight="600" text-anchor="middle">Internal Logic</text>
    </g>

    <!-- Kitchen Pantry Card -->
    <g filter="url(#shadow)">
      <rect x="520" y="86" width="115" height="136" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
      <!-- Pantry Badge Icon -->
      <circle cx="577.5" cy="116" r="17" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1.2" />
      <rect x="568" y="107" width="19" height="4" rx="1" fill="#059669" />
      <rect x="568" y="114" width="19" height="4" rx="1" fill="#059669" />
      <rect x="568" y="121" width="19" height="4" rx="1" fill="#059669" />
      <!-- Title & Subtitle with generous spacing -->
      <text x="577.5" y="160" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">Pantry</text>
      <text x="577.5" y="177" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">(Protected Data)</text>
      <rect x="530" y="189" width="95" height="18" rx="4" fill="#D1FAE5" />
      <text x="577.5" y="201" fill="#065F46" font-size="9" font-weight="600" text-anchor="middle">Recipes &amp; Food</text>
    </g>

    <!-- Allowed Flow 1: Customer to Cashier (Order & Payment) -->
    <!-- Segment 1: From Customer to Order Badge -->
    <path d="M 94.5 222 L 94.5 250 L 115 250" fill="none" stroke="#0284C7" stroke-width="2.5" />
    <g filter="url(#shadow)">
      <rect x="115" y="239" width="90" height="22" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2" />
      <text x="160" y="254" fill="#0369A1" font-size="10" font-weight="700" text-anchor="middle">1. Place Order</text>
    </g>
    <!-- Segment 2: From Order Badge into Cashier bottom -->
    <path d="M 205 250 L 227.5 250 L 227.5 228" fill="none" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrow-blue)" />

    <!-- Allowed Flow 2: Cashier to Chef through Service Window -->
    <!-- Segment 1: From Cashier right edge to Ticket Badge in window -->
    <path d="M 280 150 L 285 150" stroke="#059669" stroke-width="2.5" />
    <g filter="url(#shadow)">
      <rect x="282" y="138" width="76" height="24" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.2" />
      <text x="320" y="154" fill="#065F46" font-size="9.5" font-weight="700" text-anchor="middle">2. Pass Ticket</text>
    </g>
    <!-- Segment 2: From Ticket Badge into Chef left edge -->
    <path d="M 358 150 L 365 150" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- Chef to Pantry Connection -->
    <path d="M 480 150 L 512 150" stroke="#059669" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arrow-green)" />
    <rect x="485" y="127" width="30" height="16" rx="3" fill="#D1FAE5" stroke="#059669" stroke-width="1" />
    <text x="500" y="139" fill="#065F46" font-size="8.5" font-weight="700" text-anchor="middle">Fetch</text>

    <!-- BLOCKED FLOW: Direct Customer Access to Kitchen -->
    <!-- Segment 1: From Customer to Blocked Badge -->
    <path d="M 94.5 222 L 94.5 330 L 115 330" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 4" />
    <!-- Blocked Badge -->
    <g filter="url(#shadow)">
      <rect x="115" y="318" width="165" height="24" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2" />
      <text x="197.5" y="334" fill="#991B1B" font-size="10" font-weight="800" text-anchor="middle">&#10006; Direct Entry Blocked</text>
    </g>
    <!-- Segment 2: From Blocked Badge hitting the Wall Barrier -->
    <path d="M 280 330 L 302 330" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)" />
    <rect x="295" y="318" width="20" height="24" rx="4" fill="#EF4444" stroke="#B91C1C" stroke-width="1" />
    <text x="305" y="335" fill="#FFFFFF" font-size="11" font-weight="900" text-anchor="middle">&#9940;</text>

    <!-- Kitchen Isolation Summary Box -->
    <g filter="url(#shadow)">
      <rect x="365" y="260" width="270" height="105" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.2" />
      <rect x="365" y="260" width="270" height="24" rx="8" fill="#ECFDF5" />
      <text x="500" y="276" fill="#065F46" font-size="11" font-weight="700" text-anchor="middle">Kitchen Isolation Model (Private Network)</text>
      <text x="378" y="303" fill="#334155" font-size="9.5" font-weight="600">&#10004; Cooking &amp; recipes isolated from external clients</text>
      <text x="378" y="323" fill="#334155" font-size="9.5" font-weight="600">&#10004; All customer requests validated by the cashier</text>
      <text x="378" y="343" fill="#334155" font-size="9.5" font-weight="600">&#10004; Zero uncoordinated chaos in the food prep line</text>
    </g>
  </g>
</svg>