<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="auto">
  <defs>
    <filter id="shadow-mp" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Client Application on Left -->
    <g filter="url(#shadow-mp)">
      <rect x="25" y="45" width="190" height="290" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
      <rect x="25" y="45" width="190" height="36" rx="10" fill="#E0F2FE" />
      <rect x="25" y="70" width="190" height="11" fill="#E0F2FE" />
      <text x="120" y="68" fill="#0369A1" font-size="12" font-weight="700" text-anchor="middle">Client Application</text>
      
      <!-- Large File Chunking -->
      <rect x="40" y="95" width="160" height="40" rx="5" fill="#334155" />
      <text x="120" y="115" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Large File (e.g. 50 GB)</text>
      <text x="120" y="128" fill="#94A3B8" font-size="8.5" text-anchor="middle">Slices into 100MB - 5GB parts</text>

      <g transform="translate(40, 150)">
        <rect x="0" y="0" width="160" height="24" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" />
        <text x="80" y="16" fill="#0369A1" font-size="9" font-weight="600" text-anchor="middle">Part 1 (Bytes 0 - 100MB)</text>

        <rect x="0" y="32" width="160" height="24" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" />
        <text x="80" y="48" fill="#0369A1" font-size="9" font-weight="600" text-anchor="middle">Part 2 (Bytes 100M - 200MB)</text>

        <rect x="0" y="64" width="160" height="24" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" />
        <text x="80" y="80" fill="#0369A1" font-size="9" font-weight="600" text-anchor="middle">Part ... (Up to 10,000 parts)</text>

        <rect x="0" y="96" width="160" height="24" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" />
        <text x="80" y="112" fill="#0369A1" font-size="9" font-weight="600" text-anchor="middle">Part N (Final Byte Chunk)</text>
      </g>
    </g>

    <!-- Phase 1: Initiate -->
    <path d="M 215 90 L 450 90" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-blue)" />
    <rect x="250" y="72" width="165" height="20" rx="3" fill="#E0F2FE" />
    <text x="332" y="85" fill="#0369A1" font-size="9" font-weight="700" text-anchor="middle">1. InitiateMultipartUpload</text>

    <!-- Return Upload ID -->
    <path d="M 450 115 L 215 115" stroke="#059669" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-green)" />
    <text x="332" y="132" fill="#065F46" font-size="9" font-weight="700" text-anchor="middle">Returns unique Upload ID</text>

    <!-- Phase 2: Parallel Uploads -->
    <path d="M 215 170 L 450 170" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-blue)" />
    <path d="M 215 195 L 450 195" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-blue)" />
    <path d="M 215 220 L 450 220" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-blue)" />
    <rect x="255" y="180" width="155" height="24" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="1" />
    <text x="332.5" y="196" fill="#C2410C" font-size="9.5" font-weight="800" text-anchor="middle">2. UploadPart (Parallel Streams)</text>

    <!-- Phase 3: Complete -->
    <path d="M 215 275 L 450 275" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)" />
    <rect x="250" y="258" width="165" height="20" rx="3" fill="#D1FAE5" />
    <text x="332" y="271" fill="#065F46" font-size="9" font-weight="700" text-anchor="middle">3. CompleteMultipartUpload</text>

    <!-- Target OSS Bucket on Right -->
    <g filter="url(#shadow-mp)">
      <rect x="460" y="45" width="375" height="290" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" />
      <rect x="460" y="45" width="375" height="36" rx="10" fill="#FFEDD5" />
      <rect x="460" y="70" width="375" height="11" fill="#FFEDD5" />
      <text x="647.5" y="68" fill="#C2410C" font-size="12" font-weight="700" text-anchor="middle">Alibaba Cloud OSS Bucket</text>

      <!-- Assembled Object -->
      <g transform="translate(485, 95)">
        <rect x="0" y="0" width="325" height="60" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
        <text x="15" y="22" fill="#0F172A" font-size="11" font-weight="700">Unified Assembled Object (Up to 48.8 TB)</text>
        <text x="15" y="42" fill="#64748B" font-size="9.5">Parts verified via MD5 ETags and stitched seamlessly in Pangu</text>
      </g>

      <!-- Key Advantages Box -->
      <g transform="translate(485, 170)">
        <rect x="0" y="0" width="325" height="145" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.2" />
        <text x="15" y="24" fill="#065F46" font-size="11" font-weight="700">Enterprise Architectural Advantages:</text>
        <text x="15" y="48" fill="#334155" font-size="10">• High Concurrency: Saturates high-bandwidth NICs</text>
        <text x="15" y="70" fill="#334155" font-size="10">• Resumability: Network dropout only retries failed part</text>
        <text x="15" y="92" fill="#334155" font-size="10">• Dynamic Sizing: Parts can vary between 100KB to 5GB</text>
        <text x="15" y="114" fill="#334155" font-size="10">• Lifecycle Protection: Auto-abort uncompleted parts</text>
        <text x="15" y="132" fill="#065F46" font-size="9" font-weight="700">✔ Eliminates single large-file HTTP timeout risks</text>
      </g>
    </g>
  </g>
</svg>