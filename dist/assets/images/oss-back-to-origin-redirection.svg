<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="100%" height="100%">
  <!-- 1. Source Box (Top) -->
  <rect x="285" y="30" width="150" height="110" rx="4" fill="#128ced"/>
  <text x="360" y="95" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="22px" font-weight="700">Source</text>

  <!-- 2. Client Box (Bottom-Left) -->
  <rect x="50" y="340" width="150" height="110" rx="4" fill="#128ced"/>
  <text x="125" y="405" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="22px" font-weight="700">Client</text>

  <!-- 3. OSS Box (Bottom-Right) -->
  <rect x="520" y="340" width="150" height="110" rx="4" fill="#128ced"/>
  <text x="595" y="405" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="22px" font-weight="700">OSS</text>

  <!-- Arrow 2: OSS -> Client (pointing LEFT) -->
  <line x1="520" y1="368" x2="216" y2="368" stroke="#128ced" stroke-width="3"/>
  <polygon points="200,368 216,361 216,375" fill="#128ced"/>
  <text x="360" y="356" text-anchor="middle" fill="#0f172a" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14px" font-weight="700">2. Return redirected location</text>

  <!-- Arrow 1: Client -> OSS (pointing RIGHT) -->
  <line x1="200" y1="416" x2="504" y2="416" stroke="#128ced" stroke-width="3"/>
  <polygon points="520,416 504,409 504,423" fill="#128ced"/>
  <text x="360" y="440" text-anchor="middle" fill="#0f172a" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14px" font-weight="700">1. Request for resource</text>

  <!-- Diagonal Arrow 3: Client -> Source (pointing UP-RIGHT) -->
  <line x1="200" y1="325" x2="335" y2="155" stroke="#128ced" stroke-width="3"/>
  <g transform="translate(345, 143) rotate(-51.5)">
    <polygon points="0,0 -16,-7 -16,7" fill="#128ced"/>
  </g>
  <text x="270" y="248" text-anchor="start" fill="#0f172a" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13px" font-weight="700">3. Request resource from</text>
  <text x="270" y="268" text-anchor="start" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12px" font-weight="600">the redirected location</text>

  <!-- Diagonal Arrow 4: Source -> Client (pointing DOWN-LEFT) -->
  <line x1="270" y1="130" x2="135" y2="300" stroke="#128ced" stroke-width="3"/>
  <g transform="translate(125, 312) rotate(128.5)">
    <polygon points="0,0 -16,-7 -16,7" fill="#128ced"/>
  </g>
  <text x="180" y="195" text-anchor="end" fill="#0f172a" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13px" font-weight="700">4. Return requested</text>
  <text x="180" y="215" text-anchor="end" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12px" font-weight="600">resource</text>
</svg>