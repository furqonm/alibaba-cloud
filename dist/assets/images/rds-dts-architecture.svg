<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Arrow marker in elegant slate -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#475569" stroke="#475569" stroke-width="1" stroke-linejoin="round"/>
    </marker>
    <!-- Filter for subtle, professional card shadow -->
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Outer DTS Boundary (Dash-Dot Line matching original) -->
  <rect x="210" y="24" width="570" height="466" rx="8" 
        fill="#FAFAFA" stroke="#64748B" stroke-width="1.8" stroke-dasharray="12 4 3 4"/>
  <text x="495" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155" letter-spacing="0.3">
    DataTransmission Service(DTS)
  </text>

  <!-- ==================== FLOW 1: MIGRATING SCHEMA ==================== -->
  <!-- Line from Source DB to Schema Migration box -->
  <path d="M 115 115 L 115 68 L 246 68" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  
  <!-- Box: (1) Migrating Schema -->
  <rect x="250" y="44" width="168" height="48" rx="4" 
        fill="#FFFFFF" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#card-shadow)"/>
  <text x="334" y="73" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1E293B">
    (1) Migrating Schema
  </text>
  
  <!-- Line from Schema Migration box to Target DB -->
  <path d="M 418 68 L 885 68 L 885 111" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>


  <!-- ==================== FLOW 2: MIGRATING EXISTING DATA ==================== -->
  <!-- Line from Source DB to Existing Data box -->
  <path d="M 190 205 L 430 205" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Box: (2) Migrating Existing Data -->
  <rect x="434" y="177" width="160" height="56" rx="4" 
        fill="#FFFFFF" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#card-shadow)"/>
  <text x="514" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#1E293B">
    (2) Migrating
  </text>
  <text x="514" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#1E293B">
    Existing Data
  </text>

  <!-- Line from Existing Data box to Target DB -->
  <path d="M 594 205 L 806 205" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>


  <!-- ==================== FLOW 3: CONTINUOUS DATA REPLICATION ==================== -->
  <!-- Line from Source DB to Continuous Replication container -->
  <path d="M 115 295 L 115 348 L 392 348" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Dashed Container: (3) Continuous data replication -->
  <rect x="396" y="268" width="318" height="174" rx="6" 
        fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/>
  
  <!-- Sub-box 1: Capture Changes on the Source Database -->
  <rect x="432" y="290" width="262" height="48" rx="4" 
        fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="563" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#1E293B">
    Capture Changes on
  </text>
  <text x="563" y="328" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#1E293B">
    the Source Database
  </text>

  <!-- Sub-box 2: Apply change data -->
  <rect x="554" y="356" width="140" height="44" rx="4" 
        fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="624" y="383" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#1E293B">
    Apply change data
  </text>

  <!-- Label: (3) Continuous data replication -->
  <text x="555" y="424" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#334155">
    (3) Continuous data replication
  </text>

  <!-- Line from Apply change data to Target DB -->
  <path d="M 624 400 L 624 430 L 885 430 L 885 299" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>


  <!-- ==================== LEFT BOX: SOURCE DATABASE ==================== -->
  <rect x="40" y="115" width="150" height="180" rx="6" 
        fill="#FFFFFF" stroke="#475569" stroke-width="1.8" filter="url(#card-shadow)"/>
  
  <!-- Database Cylinder Icon (with plus) -->
  <g transform="translate(115, 172)">
    <!-- Top Ellipse -->
    <ellipse cx="0" cy="-24" rx="28" ry="9" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
    <!-- Body Segment 1 -->
    <path d="M -28 -24 V -10 A 28 9 0 0 0 28 -10 V -24" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
    <!-- Body Segment 2 -->
    <path d="M -28 -10 V 4 A 28 9 0 0 0 28 4 V -10" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
    <!-- Body Segment 3 -->
    <path d="M -28 4 V 18 A 28 9 0 0 0 28 18 V 4" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
    <!-- Plus Circle Badge -->
    <circle cx="18" cy="14" r="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
    <line x1="13" y1="14" x2="23" y2="14" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="18" y1="9" x2="18" y2="19" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="115" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A">
    Source Database
  </text>


  <!-- ==================== RIGHT BOX: TARGET DATABASE ==================== -->
  <rect x="810" y="115" width="150" height="180" rx="6" 
        fill="#FFFFFF" stroke="#475569" stroke-width="1.8" filter="url(#card-shadow)"/>

  <!-- Database Cylinder Icon (with plus) -->
  <g transform="translate(885, 172)">
    <!-- Top Ellipse -->
    <ellipse cx="0" cy="-24" rx="28" ry="9" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
    <!-- Body Segment 1 -->
    <path d="M -28 -24 V -10 A 28 9 0 0 0 28 -10 V -24" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
    <!-- Body Segment 2 -->
    <path d="M -28 -10 V 4 A 28 9 0 0 0 28 4 V -10" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
    <!-- Body Segment 3 -->
    <path d="M -28 4 V 18 A 28 9 0 0 0 28 18 V 4" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
    <!-- Plus Circle Badge -->
    <circle cx="18" cy="14" r="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
    <line x1="13" y1="14" x2="23" y2="14" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="18" y1="9" x2="18" y2="19" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="885" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A">
    Target Database
  </text>

</svg>
