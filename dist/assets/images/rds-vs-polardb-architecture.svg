<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <filter id="shadow-p" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Left: Traditional RDS (Shared-Nothing) -->
  <g transform="translate(30, 20)">
    <rect width="420" height="420" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow-p)"/>
    <rect x="0" y="0" width="420" height="48" rx="12" fill="#64748b"/>
    <rect x="0" y="38" width="420" height="10" fill="#64748b"/>
    <text x="210" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff">ApsaraDB for RDS (Shared-Nothing)</text>

    <!-- Master Node -->
    <g transform="translate(25, 65)">
      <rect width="170" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="85" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Primary Node</text>
      <text x="85" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0284c7">Read / Write Engine</text>
      <rect x="15" y="58" width="140" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">Dedicated Disk Storage A</text>
      <text x="85" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748b">100% Storage Duplication</text>
    </g>

    <!-- Standby Node -->
    <g transform="translate(225, 65)">
      <rect width="170" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="85" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Secondary Node</text>
      <text x="85" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748b">Standby Replica</text>
      <rect x="15" y="58" width="140" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">Dedicated Disk Storage B</text>
      <text x="85" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748b">100% Storage Duplication</text>
    </g>

    <!-- Replication Sync Arrow -->
    <path d="M 195 120 L 225 120" stroke="#f97316" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="210" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ea580c">Binlog</text>

    <!-- Read-Only Replicas -->
    <rect x="25" y="195" width="370" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="210" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155">Read-Only Replicas (Up to 10)</text>
    <text x="210" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">Each RO node requires independent storage copy &amp; binlog parsing</text>
    <text x="210" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#c2410c">Replication Lag may occur under heavy write bursts</text>

    <!-- Architectural Tradeoffs -->
    <rect x="25" y="300" width="370" height="105" rx="6" fill="#f1f5f9"/>
    <text x="35" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155">• Storage Scaling: Coupled with compute instances</text>
    <text x="35" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155">• Max Database Storage: Up to 32 TB (Cloud Disk)</text>
    <text x="35" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155">• Best Fit: Standard enterprise workloads, cross-engine flexibility</text>
    <text x="35" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7">• Engines: MySQL, PostgreSQL, SQL Server, MariaDB</text>
  </g>

  <!-- Right: PolarDB (Shared-Distributed Storage) -->
  <g transform="translate(510, 20)">
    <rect width="420" height="420" rx="12" fill="#ffffff" stroke="#ff6a00" stroke-width="2" filter="url(#shadow-p)"/>
    <rect x="0" y="0" width="420" height="48" rx="12" fill="#ff6a00"/>
    <rect x="0" y="38" width="420" height="10" fill="#ff6a00"/>
    <text x="210" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff">PolarDB (Cloud-Native Shared-Storage)</text>

    <!-- Compute Nodes Cluster -->
    <rect x="25" y="65" width="370" height="110" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="210" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#c2410c">Decoupled Serverless Compute Fleet</text>

    <g transform="translate(40, 100)">
      <rect width="95" height="60" rx="4" fill="#ffffff" stroke="#f97316" stroke-width="1.2"/>
      <text x="47" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#ea580c">Primary (RW)</text>
      <text x="47" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#15803d">Writes</text>
    </g>
    <g transform="translate(160, 100)">
      <rect width="95" height="60" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
      <text x="47" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0284c7">Read Replica 1</text>
      <text x="47" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#0284c7">Shared Reads</text>
    </g>
    <g transform="translate(280, 100)">
      <rect width="95" height="60" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
      <text x="47" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0284c7">Up to 15 ROs</text>
      <text x="47" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#0284c7">Milliseconds Scale</text>
    </g>

    <!-- PolarFileSystem Shared Storage -->
    <rect x="25" y="195" width="370" height="90" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="210" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#15803d">PolarStore / PolarFileSystem (Shared Pool)</text>
    <text x="210" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#166534">Single distributed storage pool shared across all nodes via RDMA</text>
    <text x="210" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857">Zero Storage Duplication &amp; Zero Replication Lag (Physical Log Sync)</text>

    <!-- Architectural Tradeoffs -->
    <rect x="25" y="300" width="370" height="105" rx="6" fill="#fff7ed"/>
    <text x="35" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9a3412">• Storage Auto-Scaling: Up to 500 TB with zero downtime</text>
    <text x="35" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9a3412">• Spin up new Read Replica in &lt; 5 minutes (no data copy)</text>
    <text x="35" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9a3412">• Hyper-scale I/O concurrency &amp; e-commerce massive peak loads</text>
    <text x="35" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ea580c">• 100% compatible with MySQL, PostgreSQL &amp; Oracle syntax</text>
  </g>
</svg>