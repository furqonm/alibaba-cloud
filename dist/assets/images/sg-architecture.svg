<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 680" width="100%" height="100%">
  <defs>
    <!-- Arrow Markers -->
    <marker id="sg-arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1366ec"/>
    </marker>
    <marker id="sg-arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="sg-arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="sg-shadow" x="-3%" y="-2%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="540" height="680" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- ==================== TOP: INBOUND SECURITY GROUP RULE TABLE ==================== -->
    <g transform="translate(25, 20)" filter="url(#sg-shadow)">
      <!-- Table Container -->
      <rect x="0" y="0" width="490" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Table Header Title -->
      <rect x="0" y="0" width="490" height="28" rx="8" fill="#eff6ff"/>
      <rect x="0" y="20" width="490" height="8" fill="#eff6ff"/>
      <line x1="0" y1="28" x2="490" y2="28" stroke="#cbd5e1" stroke-width="1"/>
      <text x="245" y="19" fill="#1e3a8a" font-size="12" font-weight="700" text-anchor="middle">Inbound Security Group Rule in Security Group 1</text>
      
      <!-- Table Column Headers -->
      <rect x="10" y="34" width="470" height="24" rx="4" fill="#f1f5f9"/>
      <text x="65" y="50" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">Protocol</text>
      <text x="200" y="50" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">Authorization Object (Source)</text>
      <text x="350" y="50" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">Port Range</text>
      <text x="440" y="50" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">Action</text>
      
      <!-- Table Data Row -->
      <line x1="10" y1="60" x2="480" y2="60" stroke="#e2e8f0" stroke-width="1"/>
      <text x="65" y="77" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">ICMP</text>
      <text x="200" y="77" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">0.0.0.0/0</text>
      <text x="350" y="77" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">-1/-1</text>
      <rect x="420" y="66" width="40" height="17" rx="3" fill="#dcfce7"/>
      <text x="440" y="79" fill="#15803d" font-size="11" font-weight="700" text-anchor="middle">Allow</text>
    </g>

    <!-- Connector Line from Rule Table to Inbound Traffic Flow -->
    <path d="M 140 112 L 140 148" fill="none" stroke="#1366ec" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="140" cy="148" r="3" fill="#1366ec"/>

    <!-- ==================== MIDDLE: INTERNET CLOUD ZONE ==================== -->
    <g transform="translate(180, 126)">
      <!-- Internet Cloud Icon & Badge -->
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <!-- Cloud Icon SVG -->
      <g transform="translate(16, 11)" fill="#1366ec">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
      </g>
      <text x="105" y="26" fill="#1e40af" font-size="14" font-weight="700" text-anchor="middle">Internet</text>
    </g>

    <!-- Inbound & Outbound Traffic Arrows -->
    <!-- Inbound Arrow (Internet -> ECS 1) -->
    <path d="M 230 168 L 230 205 L 140 205 L 140 375" fill="none" stroke="#1366ec" stroke-width="2.5" marker-end="url(#sg-arr-blue)"/>
    <g transform="translate(35, 178)" filter="url(#sg-shadow)">
      <rect x="0" y="0" width="155" height="38" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="77.5" y="16" fill="#1366ec" font-size="11" font-weight="700" text-anchor="middle">Inbound Traffic</text>
      <text x="77.5" y="30" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">(Match Inbound Rules)</text>
    </g>

    <!-- Outbound Arrow (ECS 1 -> Internet) -->
    <path d="M 165 375 L 165 240 L 310 240 L 310 168" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#sg-arr-green)"/>
    <g transform="translate(330, 185)" filter="url(#sg-shadow)">
      <rect x="0" y="0" width="175" height="38" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
      <text x="87.5" y="16" fill="#15803d" font-size="11" font-weight="700" text-anchor="middle">Outbound Traffic</text>
      <text x="87.5" y="30" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">(Allow All Traffic by Default)</text>
    </g>

    <!-- ==================== VPC CONTAINER ==================== -->
    <g transform="translate(25, 275)">
      <!-- Outer VPC Rectangle -->
      <rect x="0" y="0" width="490" height="385" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      
      <!-- VPC Header Tag -->
      <g transform="translate(14, 12)">
        <rect x="0" y="0" width="76" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <!-- VPC Cloud Icon -->
        <path d="M 8 16 C 6 16 5 14 5 12 C 5 10 7 8 9 8 C 10 6 13 6 14 8 C 16 8 18 10 18 12 C 18 14 17 16 15 16 Z" fill="#0284c7"/>
        <text x="44" y="17" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">VPC</text>
      </g>

      <!-- ==================== SECURITY GROUP 1 CONTAINER ==================== -->
      <!-- Spans across both ECS instances in vSwitch 1 and vSwitch 2 -->
      <g transform="translate(20, 52)">
        <rect x="0" y="0" width="450" height="315" rx="8" fill="#eff6ff" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="6 4"/>
        
        <!-- Security Group Header Tag -->
        <g transform="translate(14, 12)">
          <rect x="0" y="0" width="135" height="24" rx="4" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
          <!-- Shield Icon -->
          <path d="M 8 5 L 14 3 L 20 5 C 20 12 14 16 14 16 C 14 16 8 12 8 5 Z" fill="#2563eb"/>
          <text x="74" y="17" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">Security Group 1</text>
        </g>

        <!-- ==================== LEFT: vSwitch 1 ==================== -->
        <g transform="translate(20, 48)">
          <rect x="0" y="0" width="190" height="245" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
          
          <!-- vSwitch 1 Label -->
          <g transform="translate(10, 10)">
            <rect x="0" y="0" width="70" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
            <text x="35" y="14" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">vSwitch 1</text>
          </g>

          <!-- Primary ENI 1 -->
          <g transform="translate(15, 42)">
            <rect x="0" y="0" width="160" height="32" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
            <!-- NIC Icon -->
            <rect x="8" y="8" width="16" height="16" rx="2" fill="#16a34a"/>
            <text x="90" y="20" fill="#15803d" font-size="11" font-weight="700" text-anchor="middle">Primary ENI</text>
          </g>

          <!-- Arrow from ENI down to ECS 1 -->
          <line x1="95" y1="74" x2="95" y2="92" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2"/>

          <!-- ECS 1 Instance Card -->
          <g transform="translate(15, 96)">
            <rect x="0" y="0" width="160" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
            <!-- Server Icon -->
            <g transform="translate(56, 14)">
              <rect x="0" y="0" width="48" height="12" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
              <circle cx="8" cy="6" r="2" fill="#0284c7"/>
              <rect x="0" y="15" width="48" height="12" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
              <circle cx="8" cy="21" r="2" fill="#0284c7"/>
              <rect x="0" y="30" width="48" height="12" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
              <circle cx="8" cy="36" r="2" fill="#16a34a"/>
            </g>
            <text x="80" y="78" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">ECS 1</text>
            <rect x="25" y="90" width="110" height="22" rx="4" fill="#e0f2fe"/>
            <text x="80" y="105" fill="#0369a1" font-size="10" font-weight="600" text-anchor="middle">Elastic Compute</text>
          </g>
        </g>

        <!-- Inter-Instance Communication Arrow between ECS 1 & ECS 2 -->
        <g transform="translate(210, 165)">
          <line x1="0" y1="0" x2="30" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#sg-arr-blue)" marker-start="url(#sg-arr-blue)"/>
          <text x="15" y="-8" fill="#1e40af" font-size="9" font-weight="700" text-anchor="middle">Intranet</text>
        </g>

        <!-- ==================== RIGHT: vSwitch 2 ==================== -->
        <g transform="translate(240, 48)">
          <rect x="0" y="0" width="190" height="245" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
          
          <!-- vSwitch 2 Label -->
          <g transform="translate(10, 10)">
            <rect x="0" y="0" width="70" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
            <text x="35" y="14" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">vSwitch 2</text>
          </g>

          <!-- Primary ENI 2 -->
          <g transform="translate(15, 42)">
            <rect x="0" y="0" width="160" height="32" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
            <!-- NIC Icon -->
            <rect x="8" y="8" width="16" height="16" rx="2" fill="#16a34a"/>
            <text x="90" y="20" fill="#15803d" font-size="11" font-weight="700" text-anchor="middle">Primary ENI</text>
          </g>

          <!-- Arrow from ENI down to ECS 2 -->
          <line x1="95" y1="74" x2="95" y2="92" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2"/>

          <!-- ECS 2 Instance Card -->
          <g transform="translate(15, 96)">
            <rect x="0" y="0" width="160" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
            <!-- Server Icon -->
            <g transform="translate(56, 14)">
              <rect x="0" y="0" width="48" height="12" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
              <circle cx="8" cy="6" r="2" fill="#0284c7"/>
              <rect x="0" y="15" width="48" height="12" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
              <circle cx="8" cy="21" r="2" fill="#0284c7"/>
              <rect x="0" y="30" width="48" height="12" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
              <circle cx="8" cy="36" r="2" fill="#16a34a"/>
            </g>
            <text x="80" y="78" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">ECS 2</text>
            <rect x="25" y="90" width="110" height="22" rx="4" fill="#e0f2fe"/>
            <text x="80" y="105" fill="#0369a1" font-size="10" font-weight="600" text-anchor="middle">Elastic Compute</text>
          </g>
        </g>

      </g>
    </g>

  </g>
</svg>