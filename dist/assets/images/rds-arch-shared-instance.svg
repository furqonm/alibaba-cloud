    <path d="M 205 138 L 205 155 M 445 138 L 445 155" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Shared Resource Pool Bar -->
    <rect x="90" y="155" width="470" height="38" rx="5" ry="5" fill="#f0f2f5" stroke="#cbd5e1" stroke-width="1.2" />
