<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <filter id="cardShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="mGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="mOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="mBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="840" height="460" fill="#f8fafc" rx="12"/>

  <text x="420" y="30" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Edge Cache Hit vs. Back-to-Origin Cache Miss Lifecycle</text>

  <!-- Left: Client Device -->
  <g transform="translate(30, 60)">
    <rect width="140" height="360" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="2" filter="url(#cardShadow2)"/>
    <rect width="140" height="38" rx="10" fill="#e0f2fe"/>
    <text x="70" y="24" fill="#0369a1" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Client Request</text>

    <g transform="translate(15, 60)">
      <circle cx="20" cy="20" r="16" fill="#0284c7"/>
      <text x="20" y="25" fill="#ffffff" font-size="14" text-anchor="middle">📱</text>
      <text x="45" y="16" fill="#1e293b" font-size="11" font-weight="600" font-family="system-ui, sans-serif">GET /logo.png</text>
      <text x="45" y="30" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">Accept: webp,avif</text>
    </g>

    <g transform="translate(15, 160)">
      <rect width="110" height="70" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="55" y="20" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Fast Response</text>
      <text x="55" y="38" fill="#047857" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">&lt; 10 ms</text>
      <text x="55" y="55" fill="#065f46" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">X-Cache: TCP_HIT</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="110" height="70" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <text x="55" y="20" fill="#9a3412" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Miss Response</text>
      <text x="55" y="38" fill="#c2410c" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">50 - 150 ms</text>
      <text x="55" y="55" fill="#9a3412" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">X-Cache: TCP_MISS</text>
    </g>
  </g>

  <!-- Middle: Edge PoP (L1 Node) -->
  <g transform="translate(230, 60)">
    <rect width="320" height="360" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#cardShadow2)"/>
    <rect width="320" height="38" rx="10" fill="#ffedd5"/>
    <text x="160" y="24" fill="#c2410c" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Alibaba Cloud CDN Edge Node (L1 PoP)</text>

    <!-- Cache Key Lookup Box -->
    <g transform="translate(20, 50)">
      <rect width="280" height="65" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
      <text x="140" y="22" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">🔍 Cache Key Generation &amp; Lookup</text>
      <text x="140" y="40" fill="#78350f" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Key = Scheme + Host + URI (+ Configured Query Params)</text>
      <text x="140" y="54" fill="#64748b" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Check NVMe SSD Cache Directory &amp; TTL Expiration</text>
    </g>

    <!-- Path A: Cache Hit Branch -->
    <g transform="translate(20, 130)">
      <rect width="280" height="85" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
      <text x="20" y="22" fill="#065f46" font-size="11" font-weight="800" font-family="system-ui, sans-serif">✔ SCENARIO A: CACHE HIT (TTL Valid)</text>
      <text x="20" y="42" fill="#047857" font-size="10" font-family="system-ui, sans-serif">• Object exists in local edge storage and is not expired</text>
      <text x="20" y="58" fill="#047857" font-size="10" font-family="system-ui, sans-serif">• Edge directly serves response with Brotli/Gzip compression</text>
      <text x="20" y="74" fill="#047857" font-size="10" font-weight="700" font-family="system-ui, sans-serif">⚡ Zero origin load, zero transit backhaul latency</text>
    </g>

    <!-- Path B: Cache Miss Branch -->
    <g transform="translate(20, 230)">
      <rect width="280" height="110" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <text x="20" y="22" fill="#9a3412" font-size="11" font-weight="800" font-family="system-ui, sans-serif">✖ SCENARIO B: CACHE MISS / EXPIRED</text>
      <text x="20" y="42" fill="#9a3412" font-size="10" font-family="system-ui, sans-serif">• 1st: Query Regional L2 Aggregation Cache</text>
      <text x="20" y="58" fill="#9a3412" font-size="10" font-family="system-ui, sans-serif">• 2nd: Forward request via Origin Shield layer</text>
      <text x="20" y="74" fill="#9a3412" font-size="10" font-family="system-ui, sans-serif">• 3rd: Send HTTP Range GET to Origin Server</text>
      <text x="20" y="94" fill="#c2410c" font-size="10" font-weight="700" font-family="system-ui, sans-serif">💾 Store response to Cache &amp; stream to client</text>
    </g>
  </g>

  <!-- Right: Origin Server -->
  <g transform="translate(610, 60)">
    <rect width="200" height="360" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" filter="url(#cardShadow2)"/>
    <rect width="200" height="38" rx="10" fill="#e0e7ff"/>
    <text x="100" y="24" fill="#3730a3" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Origin Server</text>

    <g transform="translate(15, 60)">
      <rect width="170" height="70" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
      <text x="85" y="20" fill="#312e81" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Origin Shield / L2</text>
      <text x="85" y="38" fill="#4338ca" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Aggregates back-to-origin</text>
      <text x="85" y="54" fill="#6366f1" font-size="9.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Prevents Origin Stampede</text>
    </g>

    <g transform="translate(15, 150)">
      <rect width="170" height="95" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
      <text x="85" y="20" fill="#312e81" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Backend Services</text>
      <text x="85" y="40" fill="#4338ca" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">🗄️ OSS Private Bucket</text>
      <text x="85" y="58" fill="#4338ca" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">⚖️ ALB / SLB Cluster</text>
      <text x="85" y="76" fill="#4338ca" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">💻 ECS / Web Servers</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="170" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="85" y="20" fill="#334155" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Origin Headers</text>
      <text x="85" y="38" fill="#64748b" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Cache-Control: max-age=3600</text>
      <text x="85" y="54" fill="#64748b" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">ETag: "65f8a-92b1"</text>
      <text x="85" y="68" fill="#0284c7" font-size="8.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">SNI + Host: app.domain.com</text>
    </g>
  </g>

  <!-- Connectors -->
  <!-- Client -> Edge GET -->
  <line x1="170" y1="120" x2="225" y2="120" stroke="#0284c7" stroke-width="2.5" marker-end="url(#mBlue)"/>
  <!-- Edge -> Client HIT -->
  <line x1="225" y1="180" x2="175" y2="180" stroke="#059669" stroke-width="2.5" marker-end="url(#mGreen)"/>
  <!-- Edge -> Origin MISS -->
  <line x1="550" y1="300" x2="605" y2="300" stroke="#ea580c" stroke-width="2.5" marker-end="url(#mOrange)"/>
  <!-- Origin -> Edge 200 OK -->
  <line x1="605" y1="335" x2="555" y2="335" stroke="#059669" stroke-width="2.5" marker-end="url(#mGreen)"/>
</svg>
