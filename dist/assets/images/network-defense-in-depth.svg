<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- VPC Outer Border -->
  <rect x="15" y="15" width="730" height="220" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" fill="#334155">Virtual Private Cloud (VPC Boundary)</text>

  <!-- Incoming Traffic Source -->
  <rect x="35" y="100" width="115" height="60" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="92" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#334155">Traffic Ingress</text>
  <text x="92" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5" fill="#64748b">Internet / CEN / VPN</text>

  <!-- Arrow 1 -->
  <path d="M 150 130 L 195 130" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 1: Network ACL (Subnet Level) -->
  <rect x="205" y="65" width="160" height="135" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="215" y="75" width="140" height="24" rx="4" fill="#2563eb"/>
  <text x="285" y="91" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="bold" fill="#ffffff">Layer 1: Network ACL</text>
  <text x="285" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#1e40af">vSwitch Perimeter</text>
  <text x="285" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="bold" fill="#dc2626">STATELESS</text>
  <text x="285" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#475569">Explicit Inbound &amp;</text>
  <text x="285" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#475569">Outbound Rules Required</text>

  <!-- Arrow 2 -->
  <path d="M 365 130 L 410 130" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: Security Group (ENI Level) -->
  <rect x="420" y="65" width="160" height="135" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="430" y="75" width="140" height="24" rx="4" fill="#16a34a"/>
  <text x="500" y="91" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="bold" fill="#ffffff">Layer 2: Security Group</text>
  <text x="500" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#15803d">ENI / Instance Level</text>
  <text x="500" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="bold" fill="#15803d">STATEFUL</text>
  <text x="500" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#475569">Return traffic auto-allowed</text>
  <text x="500" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#475569">Basic (6k) or Enterprise (65k)</text>

  <!-- Arrow 3 -->
  <path d="M 580 130 L 625 130" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Target: ECS / Application -->
  <rect x="635" y="85" width="95" height="90" rx="8" fill="#ffffff" stroke="#ff6a00" stroke-width="2"/>
  <text x="682" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#ea580c">ECS Workload</text>
  <text x="682" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5" fill="#475569">ENI Interface</text>
  <text x="682" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5" fill="#64748b">Guest OS / App</text>
</svg>
