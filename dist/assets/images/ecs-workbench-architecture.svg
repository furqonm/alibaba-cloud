" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><path d="M 617 358.88 L 617 275.12" fill="none" stroke="#595959" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="none" /><path d="M 617 365.88 L 613.5 358.88 L 620.5 358.88 Z" fill="#595959" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><path d="M 617 268.12 L 620.5 275.12 L 613.5 275.12 Z" fill="#595959" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><path d="M 602 367 L 637 367 L 637 404.8 L 610.29 404.76" fill="none" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><path d="M 603.29 404.75 L 610.29 401.26 L 610.28 408.26 Z" fill="#595959" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><path d="M 282 267 L 312 267" fill="none" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><path d="M 297 358.88 L 297 275.12" fill="none" stroke="#595959" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="none" /><path d="M 297 365.88 L 293.5 358.88 L 300.5 358.88 Z" fill="#595959" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><path d="M 297 268.12 L 300.5 275.12 L 293.5 275.12 Z" fill="#595959" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><path d="M 322 367 L 357 367 L 357 405 L 330.12 405" fill="none" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><path d="M 323.12 405 L 330.12 401.5 L 330.12 408.5 Z" fill="#595959" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><path d="M 282 367 L 312 367" fill="none" stroke="#595959" stroke-miterlimit="10" pointer-events="none" /><rect x="571" y="7" width="50" height="50" fill-opacity="0" fill="#ffffff" stroke="none" pointer-events="none" /><rect x="571" y="7" width="0" height="0" fill="none" stroke="#000000" stroke-width="2" pointer-events="none" /><path d="M 611.31 49 L 581.61 49 C 579.85 49 578.4 47.71 578.4 45.93 L 578.4 42.38 C 578.4 40.6 579.85 39.32 581.61 39.32 L 611.31 39.32 C 613.08 39.32 614.