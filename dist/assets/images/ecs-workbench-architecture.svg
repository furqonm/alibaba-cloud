  <!-- Enhanced Clear Labels and Sequence Steps -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Actor Titles -->
    <text x="27" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Client</text>
    <text x="360" y="38" text-anchor="start" font-size="18" font-weight="700" fill="#1366ec">Workbench</text>
    <text x="635" y="38" text-anchor="start" font-size="18" font-weight="700" fill="#1366ec">ECS Instance</text>

    <!-- Step 1: User -> Workbench -->
    <rect x="42" y="68" width="250" height="26" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1" />
    <text x="167" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">1. Initiate password-free logon</text>

    <!-- Step 2: Workbench RAM check -->
    <rect x="350" y="112" width="235" height="26" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1" />
    <text x="358" y="130" font-size="15" font-weight="600" fill="#0f172a">2. Verify RAM permissions</text>

    <!-- Step 3: Workbench generate SSH key pair -->
    <rect x="350" y="170" width="245" height="44" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1" />
    <text x="358" y="189" font-size="15" font-weight="600" fill="#0f172a">3. Generate SSH key pair</text>
    <text x="358" y="206" font-size="13" font-weight="500" fill="#64748b">(ephemeral public / private key)</text>

    <!-- Step 4: Workbench -> ECS (send public key) -->
    <rect x="328" y="238" width="260" height="26" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1" />
    <text x="458" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">4. Send public key to instance</text>

    <!-- Step 5: Workbench <-> ECS (SSH auth) -->
    <rect x="320" y="282" width="276" height="42" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1" />
    <text x="458" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">5. Authenticate &amp; connect</text>
    <text x="458" y="317" text-anchor="middle" font-size="13" font-weight="500" fill="#475569">via SSH public-key handshake</text>

    <!-- 60 seconds TTL timers -->
    <rect x="238" y="305" width="118" height="24" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="1.5" />
    <text x="297" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">⏱️ 60 seconds</text>

    <rect x="558" y="305" width="118" height="24" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="1.5" />
    <text x="617" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">⏱️ 60 seconds</text>

    <!-- Step 6: Destroy private key -->
    <rect x="360" y="372" width="205" height="26" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.2" />
    <text x="368" y="390" font-size="14" font-weight="700" fill="#b91c1c">6. Destroy the private key</text>

    <!-- Step 6: Destroy public key -->
    <rect x="640" y="372" width="200" height="26" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.2" />
    <text x="648" y="390" font-size="14" font-weight="700" fill="#b91c1c">6. Destroy the public key</text>
  </g>

</g></svg>