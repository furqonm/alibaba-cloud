<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slb" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff6a00"/>
    </marker>
    <marker id="arr-slb-dash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f97316"/>
    </marker>
    <marker id="dim-arr-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="dim-arr-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>

    <!-- Subtle drop shadows -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <filter id="slb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="760" height="510" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== TOP: SLB NODE ==================== -->
  <g transform="translate(380, 48)">
    <!-- SLB Icon Circle -->
    <circle cx="0" cy="0" r="32" fill="#ff6a00" filter="url(#slb-shadow)"/>
    <!-- Connected 3-node SLB symbol -->
    <circle cx="0" cy="-13" r="6.5" fill="#ffffff"/>
    <circle cx="-14" cy="12" r="6.5" fill="#ffffff"/>
    <circle cx="14" cy="12" r="6.5" fill="#ffffff"/>
    <line x1="0" y1="-13" x2="-14" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-13" x2="14" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-14" y1="12" x2="14" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Label -->
    <text x="0" y="50" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Server Load Balancer (SLB)</text>
  </g>

  <!-- Traffic distribution lines from SLB to the 4 instances -->
  <line x1="360" y1="75" x2="135" y2="148" stroke="#ff6a00" stroke-width="2" marker-end="url(#arr-slb)"/>
  <line x1="375" y1="80" x2="298" y2="148" stroke="#ff6a00" stroke-width="2" marker-end="url(#arr-slb)"/>
  <line x1="385" y1="80" x2="462" y2="148" stroke="#f97316" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-slb-dash)"/>
  <line x1="400" y1="75" x2="625" y2="148" stroke="#f97316" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-slb-dash)"/>

  <!-- ==================== AUTO SCALING GROUP CONTAINER ==================== -->
  <g transform="translate(40, 150)">
    <!-- Outer Group Container -->
    <rect width="680" height="175" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
    <!-- Auto Scaling Group Label at top right -->
    <text x="665" y="-8" text-anchor="end" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Auto Scaling Group</text>

    <!-- Instance 1: Running Base ECS (Solid) -->
    <g transform="translate(25, 20)" filter="url(#card-shadow)">
      <rect width="135" height="135" rx="10" fill="#ffffff" stroke="#ff6a00" stroke-width="2"/>
      <!-- Alibaba ECS 3-bar icon -->
      <g transform="translate(67.5, 45)">
        <rect x="-30" y="-22" width="60" height="12" rx="3" fill="#ff6a00"/>
        <circle cx="20" cy="-16" r="2.5" fill="#ffffff"/>
        <rect x="-30" y="-6" width="60" height="12" rx="3" fill="#ff6a00"/>
        <circle cx="20" cy="0" r="2.5" fill="#ffffff"/>
        <rect x="-30" y="10" width="60" height="12" rx="3" fill="#ff6a00"/>
        <circle cx="20" cy="16" r="2.5" fill="#ffffff"/>
      </g>
      <text x="67.5" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">ECS Instance</text>
      <text x="67.5" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#16a34a">● Active (Base)</text>
    </g>

    <!-- Instance 2: Running Desired ECS (Solid) -->
    <g transform="translate(190, 20)" filter="url(#card-shadow)">
      <rect width="135" height="135" rx="10" fill="#ffffff" stroke="#ff6a00" stroke-width="2"/>
      <!-- Alibaba ECS 3-bar icon -->
      <g transform="translate(67.5, 45)">
        <rect x="-30" y="-22" width="60" height="12" rx="3" fill="#ff6a00"/>
        <circle cx="20" cy="-16" r="2.5" fill="#ffffff"/>
        <rect x="-30" y="-6" width="60" height="12" rx="3" fill="#ff6a00"/>
        <circle cx="20" cy="0" r="2.5" fill="#ffffff"/>
        <rect x="-30" y="10" width="60" height="12" rx="3" fill="#ff6a00"/>
        <circle cx="20" cy="16" r="2.5" fill="#ffffff"/>
      </g>
      <text x="67.5" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">ECS Instance</text>
      <text x="67.5" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#0284c7">● Active (Desired)</text>
    </g>

    <!-- Instance 3: Dynamic Scale-Out ECS (Dashed) -->
    <g transform="translate(355, 20)">
      <rect width="135" height="135" rx="10" fill="#fffaf5" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/>
      <!-- Alibaba ECS 3-bar icon (semi-transparent dashed) -->
      <g transform="translate(67.5, 45)">
        <rect x="-30" y="-22" width="60" height="12" rx="3" fill="#fed7aa" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="20" cy="-16" r="2.5" fill="#ea580c"/>
        <rect x="-30" y="-6" width="60" height="12" rx="3" fill="#fed7aa" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="20" cy="0" r="2.5" fill="#ea580c"/>
        <rect x="-30" y="10" width="60" height="12" rx="3" fill="#fed7aa" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="20" cy="16" r="2.5" fill="#ea580c"/>
      </g>
      <text x="67.5" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#7c2d12">ECS Instance</text>
      <text x="67.5" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#ea580c">◌ Scale Out</text>
    </g>

    <!-- Instance 4: Dynamic Scale-Out ECS (Dashed) -->
    <g transform="translate(520, 20)">
      <rect width="135" height="135" rx="10" fill="#fffaf5" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/>
      <!-- Alibaba ECS 3-bar icon (semi-transparent dashed) -->
      <g transform="translate(67.5, 45)">
        <rect x="-30" y="-22" width="60" height="12" rx="3" fill="#fed7aa" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="20" cy="-16" r="2.5" fill="#ea580c"/>
        <rect x="-30" y="-6" width="60" height="12" rx="3" fill="#fed7aa" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="20" cy="0" r="2.5" fill="#ea580c"/>
        <rect x="-30" y="10" width="60" height="12" rx="3" fill="#fed7aa" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="20" cy="16" r="2.5" fill="#ea580c"/>
      </g>
      <text x="67.5" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#7c2d12">ECS Instance</text>
      <text x="67.5" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#ea580c">◌ Scale Out</text>
    </g>
  </g>

  <!-- ==================== CAPACITY BOUND DIMENSION ARROWS ==================== -->
  <!-- Minimum size (Under Instance 1) -->
  <line x1="67" y1="355" x2="198" y2="355" stroke="#0f172a" stroke-width="1.8" marker-start="url(#dim-arr-start)" marker-end="url(#dim-arr-end)"/>
  <text x="132.5" y="374" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">minimum size</text>

  <!-- Scale out as needed (Under Instances 3 & 4) -->
  <line x1="397" y1="355" x2="693" y2="355" stroke="#0f172a" stroke-width="1.8" marker-start="url(#dim-arr-start)" marker-end="url(#dim-arr-end)"/>
  <text x="545" y="374" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Scale out as needed</text>

  <!-- Desired Capacity (Under Instances 1 & 2) -->
  <line x1="67" y1="408" x2="363" y2="408" stroke="#0f172a" stroke-width="1.8" marker-start="url(#dim-arr-start)" marker-end="url(#dim-arr-end)"/>
  <text x="215" y="427" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Desired Capacity</text>

  <!-- Maximum Size (Under Instances 1 through 4) -->
  <line x1="67" y1="462" x2="693" y2="462" stroke="#0f172a" stroke-width="1.8" marker-start="url(#dim-arr-start)" marker-end="url(#dim-arr-end)"/>
  <text x="380" y="482" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Maximum Size</text>
</svg>