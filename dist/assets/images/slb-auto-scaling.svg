<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="100%">
  <defs>
    <marker id="as-arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="as-arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="as-arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="as-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Client Node (Left) -->
  <g transform="translate(25, 175)" filter="url(#as-shadow)">
    <circle cx="28" cy="28" r="26" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <circle cx="28" cy="20" r="8" fill="#0284c7"/>
    <path d="M 13 40 C 13 32 20 30 28 30 C 36 30 43 32 43 40" fill="#0284c7"/>
    <text x="28" y="70" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Client</text>
  </g>

  <!-- Arrow Client -> SLB -->
  <line x1="88" y1="203" x2="132" y2="203" stroke="#0284c7" stroke-width="2.5" marker-end="url(#as-arr-blue)"/>

  <!-- SLB Node -->
  <g transform="translate(140, 160)" filter="url(#as-shadow)">
    <rect width="90" height="85" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <circle cx="45" cy="35" r="16" fill="#e0f2fe"/>
    <circle cx="45" cy="28" r="4" fill="#0284c7"/>
    <circle cx="36" cy="40" r="4" fill="#0284c7"/>
    <circle cx="54" cy="40" r="4" fill="#0284c7"/>
    <path d="M 45 28 L 36 40 M 45 28 L 54 40" stroke="#0284c7" stroke-width="1.8"/>
    <text x="45" y="68" text-anchor="middle" fill="#0369a1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SLB</text>
  </g>

  <!-- Arrow SLB -> Scaling Group / Server Group -->
  <line x1="235" y1="203" x2="278" y2="203" stroke="#0284c7" stroke-width="2.5" marker-end="url(#as-arr-blue)"/>

  <!-- Scaling Group Container -->
  <g transform="translate(285, 25)">
    <rect width="335" height="410" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Scaling Group Header Badge -->
    <rect x="15" y="-12" width="115" height="24" rx="4" fill="#334155"/>
    <text x="72" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Scaling Group</text>

    <!-- Server Group Container (Left Column inside Scaling Group) -->
    <g transform="translate(20, 30)">
      <rect width="135" height="285" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4"/>
      <!-- Server Group Header Badge -->
      <rect x="12" y="-10" width="110" height="20" rx="4" fill="#e0f2fe"/>
      <text x="67" y="4" text-anchor="middle" fill="#0369a1" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Server Group</text>

      <!-- Static / Manual Backend Instance (ECS01) -->
      <g transform="translate(15, 30)" filter="url(#as-shadow)">
        <rect width="105" height="85" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
        <rect x="12" y="12" width="81" height="22" rx="4" fill="#e0f2fe"/>
        <text x="52" y="27" text-anchor="middle" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ECS01</text>
        <rect x="20" y="42" width="65" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="52" y="55" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Manual</text>
        <circle cx="52" cy="72" r="4" fill="#10b981"/>
      </g>

      <!-- Auto-Scaled Attached Backend Instance (ESS-XX) -->
      <g transform="translate(15, 160)" filter="url(#as-shadow)">
        <rect width="105" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect x="12" y="12" width="81" height="22" rx="4" fill="#dcfce7"/>
        <text x="52" y="27" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ESS-XX</text>
        <rect x="16" y="42" width="73" height="18" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <text x="52" y="55" text-anchor="middle" fill="#16a34a" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Auto-Bound</text>
        <circle cx="52" cy="72" r="4" fill="#16a34a"/>
      </g>
    </g>

    <!-- Auto-Created ECS Instance (Right Column inside Scaling Group) -->
    <g transform="translate(195, 190)" filter="url(#as-shadow)">
      <rect width="120" height="85" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <rect x="15" y="12" width="90" height="22" rx="4" fill="#dcfce7"/>
      <text x="60" y="27" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">ESS-XX</text>
      <rect x="15" y="42" width="90" height="20" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="60" y="56" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Auto-Created</text>
      <circle cx="60" cy="72" r="4" fill="#16a34a"/>
    </g>

    <!-- Bidirectional Dynamic Binding Arrows between Server Group and ESS-XX -->
    <g transform="translate(160, 215)">
      <!-- Add to group arrow (top line, points left into Server Group) -->
      <line x1="30" y1="5" x2="2" y2="5" stroke="#16a34a" stroke-width="2" marker-end="url(#as-arr-green)"/>
      <!-- Remove from group arrow (bottom line, points right out of Server Group) -->
      <line x1="2" y1="25" x2="30" y2="25" stroke="#64748b" stroke-width="2" marker-end="url(#as-arr-gray)"/>
    </g>

    <!-- CloudMonitor Component (Bottom Center of Scaling Group) -->
    <g transform="translate(90, 345)" filter="url(#as-shadow)">
      <rect width="155" height="46" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/>
      <circle cx="24" cy="23" r="11" fill="#eff6ff"/>
      <path d="M 17 24 L 21 19 L 26 22 L 31 17" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
      <text x="92" y="27" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">CloudMonitor</text>
    </g>
    <line x1="167" y1="345" x2="167" y2="322" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>
</svg>
