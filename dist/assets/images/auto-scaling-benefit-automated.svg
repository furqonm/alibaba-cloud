<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="100%" height="100%">
  <defs>
    <marker id="arr-blue-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0ea5e9"/>
    </marker>
    <marker id="arr-green-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#84cc16"/>
    </marker>
    <marker id="sync-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="940" height="220" fill="#ffffff"/>

  <!-- ==================== GAUGE / METER ==================== -->
  <g transform="translate(110, 110)">
    <!-- Outer circle track -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#e2e8f0" stroke-width="5"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Dial ticks -->
    <line x1="-48" y1="-25" x2="-38" y2="-20" stroke="#cbd5e1" stroke-width="2.5"/>
    <line x1="-30" y1="-44" x2="-24" y2="-35" stroke="#cbd5e1" stroke-width="2.5"/>
    <line x1="0" y1="-54" x2="0" y2="-42" stroke="#cbd5e1" stroke-width="2.5"/>
    
    <!-- Active trigger threshold arc in blue -->
    <path d="M 38 -38 A 54 54 0 0 1 54 0" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <circle cx="38" cy="-38" r="3" fill="#0284c7"/>
    <circle cx="48" cy="-24" r="3" fill="#0284c7"/>
    <circle cx="54" cy="0" r="3" fill="#0284c7"/>

    <!-- Green needle pointing to surge threshold -->
    <line x1="0" y1="0" x2="40" y2="-25" stroke="#84cc16" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#84cc16"/>
  </g>

  <!-- PLUS 1 -->
  <text x="245" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="44" font-weight="700" fill="#cbd5e1">+</text>

  <!-- ==================== CLOUD WITH ECS INSTANCES & 4 ARROWS ==================== -->
  <g transform="translate(435, 105)">
    <!-- Cloud shape -->
    <path d="M -50 20 C -65 20 -75 8 -75 -5 C -75 -20 -62 -30 -48 -30 C -45 -48 -25 -60 -5 -60 C 15 -60 32 -48 36 -30 C 50 -30 62 -18 62 -5 C 62 10 50 20 35 20 Z" 
          fill="#f1f5f9" stroke="#cbd5e1" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- 3 Server Blades inside Cloud -->
    <g transform="translate(0, -10)">
      <rect x="-24" y="-16" width="48" height="9" rx="2.5" fill="#cbd5e1"/>
      <circle cx="16" cy="-11.5" r="1.5" fill="#ffffff"/>
      <rect x="-24" y="-3" width="48" height="9" rx="2.5" fill="#cbd5e1"/>
      <circle cx="16" cy="1.5" r="1.5" fill="#ffffff"/>
      <rect x="-24" y="10" width="48" height="9" rx="2.5" fill="#cbd5e1"/>
      <circle cx="16" cy="14.5" r="1.5" fill="#ffffff"/>
    </g>

    <!-- 4 Scaling Arrows around Cloud -->
    <!-- Top-left (green IN) -->
    <line x1="-75" y1="-45" x2="-55" y2="-25" stroke="#84cc16" stroke-width="4.5" marker-end="url(#arr-green-2)"/>
    <!-- Top-right (blue OUT) -->
    <line x1="50" y1="-30" x2="72" y2="-52" stroke="#0ea5e9" stroke-width="4.5" marker-end="url(#arr-blue-2)"/>
    <!-- Bottom-left (blue OUT) -->
    <line x1="-50" y1="25" x2="-72" y2="47" stroke="#0ea5e9" stroke-width="4.5" marker-end="url(#arr-blue-2)"/>
    <!-- Bottom-right (green IN) -->
    <line x1="75" y1="45" x2="55" y2="25" stroke="#84cc16" stroke-width="4.5" marker-end="url(#arr-green-2)"/>
  </g>

  <!-- PLUS 2 -->
  <text x="625" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="44" font-weight="700" fill="#cbd5e1">+</text>

  <!-- ==================== AUTOMATED SLB + RDS SYNC ==================== -->
  <g transform="translate(800, 110)">
    <!-- Top Sync Arrow (Clockwise) -->
    <path d="M -50 -15 C -45 -55 45 -55 50 -15" fill="none" stroke="#0ea5e9" stroke-width="4" marker-end="url(#sync-arr)"/>
    
    <!-- Bottom Sync Arrow (Counter-Clockwise) -->
    <path d="M 50 15 C 45 55 -45 55 -50 15" fill="none" stroke="#0ea5e9" stroke-width="4" marker-end="url(#sync-arr)"/>

    <!-- SLB 3 Connected Circles (Top Center) -->
    <g transform="translate(0, -22)">
      <circle cx="0" cy="-12" r="7.5" fill="#cbd5e1"/>
      <circle cx="-13" cy="10" r="7.5" fill="#cbd5e1"/>
      <circle cx="13" cy="10" r="7.5" fill="#cbd5e1"/>
      <line x1="0" y1="-12" x2="-13" y2="10" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="0" y1="-12" x2="13" y2="10" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="-13" y1="10" x2="13" y2="10" stroke="#cbd5e1" stroke-width="2.5"/>
    </g>

    <!-- RDS Hexagon Cluster (Bottom Center) -->
    <g transform="translate(0, 25)">
      <!-- Hexagon shape -->
      <polygon points="0,-12 11,-6 11,6 0,12 -11,6 -11,-6" fill="#cbd5e1"/>
      <polygon points="-12,6 -1,12 -1,24 -12,30 -23,24 -23,12" fill="#cbd5e1"/>
      <polygon points="12,6 23,12 23,24 12,30 1,24 1,12" fill="#cbd5e1"/>
    </g>
  </g>
</svg>