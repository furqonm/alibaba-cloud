<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="kmsArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
    .box-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; font-weight: 700; }
    .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; font-weight: 600; }
    .label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #334155; }
  </style>

  <!-- Outer Card Container -->
  <rect x="4" y="4" width="672" height="562" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Top Title Banner -->
  <rect x="4" y="4" width="672" height="40" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="4" y="32" width="672" height="12" fill="#f8fafc"/>
  <text x="20" y="28" class="title">Server-Side Encryption (SSE-KMS Envelope Architecture)</text>
  <rect x="496" y="12" width="164" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="578" y="28" text-anchor="middle" class="badge-text" fill="#047857">BYOK &amp; FIPS 140-2 HSM</text>

  <!-- 1. KMS Domain Layer (Top) -->
  <rect x="18" y="54" width="644" height="120" rx="8" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="32" y="76" class="box-title" fill="#065f46">Key Management Service (KMS) Domain</text>
  
  <!-- Left Side: Source of Keys -->
  <g transform="translate(32, 88)">
    <rect x="0" y="0" width="150" height="32" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <circle cx="16" cy="16" r="8" fill="#ecfdf5"/>
    <circle cx="16" cy="16" r="4" fill="#059669"/>
    <text x="32" y="20" class="label" font-size="10" font-weight="600" fill="#065f46">KMS Generated Key</text>
    <path d="M 150 16 L 168 16" stroke="#059669" stroke-width="1.5" marker-end="url(#kmsArrow)"/>

    <rect x="0" y="40" width="150" height="32" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <circle cx="16" cy="56" r="8" fill="#ecfdf5"/>
    <path d="M 12 56 L 20 56 M 16 52 L 16 60" stroke="#059669" stroke-width="2"/>
    <text x="32" y="60" class="label" font-size="10" font-weight="600" fill="#065f46">BYOK Import Material</text>
    <path d="M 150 56 L 168 56" stroke="#059669" stroke-width="1.5" marker-end="url(#kmsArrow)"/>
  </g>

  <!-- Central CMK Box -->
  <g transform="translate(216, 86)">
    <!-- Stack shadow effects -->
    <rect x="6" y="-6" width="224" height="74" rx="8" fill="#a7f3d0" stroke="#6ee7b7" stroke-width="1"/>
    <rect x="3" y="-3" width="224" height="74" rx="8" fill="#6ee7b7" stroke="#34d399" stroke-width="1"/>
    <rect x="0" y="0" width="224" height="74" rx="8" fill="#059669" stroke="#047857" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="112" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Customer Master Key (CMK)</text>
    <text x="112" y="50" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#d1fae5">Hardware HSM Protected / Never Leaves KMS</text>
  </g>

  <!-- Right Side KMS Info Badge -->
  <g transform="translate(460, 88)">
    <rect x="0" y="0" width="190" height="74" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="12" y="22" class="label" font-size="10.5" font-weight="600" fill="#047857">• Envelope Encryption</text>
    <text x="12" y="42" class="label" font-size="10.5" font-weight="500" fill="#334155">• Hardware HSM FIPS 140-2</text>
    <text x="12" y="62" class="label" font-size="10.5" font-weight="500" fill="#334155">• ActionTrail Auditing</text>
  </g>

  <!-- Envelope Key Generation Arrows to DEKs -->
  <path d="M 250 160 L 105 195" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#kmsArrow)"/>
  <path d="M 295 160 L 245 195" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#kmsArrow)"/>
  <path d="M 355 160 L 385 195" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#kmsArrow)"/>
  <path d="M 405 160 L 525 195" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#kmsArrow)"/>

  <!-- 2. Data Encryption Keys (DEKs) -->
  <g transform="translate(50, 198)">
    <rect x="0" y="0" width="112" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="56" y="21" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#92400e">Data Key 1</text>
    <path d="M 56 32 L 56 56" stroke="#d97706" stroke-width="1.5" marker-end="url(#orangeArrow)"/>
  </g>
  <g transform="translate(190, 198)">
    <rect x="0" y="0" width="112" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="56" y="21" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#92400e">Data Key 2</text>
    <path d="M 56 32 L 56 56" stroke="#d97706" stroke-width="1.5" marker-end="url(#orangeArrow)"/>
  </g>
  <g transform="translate(330, 198)">
    <rect x="0" y="0" width="112" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="56" y="21" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#92400e">Data Key 3</text>
    <path d="M 56 32 L 56 56" stroke="#d97706" stroke-width="1.5" marker-end="url(#orangeArrow)"/>
  </g>
  <g transform="translate(470, 198)">
    <rect x="0" y="0" width="112" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="56" y="21" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#92400e">Data Key 4</text>
    <path d="M 56 32 L 56 56" stroke="#d97706" stroke-width="1.5" marker-end="url(#orangeArrow)"/>
  </g>

  <!-- 3. OSS Server / Processing Layer -->
  <rect x="18" y="258" width="644" height="142" rx="10" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="32" y="280" class="box-title" fill="#1e40af">OSS Ingestion &amp; On-the-Fly Encryption Layer (AES-256)</text>
  <text x="650" y="280" text-anchor="end" class="label" font-size="10.5" font-weight="600" fill="#0284c7">Auto Transparent Decryption</text>

  <!-- Client Ingestion on Left -->
  <g transform="translate(28, 304)">
    <rect x="0" y="0" width="70" height="72" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="15" y="16" width="40" height="25" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <path d="M 10 43 L 60 43 L 64 48 L 6 48 Z" fill="#94a3b8"/>
    <text x="35" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Client App</text>
    <path d="M 70 36 L 100 36" stroke="#0284c7" stroke-width="2" marker-end="url(#blueArrow)"/>
  </g>

  <!-- 4 Data Blocks Being Encrypted -->
  <g transform="translate(138, 302)">
    <rect x="0" y="0" width="112" height="76" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="8" y="8" width="96" height="20" rx="4" fill="#0284c7"/>
    <text x="56" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Object 1</text>
    <text x="56" y="45" text-anchor="middle" class="label" font-size="9.5">Encrypted with</text>
    <text x="56" y="63" text-anchor="middle" class="badge-text" font-size="10.5" fill="#d97706">Data Key 1</text>
  </g>
  <g transform="translate(268, 302)">
    <rect x="0" y="0" width="112" height="76" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="8" y="8" width="96" height="20" rx="4" fill="#0284c7"/>
    <text x="56" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Object 2</text>
    <text x="56" y="45" text-anchor="middle" class="label" font-size="9.5">Encrypted with</text>
    <text x="56" y="63" text-anchor="middle" class="badge-text" font-size="10.5" fill="#d97706">Data Key 2</text>
  </g>
  <g transform="translate(398, 302)">
    <rect x="0" y="0" width="112" height="76" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="8" y="8" width="96" height="20" rx="4" fill="#0284c7"/>
    <text x="56" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Object 3</text>
    <text x="56" y="45" text-anchor="middle" class="label" font-size="9.5">Encrypted with</text>
    <text x="56" y="63" text-anchor="middle" class="badge-text" font-size="10.5" fill="#d97706">Data Key 3</text>
  </g>
  <g transform="translate(528, 302)">
    <rect x="0" y="0" width="112" height="76" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="8" y="8" width="96" height="20" rx="4" fill="#0284c7"/>
    <text x="56" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Object 4</text>
    <text x="56" y="45" text-anchor="middle" class="label" font-size="9.5">Encrypted with</text>
    <text x="56" y="63" text-anchor="middle" class="badge-text" font-size="10.5" fill="#d97706">Data Key 4</text>
  </g>

  <!-- Downward Arrow -->
  <g transform="translate(325, 404)">
    <path d="M 15 0 L 15 10 L 24 10 L 10 22 L -4 10 L 5 10 L 5 0 Z" fill="#ea580c"/>
  </g>

  <!-- 4. Persistent Storage (Pangu Underneath) -->
  <rect x="18" y="432" width="644" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="452" class="box-title" fill="#334155">OSS Underlying Storage Infrastructure (Pangu Distributed Devices)</text>

  <!-- Storage Node Visuals -->
  <g transform="translate(32, 460)">
    <rect x="0" y="0" width="136" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="19" class="label" font-size="9.5" font-weight="600">Ciphertext Block 1</text>
  </g>
  <g transform="translate(186, 460)">
    <rect x="0" y="0" width="136" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="19" class="label" font-size="9.5" font-weight="600">Ciphertext Block 2</text>
  </g>
  <g transform="translate(340, 460)">
    <rect x="0" y="0" width="136" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="19" class="label" font-size="9.5" font-weight="600">Ciphertext Block 3</text>
  </g>
  <g transform="translate(494, 460)">
    <rect x="0" y="0" width="136" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="19" class="label" font-size="9.5" font-weight="600">Ciphertext Block 4</text>
  </g>

  <!-- Bottom Takeaways Bar -->
  <g transform="translate(18, 514)">
    <rect x="0" y="0" width="152" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="76" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">✓ Multi-Level Envelope</text>

    <rect x="164" y="0" width="152" height="26" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="240" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#047857">✓ BYOK Key Import</text>

    <rect x="328" y="0" width="152" height="26" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="404" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#b45309">✓ Unique Random DEK</text>

    <rect x="492" y="0" width="152" height="26" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="568" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#6d28d9">✓ ActionTrail Audited</text>
  </g>
</svg>