<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%">
  <defs>
    <filter id="phase-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="phase-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ==================== PHASE 1: INCIDENT PINPOINT ==================== -->
  <g transform="translate(15, 20)">
    <rect width="210" height="210" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.8" filter="url(#phase-shadow)"/>
    <rect width="210" height="38" rx="10" fill="#fef2f2"/>
    <rect y="28" width="210" height="10" fill="#fef2f2"/>
    <text x="105" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#dc2626" letter-spacing="0.5">
      PHASE 01
    </text>

    <!-- Clock / Target Icon -->
    <g transform="translate(105, 75)">
      <circle cx="0" cy="0" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
      <path d="M 0 -10 V 0 L 7 5" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    </g>

    <text x="105" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
      Incident Pinpoint
    </text>
    <text x="105" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#475569">
      Identify exact disaster second
    </text>
    <text x="105" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#dc2626">
      (e.g., 14:22:15 via SQL Audit)
    </text>
    <rect x="25" y="185" width="160" height="22" rx="11" fill="#fee2e2"/>
    <text x="105" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">
      Target: T - 1 Second
    </text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 230 125 L 255 125" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#phase-arrow)"/>


  <!-- ==================== PHASE 2: BASE SNAPSHOT MOUNT ==================== -->
  <g transform="translate(260, 20)">
    <rect width="210" height="210" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#phase-shadow)"/>
    <rect width="210" height="38" rx="10" fill="#f0f9ff"/>
    <rect y="28" width="210" height="10" fill="#f0f9ff"/>
    <text x="105" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0284c7" letter-spacing="0.5">
      PHASE 02
    </text>

    <!-- Storage Snapshot Icon -->
    <g transform="translate(105, 75)">
      <circle cx="0" cy="0" r="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
      <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#0284c7"/>
      <circle cx="-5" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="5" cy="0" r="1.5" fill="#ffffff"/>
    </g>

    <text x="105" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
      Mount Snapshot
    </text>
    <text x="105" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#475569">
      Provisions base storage image
    </text>
    <text x="105" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0284c7">
      from nearest OSS snapshot
    </text>
    <rect x="25" y="185" width="160" height="22" rx="11" fill="#e0f2fe"/>
    <text x="105" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0369a1">
      Instant Redirect-on-Write
    </text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 475 125 L 500 125" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#phase-arrow)"/>


  <!-- ==================== PHASE 3: REPLAY BINLOGS ==================== -->
  <g transform="translate(505, 20)">
    <rect width="210" height="210" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" filter="url(#phase-shadow)"/>
    <rect width="210" height="38" rx="10" fill="#fff7ed"/>
    <rect y="28" width="210" height="10" fill="#fff7ed"/>
    <text x="105" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ea580c" letter-spacing="0.5">
      PHASE 03
    </text>

    <!-- Fast-Forward Binlog Icon -->
    <g transform="translate(105, 75)">
      <circle cx="0" cy="0" r="20" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
      <polygon points="-7 -7, 0 0, -7 7" fill="#ea580c"/>
      <polygon points="1 -7, 8 0, 1 7" fill="#ea580c"/>
    </g>

    <text x="105" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
      Replay Binlogs
    </text>
    <text x="105" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#475569">
      Rolls forward transaction logs
    </text>
    <text x="105" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ea580c">
      sequentially up to exact second
    </text>
    <rect x="25" y="185" width="160" height="22" rx="11" fill="#ffedd5"/>
    <text x="105" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#c2410c">
      Deterministic RPO ≈ 0s
    </text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 720 125 L 745 125" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#phase-arrow)"/>


  <!-- ==================== PHASE 4: SURGICAL RESTORATION ==================== -->
  <g transform="translate(750, 20)">
    <rect width="195" height="210" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.8" filter="url(#phase-shadow)"/>
    <rect width="195" height="38" rx="10" fill="#ecfdf5"/>
    <rect y="28" width="195" height="10" fill="#ecfdf5"/>
    <text x="97" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10b981" letter-spacing="0.5">
      PHASE 04
    </text>

    <!-- Surgical Sync Icon -->
    <g transform="translate(97, 75)">
      <circle cx="0" cy="0" r="20" fill="#d1fae5" stroke="#10b981" stroke-width="1.6"/>
      <path d="M -7 0 L -2 5 L 8 -5" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="97" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
      Surgical Restore
    </text>
    <text x="97" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#475569">
      DMS compares &amp; restores
    </text>
    <text x="97" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10b981">
      only affected damaged tables
    </text>
    <rect x="18" y="185" width="160" height="22" rx="11" fill="#ecfdf5"/>
    <text x="97" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#047857">
      Zero Production Downtime
    </text>
  </g>
</svg>
