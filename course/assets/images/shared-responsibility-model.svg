<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="100%">
  <defs>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== LEFT: ACTOR LABELS ==================== -->
  <!-- Top: Customer -->
  <g transform="translate(18, 16)" filter="url(#shadow-sm)">
    <rect width="136" height="228" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="68" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#c2410c">Customer</text>
    <text x="68" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Security</text>
    <rect x="20" y="118" width="96" height="26" rx="4" fill="#ea580c"/>
    <text x="68" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">IN the Cloud</text>
    <text x="68" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#9a3412">Data, Apps &amp; OS</text>
  </g>

  <!-- Bottom: Alibaba Cloud -->
  <g transform="translate(18, 268)" filter="url(#shadow-sm)">
    <rect width="136" height="236" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="68" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#1e40af">Alibaba Cloud</text>
    <text x="68" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Security</text>
    <rect x="20" y="118" width="96" height="26" rx="4" fill="#2563eb"/>
    <text x="68" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">OF the Cloud</text>
    <text x="68" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1e40af">Infrastructure</text>
  </g>

  <!-- Boundary Dividing Line -->
  <g transform="translate(18, 252)">
    <line x1="0" y1="0" x2="824" y2="0" stroke="#f97316" stroke-width="2" stroke-dasharray="8,6" opacity="0.8"/>
    <rect x="295" y="-13" width="234" height="26" rx="13" fill="#1e293b"/>
    <text x="412" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Shared Responsibility Boundary</text>
  </g>

  <!-- ==================== RIGHT: CUSTOMER SCOPE (ROWS 1 - 4) ==================== -->
  <!-- Row 1: Customer Data -->
  <g transform="translate(168, 16)" filter="url(#shadow-sm)">
    <rect width="674" height="46" rx="7" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
    <text x="22" y="28" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Customer Data</text>
    <text x="652" y="28" text-anchor="end" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#64748b">Classification, access authorization &amp; backups</text>
  </g>

  <!-- Row 2: IAM & Applications -->
  <g transform="translate(168, 70)" filter="url(#shadow-sm)">
    <rect width="674" height="46" rx="7" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
    <text x="22" y="28" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e293b">IAM, Platform &amp; Applications</text>
    <text x="652" y="28" text-anchor="end" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#64748b">RAM users, role policies &amp; application security</text>
  </g>

  <!-- Row 3: OS & Firewall Config -->
  <g transform="translate(168, 124)" filter="url(#shadow-sm)">
    <rect width="674" height="46" rx="7" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
    <text x="22" y="28" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e293b">OS &amp; Network / Firewall Config</text>
    <text x="652" y="28" text-anchor="end" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#64748b">OS patching, Security Groups &amp; VPC routing rules</text>
  </g>

  <!-- Row 4: Split Cards (Data Encryption & Network Traffic Protection) -->
  <g transform="translate(168, 178)">
    <!-- Card 4A: Data Encryption -->
    <g transform="translate(0, 0)" filter="url(#shadow-sm)">
      <rect width="330" height="66" rx="7" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
      <text x="20" y="27" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#1e293b">Data Encryption</text>
      <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">KMS key management, cloud disks &amp; OSS</text>
    </g>

    <!-- Card 4B: Network Traffic Protection -->
    <g transform="translate(344, 0)" filter="url(#shadow-sm)">
      <rect width="330" height="66" rx="7" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
      <text x="20" y="27" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#1e293b">Network Protection</text>
      <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">TLS/SSL in-transit encryption &amp; identity auth</text>
    </g>
  </g>

  <!-- ==================== RIGHT: ALIBABA CLOUD SCOPE (ROWS 5 - 8) ==================== -->
  <!-- Row 5: Cloud Service Platform -->
  <g transform="translate(168, 268)" filter="url(#shadow-sm)">
    <rect width="674" height="46" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.6"/>
    <text x="22" y="28" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">Cloud Service Platform</text>
    <text x="652" y="28" text-anchor="end" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#64748b">Platform APIs, multi-tenant isolation &amp; compliance</text>
  </g>

  <!-- Row 6: Virtualization System -->
  <g transform="translate(168, 322)" filter="url(#shadow-sm)">
    <rect width="674" height="52" rx="7" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.6"/>
    <text x="22" y="31" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#1e40af">Virtualization System</text>
    
    <!-- Pills -->
    <g transform="translate(205, 9)">
      <rect x="0" y="0" width="100" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="50" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Compute</text>

      <rect x="110" y="0" width="100" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="160" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Storage</text>

      <rect x="220" y="0" width="100" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="270" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Network</text>

      <rect x="330" y="0" width="130" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="395" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">CIPU / Hypervisor</text>
    </g>
  </g>

  <!-- Row 7: Physical Infrastructure -->
  <g transform="translate(168, 382)" filter="url(#shadow-sm)">
    <rect width="674" height="52" rx="7" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.6"/>
    <text x="22" y="31" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#1e40af">Physical Infrastructure</text>

    <!-- Pills -->
    <g transform="translate(205, 9)">
      <rect x="0" y="0" width="145" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="72" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Host Servers &amp; Chips</text>

      <rect x="155" y="0" width="145" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="227" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Network Switches</text>

      <rect x="310" y="0" width="150" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="385" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Storage Clusters</text>
    </g>
  </g>

  <!-- Row 8: Datacenter Facilities -->
  <g transform="translate(168, 442)" filter="url(#shadow-sm)">
    <rect width="674" height="52" rx="7" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.6"/>
    <text x="22" y="31" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#1e40af">Datacenter Facilities</text>

    <!-- Pills -->
    <g transform="translate(205, 9)">
      <rect x="0" y="0" width="100" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="50" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Regions</text>

      <rect x="110" y="0" width="110" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="165" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Zones (AZ)</text>

      <rect x="230" y="0" width="110" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="285" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Edge Nodes</text>

      <rect x="350" y="0" width="110" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="405" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Power &amp; HVAC</text>
    </g>
  </g>
</svg>