<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto">
  <defs>
    <filter id="mz-shd" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Canvas frame -->
    <rect x="10" y="10" width="940" height="400" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Title Bar -->
    <text x="30" y="38" fill="#0F172A" font-size="14" font-weight="700">Multi-Zone High Availability: Priority Policy vs. Balanced Distribution</text>
    <text x="930" y="38" fill="#64748B" font-size="11" font-weight="500" text-anchor="end">Spans Multiple VSwitches across Availability Zones in a VPC</text>

    <!-- Left Column: Priority Policy -->
    <g filter="url(#mz-shd)">
      <rect x="30" y="60" width="435" height="330" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
      <rect x="30" y="60" width="435" height="26" rx="8" fill="#0284C7" />
      <rect x="30" y="78" width="435" height="8" fill="#0284C7" />
      <text x="45" y="77" fill="#FFFFFF" font-size="12" font-weight="700">1. Priority Policy (Strict Sequential Failover)</text>

      <text x="45" y="110" fill="#0369A1" font-size="11" font-weight="600">Sequential provisioning based on VSwitch configuration order:</text>

      <!-- VSwitch 1 (Zone A) -->
      <rect x="45" y="125" width="405" height="65" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
      <text x="60" y="145" fill="#0369A1" font-size="11" font-weight="700">Priority 1: VSwitch-A (Availability Zone A)</text>
      <text x="60" y="162" fill="#64748B" font-size="9">Auto Scaling places ALL instances in Zone A first until inventory is exhausted.</text>
      <rect x="350" y="135" width="90" height="22" rx="4" fill="#0284C7" />
      <text x="395" y="150" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">100% Primary</text>

      <!-- VSwitch 2 (Zone B) -->
      <rect x="45" y="200" width="405" height="65" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="60" y="220" fill="#475569" font-size="11" font-weight="700">Priority 2: VSwitch-B (Availability Zone B)</text>
      <text x="60" y="237" fill="#64748B" font-size="9">Activated strictly if Zone A runs out of stock or quota.</text>
      <rect x="350" y="210" width="90" height="22" rx="4" fill="#94A3B8" />
      <text x="395" y="225" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Standby</text>

      <!-- VSwitch 3 (Zone C) -->
      <rect x="45" y="275" width="405" height="65" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="60" y="295" fill="#475569" font-size="11" font-weight="700">Priority 3: VSwitch-C (Availability Zone C)</text>
      <text x="60" y="312" fill="#64748B" font-size="9">Third fallback tier. Scale-in removes instances in reverse priority order (C &rarr; B &rarr; A).</text>
      <rect x="350" y="285" width="90" height="22" rx="4" fill="#94A3B8" />
      <text x="395" y="300" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Fallback</text>

      <text x="45" y="365" fill="#64748B" font-size="9" font-style="italic">Best for: Workloads prioritizing single-zone lowest network latency.</text>
    </g>

    <!-- Right Column: Balanced Distribution -->
    <g filter="url(#mz-shd)">
      <rect x="495" y="60" width="435" height="330" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
      <rect x="495" y="60" width="435" height="26" rx="8" fill="#059669" />
      <rect x="495" y="78" width="435" height="8" fill="#059669" />
      <text x="510" y="77" fill="#FFFFFF" font-size="12" font-weight="700">2. Balanced Distribution (Fault Domain Equalization)</text>

      <text x="510" y="110" fill="#047857" font-size="11" font-weight="600">Evenly spreads capacity across all configured availability zones:</text>

      <!-- VSwitch 1 (Zone A) -->
      <rect x="510" y="125" width="405" height="65" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" />
      <text x="525" y="145" fill="#047857" font-size="11" font-weight="700">VSwitch-A (Availability Zone A)</text>
      <text x="525" y="162" fill="#64748B" font-size="9">Capacity target: 33.3% of total instances.</text>
      <rect x="815" y="135" width="90" height="22" rx="4" fill="#059669" />
      <text x="860" y="150" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">1/3 Share</text>

      <!-- VSwitch 2 (Zone B) -->
      <rect x="510" y="200" width="405" height="65" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" />
      <text x="525" y="220" fill="#047857" font-size="11" font-weight="700">VSwitch-B (Availability Zone B)</text>
      <text x="525" y="237" fill="#64748B" font-size="9">Capacity target: 33.3% of total instances.</text>
      <rect x="815" y="210" width="90" height="22" rx="4" fill="#059669" />
      <text x="860" y="225" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">1/3 Share</text>

      <!-- VSwitch 3 (Zone C) -->
      <rect x="510" y="275" width="405" height="65" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" />
      <text x="525" y="295" fill="#047857" font-size="11" font-weight="700">VSwitch-C (Availability Zone C)</text>
      <text x="525" y="312" fill="#64748B" font-size="9">Capacity target: 33.3% of total instances. Prevents single AZ blackout.</text>
      <rect x="815" y="285" width="90" height="22" rx="4" fill="#059669" />
      <text x="860" y="300" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">1/3 Share</text>

      <text x="510" y="365" fill="#047857" font-size="9" font-weight="600">Enterprise High Availability Standard: If an AZ fails, traffic shifts seamlessly.</text>
    </g>
  </g>
</svg>