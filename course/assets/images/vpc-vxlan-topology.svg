<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380">
  <defs>
    <linearGradient id="vx2-eth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="vx2-ip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="vx2-udp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="vx2-tun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="vx2-usr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="vx2-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="100%" stop-color="#bef264"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="380" fill="none"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- LEFT: VXLAN PACKET -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="76" height="58" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="38" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Eth</text>

      <rect x="76" y="0" width="68" height="58" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="110" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">IP</text>

      <rect x="144" y="0" width="68" height="58" fill="#facc15" stroke="#ca8a04" stroke-width="1.2"/>
      <text x="178" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">UDP</text>

      <rect x="212" y="0" width="126" height="58" fill="#bae6fd" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="275" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Tunnel</text>

      <rect x="338" y="0" width="152" height="58" fill="#86efac" stroke="#4ade80" stroke-width="1.2"/>
      <text x="414" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">User packet</text>

      <!-- Curly Bracket pointing down to Tunnel ID100 and Tunnel ID200 -->
      <path d="M 225 130 C 225 102, 228 102, 250 102 L 265 102 C 275 102, 275 102, 275 74 C 275 102, 275 102, 285 102 L 300 102 C 322 102, 325 102, 325 130" 
            fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 225 130 C 225 102, 228 102, 250 102 L 265 102 C 275 102, 275 102, 275 74 C 275 102, 275 102, 285 102 L 300 102 C 322 102, 325 102, 325 130" 
            fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Tunnel ID labels (plain text with white halo, no boxes) -->
      <text x="200" y="152" text-anchor="middle" font-size="15" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">Tunnel ID100</text>
    <text x="200" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Tunnel ID100</text>
      <text x="335" y="152" text-anchor="middle" font-size="15" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">Tunnel ID200</text>
    <text x="335" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Tunnel ID200</text>
    </g>

    <!-- RIGHT: UNDERLAY & OVERLAY TOPOLOGY -->
    <g transform="translate(560, 15)">
      <!-- Parallel Trunk Links: Gateway to Left Switch -->
      <line x1="175" y1="45" x2="105" y2="145" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
      <line x1="175" y1="45" x2="105" y2="145" stroke="#d1d5db" stroke-width="4"/>
      <line x1="185" y1="52" x2="115" y2="152" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
      <line x1="185" y1="52" x2="115" y2="152" stroke="#84cc16" stroke-width="4"/>

      <!-- Parallel Trunk Links: Gateway to Right Switch -->
      <line x1="275" y1="45" x2="385" y2="145" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
      <line x1="275" y1="45" x2="385" y2="145" stroke="#d1d5db" stroke-width="4"/>
      <line x1="265" y1="52" x2="375" y2="152" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
      <line x1="265" y1="52" x2="375" y2="152" stroke="#84cc16" stroke-width="4"/>

      <!-- Parallel Trunk Links: Left Switch to Right Switch -->
      <line x1="150" y1="162" x2="340" y2="162" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
      <line x1="150" y1="162" x2="340" y2="162" stroke="#84cc16" stroke-width="4"/>
      <line x1="150" y1="178" x2="340" y2="178" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
      <line x1="150" y1="178" x2="340" y2="178" stroke="#d1d5db" stroke-width="4"/>

      <!-- Branch Links from Left Switch to VM1 & VM2 -->
      <line x1="105" y1="195" x2="45" y2="255" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="105" y1="195" x2="45" y2="255" stroke="#84cc16" stroke-width="1.8"/>
      <line x1="105" y1="195" x2="175" y2="255" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="105" y1="195" x2="175" y2="255" stroke="#cbd5e1" stroke-width="1.8"/>
      <text x="45" y="228" text-anchor="middle" font-size="14" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">100</text>
    <text x="45" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">100</text>
      <text x="160" y="232" text-anchor="middle" font-size="14" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">200</text>
    <text x="160" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">200</text>

      <!-- Branch Links from Right Switch to VM3 & VM4 -->
      <line x1="390" y1="195" x2="330" y2="258" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="390" y1="195" x2="330" y2="258" stroke="#84cc16" stroke-width="1.8"/>
      <line x1="390" y1="195" x2="475" y2="258" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="390" y1="195" x2="475" y2="258" stroke="#cbd5e1" stroke-width="1.8"/>
      <text x="330" y="238" text-anchor="middle" font-size="14" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">100</text>
    <text x="330" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">100</text>
      <text x="460" y="238" text-anchor="middle" font-size="14" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">200</text>
    <text x="460" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">200</text>

      <!-- Gateway Node -->
      <rect x="175" y="10" width="100" height="54" rx="8" fill="#d9f99d" stroke="#84cc16" stroke-width="1.5"/>
      <text x="225" y="43" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Gateway</text>

      <!-- Left Switch Node -->
      <rect x="55" y="145" width="102" height="48" rx="7" fill="#d9f99d" stroke="#84cc16" stroke-width="1.5"/>
      <text x="106" y="175" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Switch</text>

      <!-- Right Switch Node -->
      <rect x="338" y="145" width="102" height="50" rx="7" fill="#d9f99d" stroke="#84cc16" stroke-width="1.5"/>
      <text x="389" y="176" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Switch</text>

      <!-- VM1 (Gray) -->
      <rect x="0" y="255" width="92" height="48" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
      <text x="46" y="285" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">VM1</text>

      <!-- VM2 (Blue) -->
      <rect x="138" y="255" width="92" height="52" rx="7" fill="#bae6fd" stroke="#60a5fa" stroke-width="1.4"/>
      <text x="184" y="287" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">VM2</text>

      <!-- VM3 (Gray) -->
      <rect x="282" y="258" width="96" height="48" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
      <text x="330" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">VM3</text>

      <!-- VM4 (Blue) -->
      <rect x="435" y="258" width="92" height="50" rx="7" fill="#bae6fd" stroke="#60a5fa" stroke-width="1.4"/>
      <text x="481" y="289" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">VM4</text>
    </g>
  </g>
</svg>