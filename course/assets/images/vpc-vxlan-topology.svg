<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="auto">
  <defs>
    <filter id="vx-shadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Transparent Canvas Background for Night Mode -->
  <rect width="1100" height="380" fill="none"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- ==================== LEFT: PACKET STRUCTURE ==================== -->
    <g transform="translate(10, 40)" filter="url(#vx-shadow)">
      <!-- Eth -->
      <rect x="20" y="30" width="75" height="60" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="57.5" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Eth</text>

      <!-- IP -->
      <rect x="95" y="30" width="70" height="60" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="130" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">IP</text>

      <!-- UDP -->
      <rect x="165" y="30" width="70" height="60" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
      <text x="200" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">UDP</text>

      <!-- Tunnel -->
      <rect x="235" y="30" width="140" height="60" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
      <text x="305" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#0369a1">Tunnel</text>

      <!-- User packet -->
      <rect x="375" y="30" width="145" height="60" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
      <text x="447.5" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">User packet</text>

      <!-- Bracket under Tunnel (x=235 to 375, center 305) -->
      <path d="M 238 100 
               Q 238 118, 270 118 
               L 295 118 
               Q 305 118, 305 130
               Q 305 118, 315 118 
               L 340 118 
               Q 372 118, 372 100" 
            fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>

      <!-- Tunnel ID100 & Tunnel ID200 Labels -->
      <g transform="translate(180, 160)">
        <rect x="0" y="0" width="125" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
        <text x="62.5" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Tunnel ID100</text>
      </g>
      <g transform="translate(320, 160)">
        <rect x="0" y="0" width="125" height="30" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="62.5" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">Tunnel ID200</text>
      </g>
    </g>

    <!-- ==================== RIGHT: UNDERLAY NETWORK TOPOLOGY ==================== -->
    <g transform="translate(560, 20)">
      
      <!-- Multi-path Network Links (Thick Trunk Lines) -->
      <!-- Between Gateway & Left Switch -->
      <line x1="170" y1="55" x2="65" y2="150" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
      <line x1="165" y1="50" x2="60" y2="145" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>

      <!-- Between Gateway & Right Switch -->
      <line x1="285" y1="55" x2="390" y2="150" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
      <line x1="290" y1="50" x2="395" y2="145" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>

      <!-- Between Left Switch & Right Switch -->
      <line x1="130" y1="162" x2="320" y2="162" stroke="#cbd5e1" stroke-width="5"/>
      <line x1="130" y1="155" x2="320" y2="155" stroke="#16a34a" stroke-width="3"/>

      <!-- Links to VMs -->
      <!-- Left Switch to VM1 (100 - Green) -->
      <line x1="60" y1="180" x2="0" y2="280" stroke="#16a34a" stroke-width="2"/>
      <!-- Left Switch to VM2 (200 - Gray) -->
      <line x1="85" y1="180" x2="135" y2="280" stroke="#94a3b8" stroke-width="2"/>
      <!-- Right Switch to VM3 (100 - Green) -->
      <line x1="365" y1="180" x2="315" y2="280" stroke="#16a34a" stroke-width="2"/>
      <!-- Right Switch to VM4 (200 - Gray) -->
      <line x1="390" y1="180" x2="450" y2="280" stroke="#94a3b8" stroke-width="2"/>

      <!-- Link ID Labels (100 and 200) with white pill background for dark mode -->
      <g transform="translate(10, 215)">
        <rect x="-15" y="-12" width="30" height="20" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
        <text x="0" y="3" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a">100</text>
      </g>
      <g transform="translate(115, 215)">
        <rect x="-15" y="-12" width="30" height="20" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
        <text x="0" y="3" text-anchor="middle" font-size="12" font-weight="800" fill="#0284c7">200</text>
      </g>
      <g transform="translate(335, 215)">
        <rect x="-15" y="-12" width="30" height="20" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
        <text x="0" y="3" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a">100</text>
      </g>
      <g transform="translate(440, 215)">
        <rect x="-15" y="-12" width="30" height="20" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
        <text x="0" y="3" text-anchor="middle" font-size="12" font-weight="800" fill="#0284c7">200</text>
      </g>

      <!-- Network Nodes (Gateway, Switches) -->
      <!-- Gateway -->
      <g transform="translate(160, 15)" filter="url(#vx-shadow)">
        <rect width="135" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
        <text x="67.5" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Gateway</text>
      </g>

      <!-- Left Switch -->
      <g transform="translate(10, 135)" filter="url(#vx-shadow)">
        <rect width="125" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
        <text x="62.5" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Switch</text>
      </g>

      <!-- Right Switch -->
      <g transform="translate(320, 135)" filter="url(#vx-shadow)">
        <rect width="125" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
        <text x="62.5" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Switch</text>
      </g>

      <!-- VM Nodes -->
      <!-- VM1 (Gray) -->
      <g transform="translate(-45, 275)" filter="url(#vx-shadow)">
        <rect width="90" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
        <text x="45" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">VM1</text>
      </g>

      <!-- VM2 (Blue) -->
      <g transform="translate(90, 275)" filter="url(#vx-shadow)">
        <rect width="90" height="48" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8"/>
        <text x="45" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0369a1">VM2</text>
      </g>

      <!-- VM3 (Gray) -->
      <g transform="translate(265, 275)" filter="url(#vx-shadow)">
        <rect width="90" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
        <text x="45" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">VM3</text>
      </g>

      <!-- VM4 (Blue) -->
      <g transform="translate(400, 275)" filter="url(#vx-shadow)">
        <rect width="90" height="48" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8"/>
        <text x="45" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0369a1">VM4</text>
      </g>

    </g>
  </g>
</svg>
