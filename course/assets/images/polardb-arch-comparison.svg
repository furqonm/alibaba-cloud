<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" height="100%">
  <defs>
    <filter id="p-shadow" x="-5%" y="-4%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="parr-orange" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 1, 6 3, 0 5" fill="#ea580c"/>
    </marker>
    <marker id="parr-blue" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 1, 6 3, 0 5" fill="#0284c7"/>
    </marker>
    <marker id="parr-gray" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 1, 6 3, 0 5" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .halo-text {
      paint-order: stroke fill;
      stroke: #ffffff;
      stroke-width: 4px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
  </style>

  <!-- ==================== TOP CLIENT LAYER: ECS NODES ==================== -->
  <g transform="translate(60, 15)">
    <!-- ECS 1 -->
    <g transform="translate(30, 0)">
      <rect width="90" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#p-shadow)"/>
      <g transform="translate(10, 8)">
        <rect x="0" y="0" width="18" height="4.5" rx="1.2" fill="#ff6a00"/>
        <circle cx="14" cy="2.25" r="0.9" fill="#ffffff"/>
        <rect x="0" y="6" width="18" height="4.5" rx="1.2" fill="#ff6a00"/>
        <circle cx="14" cy="8.25" r="0.9" fill="#ffffff"/>
        <rect x="0" y="12" width="18" height="4.5" rx="1.2" fill="#ff6a00"/>
        <circle cx="14" cy="14.25" r="0.9" fill="#ffffff"/>
      </g>
      <text x="54" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">ECS</text>
    </g>

    <!-- ECS 2 -->
    <g transform="translate(230, 0)">
      <rect width="90" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#p-shadow)"/>
      <g transform="translate(10, 8)">
        <rect x="0" y="0" width="18" height="4.5" rx="1.2" fill="#ff6a00"/>
        <circle cx="14" cy="2.25" r="0.9" fill="#ffffff"/>
        <rect x="0" y="6" width="18" height="4.5" rx="1.2" fill="#ff6a00"/>
        <circle cx="14" cy="8.25" r="0.9" fill="#ffffff"/>
        <rect x="0" y="12" width="18" height="4.5" rx="1.2" fill="#ff6a00"/>
        <circle cx="14" cy="14.25" r="0.9" fill="#ffffff"/>
      </g>
      <text x="54" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">ECS</text>
    </g>

    <!-- Ellipsis -->
    <text x="355" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">•••</text>

    <!-- ECS N -->
    <g transform="translate(390, 0)">
      <rect width="90" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#p-shadow)"/>
      <g transform="translate(10, 8)">
        <rect x="0" y="0" width="18" height="4.5" rx="1.2" fill="#ff6a00"/>
        <circle cx="14" cy="2.25" r="0.9" fill="#ffffff"/>
        <rect x="0" y="6" width="18" height="4.5" rx="1.2" fill="#ff6a00"/>
        <circle cx="14" cy="8.25" r="0.9" fill="#ffffff"/>
        <rect x="0" y="12" width="18" height="4.5" rx="1.2" fill="#ff6a00"/>
        <circle cx="14" cy="14.25" r="0.9" fill="#ffffff"/>
      </g>
      <text x="54" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">ECS</text>
    </g>
  </g>

  <!-- Connectors ECS -> Splitter -->
  <path d="M 135 49 L 135 68 L 260 68" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 335 49 L 335 68" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 495 49 L 495 68 L 410 68" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- ==================== READ/WRITE SPLITTER PROXY ==================== -->
  <g transform="translate(170, 70)">
    <rect width="330" height="38" rx="8" fill="#ffffff" stroke="#ff6a00" stroke-width="1.8" filter="url(#p-shadow)"/>
    <circle cx="28" cy="19" r="10" fill="#fff7ed" stroke="#ff6a00" stroke-width="1"/>
    <path d="M 23 19 L 33 19 M 29 15 L 33 19 L 29 23" stroke="#ff6a00" stroke-width="1.5" stroke-linecap="round"/>
    <text x="175" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0f172a">Read/Write Splitter</text>
    <text x="175" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748b">With Intelligent Load Balancing</text>
  </g>

  <!-- Splitter Connectors to Compute Nodes -->
  <!-- Write to Primary Node -->
  <path d="M 220 108 L 220 120 L 135 120 L 135 145" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#parr-orange)"/>
  <text x="135" y="138" text-anchor="middle" class="halo-text" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#c2410c">Read/Write</text>

  <!-- Read to Replica 1 -->
  <path d="M 335 108 L 335 145" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#parr-blue)"/>
  <text x="360" y="138" text-anchor="middle" class="halo-text" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#0284c7">Read-Only</text>

  <!-- Read to Replica N -->
  <path d="M 450 108 L 450 120 L 535 120 L 535 145" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#parr-blue)"/>
  <text x="535" y="138" text-anchor="middle" class="halo-text" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#0284c7">Read-Only</text>

  <!-- ==================== COMPUTE TIER: DB NODES ==================== -->
  <!-- Vertical Text: Scale Up/Down (Far Left) with strong halo -->
  <g transform="translate(48, 230)">
    <text x="0" y="-8" text-anchor="middle" class="halo-text" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Scale</text>
    <text x="0" y="6" text-anchor="middle" class="halo-text" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ea580c">Up/Down</text>
    <path d="M 0 -22 L 0 -36 M -3 -33 L 0 -38 L 3 -33" stroke="#ea580c" stroke-width="1.8"/>
    <path d="M 0 16 L 0 30 M -3 27 L 0 32 L 3 27" stroke="#ea580c" stroke-width="1.8"/>
  </g>

  <!-- NODE 1: PRIMARY NODE (RW) -->
  <g transform="translate(80, 145)">
    <rect width="110" height="150" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#p-shadow)"/>
    <!-- PolarDB Badge -->
    <rect x="25" y="8" width="60" height="18" rx="4" fill="#ea580c"/>
    <text x="55" y="20.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">PolarDB</text>
    <text x="55" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#0f172a">Primary Node</text>

    <!-- Layers -->
    <rect x="12" y="48" width="86" height="20" rx="3" fill="#ffedd5"/>
    <text x="55" y="61.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#c2410c">User Space File Sys</text>

    <rect x="12" y="73" width="86" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="55" y="86.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#334155">Data Router &amp; Cache</text>

    <rect x="12" y="98" width="86" height="24" rx="4" fill="#ea580c"/>
    <text x="55" y="113.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">RW (R/W Engine)</text>
  </g>

  <!-- Failover Active Replication Link -->
  <g transform="translate(195, 185)">
    <path d="M 0 10 L 80 10" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3 2"/>
    <rect x="18" y="0" width="44" height="18" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="40" y="12" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#047857">Failover</text>
  </g>

  <!-- NODE 2: READ REPLICA 1 (RO) -->
  <g transform="translate(280, 145)">
    <rect width="110" height="150" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#p-shadow)"/>
    <rect x="25" y="8" width="60" height="18" rx="4" fill="#0284c7"/>
    <text x="55" y="20.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">PolarDB</text>
    <text x="55" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#0f172a">Read Replica 1</text>

    <!-- Layers -->
    <rect x="12" y="48" width="86" height="20" rx="3" fill="#e0f2fe"/>
    <text x="55" y="61.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#0369a1">User Space File Sys</text>

    <rect x="12" y="73" width="86" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="55" y="86.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#334155">Data Router &amp; Cache</text>

    <rect x="12" y="98" width="86" height="24" rx="4" fill="#0284c7"/>
    <text x="55" y="113.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">RO (Read Only)</text>
  </g>

  <!-- Replica Ellipsis -->
  <text x="435" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#94a3b8">•••</text>

  <!-- NODE 3: READ REPLICA N (RO) -->
  <g transform="translate(480, 145)">
    <rect width="110" height="150" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#p-shadow)"/>
    <rect x="25" y="8" width="60" height="18" rx="4" fill="#0284c7"/>
    <text x="55" y="20.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">PolarDB</text>
    <text x="55" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#0f172a">Read Replica N</text>

    <!-- Layers -->
    <rect x="12" y="48" width="86" height="20" rx="3" fill="#e0f2fe"/>
    <text x="55" y="61.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#0369a1">User Space File Sys</text>

    <rect x="12" y="73" width="86" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="55" y="86.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#334155">Data Router &amp; Cache</text>

    <rect x="12" y="98" width="86" height="24" rx="4" fill="#0284c7"/>
    <text x="55" y="113.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">RO (Up to 15 Nodes)</text>
  </g>

  <!-- Vertical Text: Scale Out/In (Far Right) with strong halo -->
  <g transform="translate(625, 230)">
    <text x="0" y="-8" text-anchor="middle" class="halo-text" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Scale</text>
    <text x="0" y="6" text-anchor="middle" class="halo-text" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0284c7">Out/In</text>
    <path d="M 0 -22 L 0 -36 M -3 -33 L 0 -38 L 3 -33" stroke="#0284c7" stroke-width="1.8"/>
    <path d="M 0 16 L 0 30 M -3 27 L 0 32 L 3 27" stroke="#0284c7" stroke-width="1.8"/>
  </g>

  <!-- ==================== HIGH-SPEED RDMA INTERCONNECT ==================== -->
  <g transform="translate(225, 310)">
    <rect width="220" height="34" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#p-shadow)"/>
    <path d="M 18 17 L 34 17 M 28 12 L 34 17 L 28 22" stroke="#0284c7" stroke-width="2"/>
    <path d="M 202 17 L 186 17 M 192 12 L 186 17 L 192 22" stroke="#0284c7" stroke-width="2"/>
    <text x="110" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0284c7">RDMA Network</text>
  </g>

  <!-- Connectors Compute <-> RDMA -->
  <path d="M 135 295 L 135 327 L 225 327" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 335 295 L 335 310" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 535 295 L 535 327 L 445 327" stroke="#64748b" stroke-width="1.5"/>

  <!-- ==================== DISTRIBUTED STORAGE: POLARSTORE ==================== -->
  <g transform="translate(70, 360)">
    <rect width="530" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#p-shadow)"/>
    <text x="265" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Shared PolarStore Distributed Storage</text>

    <!-- Chunk Server 1 -->
    <g transform="translate(20, 30)">
      <rect width="130" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#334155">Data Chunk Server 1</text>
      <!-- Chunks A(primary), b, c -->
      <g transform="translate(25, 23)">
        <rect x="0" y="0" width="22" height="18" rx="2" fill="#ea580c"/>
        <text x="11" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">A</text>
        <rect x="28" y="0" width="22" height="18" rx="2" fill="#eab308"/>
        <text x="39" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">b</text>
        <rect x="56" y="0" width="22" height="18" rx="2" fill="#10b981"/>
        <text x="67" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">c</text>
      </g>
    </g>

    <!-- Chunk Server 2 -->
    <g transform="translate(180, 30)">
      <rect width="130" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#334155">Data Chunk Server 2</text>
      <!-- Chunks a, B(primary), c -->
      <g transform="translate(25, 23)">
        <rect x="0" y="0" width="22" height="18" rx="2" fill="#ea580c"/>
        <text x="11" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">a</text>
        <rect x="28" y="0" width="22" height="18" rx="2" fill="#eab308"/>
        <text x="39" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">B</text>
        <rect x="56" y="0" width="22" height="18" rx="2" fill="#10b981"/>
        <text x="67" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">c</text>
      </g>
    </g>

    <!-- Storage Ellipsis -->
    <text x="345" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#94a3b8">•••</text>

    <!-- Chunk Server N -->
    <g transform="translate(380, 30)">
      <rect width="130" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#334155">Data Chunk Server N</text>
      <!-- Chunks a, b, C(primary) -->
      <g transform="translate(25, 23)">
        <rect x="0" y="0" width="22" height="18" rx="2" fill="#ea580c"/>
        <text x="11" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">a</text>
        <rect x="28" y="0" width="22" height="18" rx="2" fill="#eab308"/>
        <text x="39" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">b</text>
        <rect x="56" y="0" width="22" height="18" rx="2" fill="#10b981"/>
        <text x="67" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">C</text>
      </g>
    </g>
  </g>

  <!-- Connectors RDMA -> Storage -->
  <path d="M 280 344 L 280 360" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 390 344 L 390 360" stroke="#64748b" stroke-width="1.5"/>

  <!-- Parallel-Raft Protocol Note with crisp halo -->
  <text x="335" y="475" text-anchor="middle" class="halo-text" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">Parallel-Raft Protocol &amp; Storage Serverless Pool (Up to 500 TB)</text>
</svg>