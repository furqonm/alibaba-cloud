<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="auto">
  <defs>
    <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="vxlanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame: Physical Transport (Underlay) -->
  <rect x="10" y="15" width="740" height="190" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" fill="#475569">Physical Underlay Transport Packet (Layer 3 UDP Network)</text>

  <!-- Outer Ethernet Header -->
  <rect x="25" y="55" width="110" height="85" rx="6" fill="url(#outerGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#1e293b">Outer Ethernet</text>
  <text x="80" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#64748b">14 Bytes (MAC)</text>
  <text x="80" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#94a3b8">Physical Host NIC</text>

  <!-- Outer IP Header -->
  <rect x="145" y="55" width="110" height="85" rx="6" fill="url(#outerGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#1e293b">Outer IPv4</text>
  <text x="200" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#64748b">20 Bytes (IP)</text>
  <text x="200" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#94a3b8">Host IP Routing</text>

  <!-- Outer UDP Header -->
  <rect x="265" y="55" width="95" height="85" rx="6" fill="url(#outerGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="312" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#1e293b">Outer UDP</text>
  <text x="312" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#64748b">8 Bytes</text>
  <text x="312" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#94a3b8">Port 4789</text>

  <!-- VXLAN Header (Tunnel ID) -->
  <rect x="370" y="50" width="130" height="95" rx="8" fill="url(#vxlanGrad)" stroke="#ea580c" stroke-width="2"/>
  <text x="435" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="800" fill="#c2410c">VXLAN Header</text>
  <text x="435" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#9a3412">24-bit Tunnel ID</text>
  <text x="435" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#7c2d12">(16 Million VNIs)</text>
  <text x="435" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" fill="#c2410c">VPC Isolation Key</text>

  <!-- Inner Tenant Ethernet Frame -->
  <rect x="510" y="55" width="110" height="85" rx="6" fill="url(#innerGrad)" stroke="#0284c7" stroke-width="1.5"/>
  <text x="565" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#0369a1">Inner Ethernet</text>
  <text x="565" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#0284c7">Original MAC</text>
  <text x="565" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#0369a1">VM Virtual ENI</text>

  <!-- Inner Tenant Payload -->
  <rect x="630" y="55" width="105" height="85" rx="6" fill="url(#innerGrad)" stroke="#0284c7" stroke-width="1.5"/>
  <text x="682" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#0369a1">Tenant IP & Data</text>
  <text x="682" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#0284c7">Private Payload</text>
  <text x="682" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#0369a1">TCP/UDP/HTTP</text>

  <!-- Bottom Explanatory Caption -->
  <path d="M 510 150 L 510 170 L 735 170 L 735 150" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="622" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#0369a1">Original Tenant VM Packet (Encapsulated)</text>
</svg>
