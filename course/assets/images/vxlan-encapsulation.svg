<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="100%" height="auto">
  <defs>
    <!-- Drop shadow for packet -->
    <filter id="packet-shadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Transparent Canvas Background for Night Mode -->
  <rect width="820" height="240" fill="none"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" filter="url(#packet-shadow)">
    <!-- 1. Eth (Light Gray) -->
    <rect x="30" y="30" width="115" height="75" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="87.5" y="75" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Eth</text>

    <!-- 2. IP (Medium Gray) -->
    <rect x="145" y="30" width="100" height="75" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="195" y="75" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">IP</text>

    <!-- 3. UDP (Orange/Yellow) -->
    <rect x="245" y="30" width="100" height="75" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <text x="295" y="75" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">UDP</text>

    <!-- 4. Tunnel (Light Blue) -->
    <rect x="345" y="30" width="190" height="75" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
    <text x="440" y="75" text-anchor="middle" font-size="22" font-weight="700" fill="#0369a1">Tunnel</text>

    <!-- 5. User packet (Green) -->
    <rect x="535" y="30" width="250" height="75" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
    <text x="660" y="75" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">User packet</text>
  </g>

  <!-- Bracket under Tunnel -->
  <g>
    <!-- Left bracket curve: starts at x=348 y=120, curves to x=440 y=145, right curve to x=532 y=120 -->
    <path d="M 348 118 
             Q 348 138, 385 138 
             L 430 138 
             Q 440 138, 440 152
             Q 440 138, 450 138 
             L 495 138 
             Q 532 138, 532 118" 
          fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 24-bit Tunnel ID Text with White Halo for Night Mode Contrast -->
    <g transform="translate(440, 195)">
      <!-- Card Pill for perfect contrast in both light & dark modes -->
      <rect x="-110" y="-24" width="220" height="38" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#packet-shadow)"/>
      <text x="0" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0369a1">24-bit Tunnel ID</text>
    </g>
  </g>
</svg>
