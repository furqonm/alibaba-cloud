<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" width="100%" height="100%">
  <defs>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow-sess" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="620" height="540" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== TOP HALF: WITHOUT SESSION STICKINESS ==================== -->
  <g transform="translate(15, 15)">
    <rect width="590" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Client 1 (Orange Avatar) -->
    <g transform="translate(25, 30)" filter="url(#shadow-sess)">
      <circle cx="30" cy="30" r="25" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <circle cx="30" cy="23" r="9" fill="#ea580c"/>
      <path d="M 15 44 C 15 34 45 34 45 44" fill="#ea580c"/>
    </g>

    <!-- Client 2 (Green Avatar) -->
    <g transform="translate(25, 140)" filter="url(#shadow-sess)">
      <circle cx="30" cy="30" r="25" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <circle cx="30" cy="23" r="9" fill="#16a34a"/>
      <path d="M 15 44 C 15 34 45 34 45 44" fill="#16a34a"/>
    </g>

    <!-- Center Load Balancer -->
    <g transform="translate(245, 75)" filter="url(#shadow-sess)">
      <rect width="110" height="85" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <rect x="0" y="0" width="110" height="24" rx="10" fill="#7c3aed"/>
      <rect x="0" y="16" width="110" height="8" fill="#7c3aed"/>
      <text x="55" y="16" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SLB</text>
      <!-- Branching network icon -->
      <circle cx="55" cy="52" r="14" fill="#ede9fe"/>
      <circle cx="55" cy="46" r="3.5" fill="#7c3aed"/>
      <circle cx="47" cy="58" r="3.5" fill="#7c3aed"/>
      <circle cx="63" cy="58" r="3.5" fill="#7c3aed"/>
      <path d="M 55 46 L 47 58 M 55 46 L 63 58" stroke="#7c3aed" stroke-width="1.8"/>
    </g>

    <!-- Backend Server 1 -->
    <g transform="translate(475, 25)" filter="url(#shadow-sess)">
      <rect width="90" height="65" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
      <rect x="8" y="10" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="15.5" r="2" fill="#10b981"/>
      <rect x="8" y="27" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="32.5" r="2" fill="#10b981"/>
      <rect x="8" y="44" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="49.5" r="2" fill="#10b981"/>
    </g>

    <!-- Backend Server 2 -->
    <g transform="translate(475, 140)" filter="url(#shadow-sess)">
      <rect width="90" height="65" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
      <rect x="8" y="10" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="15.5" r="2" fill="#10b981"/>
      <rect x="8" y="27" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="32.5" r="2" fill="#10b981"/>
      <rect x="8" y="44" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="49.5" r="2" fill="#10b981"/>
    </g>

    <!-- Ingress Arrows: Clients to LB -->
    <line x1="90" y1="60" x2="235" y2="105" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange)"/>
    <line x1="90" y1="170" x2="235" y2="130" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Egress Arrows (Distributed Round-Robin): LB to Servers -->
    <!-- Client 1 traffic split -->
    <line x1="365" y1="100" x2="465" y2="55" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange)"/>
    <line x1="365" y1="110" x2="465" y2="160" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>

    <!-- Client 2 traffic split -->
    <line x1="365" y1="120" x2="465" y2="65" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
    <line x1="365" y1="130" x2="465" y2="170" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  </g>

  <!-- Horizontal Center Divider -->
  <line x1="30" y1="270" x2="590" y2="270" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ==================== BOTTOM HALF: WITH SESSION STICKINESS ==================== -->
  <g transform="translate(15, 285)">
    <rect width="590" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Client 1 with Cookie Badge -->
    <g transform="translate(25, 30)" filter="url(#shadow-sess)">
      <circle cx="30" cy="30" r="25" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <circle cx="30" cy="23" r="9" fill="#ea580c"/>
      <path d="M 15 44 C 15 34 45 34 45 44" fill="#ea580c"/>
    </g>
    <g transform="translate(95, 45)">
      <rect width="70" height="24" rx="4" fill="#ea580c"/>
      <text x="35" y="16" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700">Cookie A</text>
    </g>

    <!-- Client 2 with Cookie Badge -->
    <g transform="translate(25, 140)" filter="url(#shadow-sess)">
      <circle cx="30" cy="30" r="25" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <circle cx="30" cy="23" r="9" fill="#16a34a"/>
      <path d="M 15 44 C 15 34 45 34 45 44" fill="#16a34a"/>
    </g>
    <g transform="translate(95, 155)">
      <rect width="70" height="24" rx="4" fill="#16a34a"/>
      <text x="35" y="16" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700">Cookie B</text>
    </g>

    <!-- Center Load Balancer -->
    <g transform="translate(245, 75)" filter="url(#shadow-sess)">
      <rect width="110" height="85" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <rect x="0" y="0" width="110" height="24" rx="10" fill="#7c3aed"/>
      <rect x="0" y="16" width="110" height="8" fill="#7c3aed"/>
      <text x="55" y="16" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SLB</text>
      <circle cx="55" cy="52" r="14" fill="#ede9fe"/>
      <circle cx="55" cy="46" r="3.5" fill="#7c3aed"/>
      <circle cx="47" cy="58" r="3.5" fill="#7c3aed"/>
      <circle cx="63" cy="58" r="3.5" fill="#7c3aed"/>
      <path d="M 55 46 L 47 58 M 55 46 L 63 58" stroke="#7c3aed" stroke-width="1.8"/>
    </g>

    <!-- Backend Server 1 -->
    <g transform="translate(475, 25)" filter="url(#shadow-sess)">
      <rect width="90" height="65" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
      <rect x="8" y="10" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="15.5" r="2" fill="#10b981"/>
      <rect x="8" y="27" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="32.5" r="2" fill="#10b981"/>
      <rect x="8" y="44" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="49.5" r="2" fill="#10b981"/>
    </g>

    <!-- Backend Server 2 -->
    <g transform="translate(475, 140)" filter="url(#shadow-sess)">
      <rect width="90" height="65" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
      <rect x="8" y="10" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="15.5" r="2" fill="#10b981"/>
      <rect x="8" y="27" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="32.5" r="2" fill="#10b981"/>
      <rect x="8" y="44" width="74" height="11" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="16" cy="49.5" r="2" fill="#10b981"/>
    </g>

    <!-- Ingress Arrows: Clients with Cookies to LB -->
    <line x1="175" y1="57" x2="235" y2="105" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-orange)"/>
    <line x1="175" y1="167" x2="235" y2="130" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>

    <!-- Pinned Egress Arrows: LB to Dedicated Servers -->
    <!-- All Client 1 traffic pinned to Server 1 -->
    <line x1="365" y1="95" x2="465" y2="50" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-orange)"/>
    <line x1="365" y1="105" x2="465" y2="60" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>

    <!-- All Client 2 traffic pinned to Server 2 -->
    <line x1="365" y1="125" x2="465" y2="165" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <line x1="365" y1="135" x2="465" y2="175" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  </g>
</svg>