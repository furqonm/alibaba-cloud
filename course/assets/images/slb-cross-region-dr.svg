<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <marker id="cr-arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="cr-arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="cr-arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <filter id="cr-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="640" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Internet Node -->
  <g transform="translate(265, 15)">
    <rect width="110" height="38" rx="19" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="55" y="24" text-anchor="middle" fill="#0369a1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Internet</text>
  </g>

  <!-- Cloud DNS / GTM (Middle Node) -->
  <g transform="translate(250, 75)" filter="url(#cr-shadow)">
    <rect width="140" height="46" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="70" y="28" text-anchor="middle" fill="#0369a1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cloud DNS / GTM</text>
  </g>
  <line x1="320" y1="53" x2="320" y2="73" stroke="#0284c7" stroke-width="2" marker-end="url(#cr-arrow-blue)"/>

  <!-- Left Container: Region 1 (Outage / Failover Origin) -->
  <g transform="translate(15, 160)">
    <rect width="295" height="300" rx="8" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>
    <rect x="15" y="-12" width="100" height="24" rx="4" fill="#b91c1c"/>
    <text x="65" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Region 1</text>

    <!-- SLB Node (Region 1) -->
    <g transform="translate(20, 25)">
      <rect width="255" height="45" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
      <text x="127" y="27" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SLB Instance</text>
      <rect x="200" y="-8" width="50" height="16" rx="8" fill="#ef4444"/>
      <text x="225" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">DOWN</text>
    </g>

    <!-- Zone A and Zone B inside Region 1 -->
    <g transform="translate(15, 90)">
      <rect width="125" height="190" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="62" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">Zone A</text>
      <rect x="15" y="35" width="95" height="40" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="62" y="59" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ECS</text>
      <rect x="15" y="85" width="95" height="40" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="62" y="109" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ECS</text>
      <rect x="15" y="135" width="95" height="40" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="62" y="159" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ECS</text>
    </g>

    <g transform="translate(155, 90)">
      <rect width="125" height="190" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="62" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">Zone B</text>
      <rect x="15" y="35" width="95" height="40" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="62" y="59" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ECS</text>
      <rect x="15" y="85" width="95" height="40" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="62" y="109" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ECS</text>
      <rect x="15" y="135" width="95" height="40" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="62" y="159" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ECS</text>
    </g>
  </g>

  <!-- Right Container: Region 2 (Failover Target) -->
  <g transform="translate(330, 160)">
    <rect width="295" height="300" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="180" y="-12" width="100" height="24" rx="4" fill="#166534"/>
    <text x="230" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Region 2</text>

    <!-- SLB Instance (Region 2) -->
    <g transform="translate(20, 25)" filter="url(#cr-shadow)">
      <rect width="255" height="45" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <text x="127" y="27" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SLB Instance</text>
      <rect x="200" y="-8" width="50" height="16" rx="8" fill="#16a34a"/>
      <text x="225" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">ACTIVE</text>
    </g>

    <!-- ECS Fleet in Region 2 -->
    <g transform="translate(15, 90)">
      <rect width="265" height="190" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="132" y="20" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">ECS Cluster</text>
      
      <g transform="translate(20, 35)">
        <rect width="105" height="55" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="52" y="32" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ECS</text>
        <circle cx="52" cy="12" r="3" fill="#16a34a"/>
      </g>
      <g transform="translate(140, 35)">
        <rect width="105" height="55" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="52" y="32" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ECS</text>
        <circle cx="52" cy="12" r="3" fill="#16a34a"/>
      </g>
      <g transform="translate(80, 110)">
        <rect width="105" height="55" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="52" y="32" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ECS</text>
        <circle cx="52" cy="12" r="3" fill="#16a34a"/>
      </g>
    </g>

    <!-- Distribute lines from SLB to ECS -->
    <line x1="147" y1="70" x2="80" y2="125" stroke="#16a34a" stroke-width="1.5" marker-end="url(#cr-arrow-green)"/>
    <line x1="147" y1="70" x2="210" y2="125" stroke="#16a34a" stroke-width="1.5" marker-end="url(#cr-arrow-green)"/>
  </g>

  <!-- Route from Cloud DNS to Region 1 (Crossed / Failed) -->
  <line x1="280" y1="121" x2="162" y2="182" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <g transform="translate(220, 150)">
    <circle cx="0" cy="0" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Route from Cloud DNS to Region 2 (Failover Shift) -->
  <line x1="360" y1="121" x2="425" y2="182" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#cr-arrow-orange)"/>
</svg>