<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330">
  <defs>
    <filter id="rz-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Outer Canvas Border -->
  <rect width="820" height="330" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  

  <!-- ==================== REGION 1 (LEFT) ==================== -->
  <g transform="translate(20, 34)">
    <!-- Region 1 Boundary -->
    <rect width="380" height="262" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6,4"/>
    <rect x="16" y="-12" width="105" height="24" rx="4" fill="#0284c7"/>
    <text x="68" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Region 1</text>

    

    <!-- Intra-Region Connection Lines -->
    <path d="M 190 85 L 105 160" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="4,3"/>
    <path d="M 190 85 L 275 160" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="4,3"/>
    <path d="M 105 180 L 275 180" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="4,3"/>

    <!-- Zone A Card -->
    <g transform="translate(130, 58)" filter="url(#rz-shadow)">
      <rect width="120" height="48" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="60" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#0369a1">Zone A</text>
      <text x="60" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">ap-southeast-1a</text>
    </g>

    <!-- Zone B Card -->
    <g transform="translate(45, 155)" filter="url(#rz-shadow)">
      <rect width="120" height="48" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="60" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#0369a1">Zone B</text>
      <text x="60" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">ap-southeast-1b</text>
    </g>

    <!-- Zone C Card -->
    <g transform="translate(215, 155)" filter="url(#rz-shadow)">
      <rect width="120" height="48" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="60" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#0369a1">Zone C</text>
      <text x="60" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">ap-southeast-1c</text>
    </g>

    <!-- Note at bottom -->
    <rect x="40" y="222" width="300" height="26" rx="4" fill="#e0f2fe"/>
    <text x="190" y="239" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">Dedicated Power &amp; Substation Isolation</text>
  </g>

  <!-- ==================== REGION 2 (RIGHT) ==================== -->
  <g transform="translate(420, 34)">
    <!-- Region 2 Boundary -->
    <rect width="380" height="262" rx="8" fill="#f8fafc" stroke="#10b981" stroke-width="1.8" stroke-dasharray="6,4"/>
    <rect x="16" y="-12" width="105" height="24" rx="4" fill="#10b981"/>
    <text x="68" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Region 2</text>

    

    <!-- Intra-Region Connection Lines -->
    <path d="M 190 85 L 105 160" stroke="#10b981" stroke-width="2.2" stroke-dasharray="4,3"/>
    <path d="M 190 85 L 275 160" stroke="#10b981" stroke-width="2.2" stroke-dasharray="4,3"/>
    <path d="M 105 180 L 275 180" stroke="#10b981" stroke-width="2.2" stroke-dasharray="4,3"/>

    <!-- Zone A Card -->
    <g transform="translate(130, 58)" filter="url(#rz-shadow)">
      <rect width="120" height="48" rx="6" fill="#ffffff" stroke="#4ade80" stroke-width="1.8"/>
      <text x="60" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#047857">Zone A</text>
      <text x="60" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">ap-southeast-5a</text>
    </g>

    <!-- Zone B Card -->
    <g transform="translate(45, 155)" filter="url(#rz-shadow)">
      <rect width="120" height="48" rx="6" fill="#ffffff" stroke="#4ade80" stroke-width="1.8"/>
      <text x="60" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#047857">Zone B</text>
      <text x="60" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">ap-southeast-5b</text>
    </g>

    <!-- Zone C Card -->
    <g transform="translate(215, 155)" filter="url(#rz-shadow)">
      <rect width="120" height="48" rx="6" fill="#ffffff" stroke="#4ade80" stroke-width="1.8"/>
      <text x="60" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#047857">Zone C</text>
      <text x="60" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">ap-southeast-5c</text>
    </g>

    <!-- Note at bottom -->
    <rect x="40" y="222" width="300" height="26" rx="4" fill="#dcfce7"/>
    <text x="190" y="239" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#047857">High-Speed Optical Fiber Interconnect</text>
  </g>
</svg>