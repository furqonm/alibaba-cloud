<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <linearGradient id="ackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF8F3D" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF6A00" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Outer Container -->
    <rect x="10" y="10" width="940" height="460" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- TOP SECTION: Alibaba Cloud Managed Control Plane -->
    <g filter="url(#shadow)">
      <rect x="25" y="25" width="910" height="110" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
      <rect x="25" y="25" width="910" height="28" rx="8" fill="url(#cloudGrad)" />
      <rect x="25" y="45" width="910" height="8" fill="url(#cloudGrad)" />
      <text x="45" y="44" fill="#FFFFFF" font-size="13" font-weight="700">ACK Managed Control Plane (Multi-AZ High Availability &bull; 99.95% SLA)</text>
      <text x="915" y="44" fill="#E0F2FE" font-size="11" font-weight="600" text-anchor="end">Fully Managed by Alibaba Cloud &bull; Zero Master Host Tax</text>

      <!-- Control Plane Components -->
      <!-- kube-apiserver -->
      <rect x="45" y="65" width="160" height="56" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
      <text x="125" y="88" fill="#0369A1" font-size="12" font-weight="700" text-anchor="middle">kube-apiserver</text>
      <text x="125" y="106" fill="#0284C7" font-size="10" font-weight="500" text-anchor="middle">Secure REST API & Auth</text>

      <!-- etcd cluster -->
      <rect x="220" y="65" width="160" height="56" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
      <text x="300" y="88" fill="#0369A1" font-size="12" font-weight="700" text-anchor="middle">etcd (Distributed Key-Value)</text>
      <text x="300" y="106" fill="#0284C7" font-size="10" font-weight="500" text-anchor="middle">Multi-AZ Replicated State</text>

      <!-- kube-controller-manager -->
      <rect x="395" y="65" width="170" height="56" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
      <text x="480" y="88" fill="#0369A1" font-size="12" font-weight="700" text-anchor="middle">Controller Manager</text>
      <text x="480" y="106" fill="#0284C7" font-size="10" font-weight="500" text-anchor="middle">Lifecycle & Node Control</text>

      <!-- kube-scheduler -->
      <rect x="580" y="65" width="160" height="56" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
      <text x="660" y="88" fill="#0369A1" font-size="12" font-weight="700" text-anchor="middle">kube-scheduler</text>
      <text x="660" y="106" fill="#0284C7" font-size="10" font-weight="500" text-anchor="middle">Affinity & Topology-Aware</text>

      <!-- Cloud Controller Manager (CCM) -->
      <rect x="755" y="65" width="165" height="56" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
      <text x="837" y="88" fill="#1D4ED8" font-size="12" font-weight="700" text-anchor="middle">Cloud Controller (CCM)</text>
      <text x="837" y="106" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">Auto-bind SLB/ALB & Routes</text>
    </g>

    <!-- MIDDLE CONNECTOR ARROWS -->
    <path d="M 480 135 L 480 165" stroke="#0284C7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-blue)" />
    <text x="495" y="154" fill="#64748B" font-size="10" font-weight="600">Encrypted Control Channel (WireGuard / TLS)</text>

    <!-- BOTTOM SECTION: Data Plane & Heterogeneous Node Pools -->
    <g filter="url(#shadow)">
      <rect x="25" y="170" width="910" height="285" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="25" y="170" width="910" height="28" rx="8" fill="#1E293B" />
      <rect x="25" y="190" width="910" height="8" fill="#1E293B" />
      <text x="45" y="189" fill="#FFFFFF" font-size="13" font-weight="700">ACK Data Plane: Heterogeneous Node Pools & Cloud-Native Add-ons</text>
      <text x="915" y="189" fill="#94A3B8" font-size="11" font-weight="500" text-anchor="end">VPC Network: 172.16.0.0/12</text>

      <!-- Worker Node Pool 1: Managed ECS Nodes -->
      <g>
        <rect x="40" y="210" width="375" height="230" rx="6" fill="#FFF7ED" stroke="#FFD8A8" stroke-width="1.5" />
        <rect x="40" y="210" width="375" height="24" rx="6" fill="#FF6A00" />
        <rect x="40" y="228" width="375" height="6" fill="#FF6A00" />
        <text x="55" y="227" fill="#FFFFFF" font-size="12" font-weight="700">Managed ECS Node Pool (Dedicated Compute)</text>

        <!-- Node 1 Box -->
        <rect x="52" y="242" width="168" height="185" rx="5" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
        <text x="136" y="260" fill="#C2410C" font-size="11" font-weight="700" text-anchor="middle">ECS Worker Node 1</text>
        <text x="136" y="274" fill="#9A3412" font-size="9" text-anchor="middle">ecs.g8i.2xlarge &bull; containerd</text>

        <!-- Pods in Node 1 -->
        <rect x="62" y="282" width="148" height="34" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
        <text x="136" y="297" fill="#B45309" font-size="10" font-weight="700" text-anchor="middle">App Pod (172.16.1.12)</text>
        <text x="136" y="310" fill="#78350F" font-size="8" text-anchor="middle">Direct ENI Elastic IP</text>

        <rect x="62" y="322" width="148" height="34" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
        <text x="136" y="337" fill="#B45309" font-size="10" font-weight="700" text-anchor="middle">Worker Pod (172.16.1.13)</text>
        <text x="136" y="350" fill="#78350F" font-size="8" text-anchor="middle">Terway CNI Micro-segmentation</text>

        <!-- Agent Daemons -->
        <rect x="62" y="362" width="70" height="26" rx="3" fill="#E2E8F0" />
        <text x="97" y="378" fill="#334155" font-size="9" font-weight="600" text-anchor="middle">kubelet</text>
        <rect x="140" y="362" width="70" height="26" rx="3" fill="#E2E8F0" />
        <text x="175" y="378" fill="#334155" font-size="9" font-weight="600" text-anchor="middle">kube-proxy</text>

        <rect x="62" y="394" width="148" height="24" rx="3" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1" />
        <text x="136" y="410" fill="#0369A1" font-size="9" font-weight="700" text-anchor="middle">Terway CNI + CSI Plugins</text>

        <!-- Node 2 Box -->
        <rect x="232" y="242" width="168" height="185" rx="5" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
        <text x="316" y="260" fill="#C2410C" font-size="11" font-weight="700" text-anchor="middle">ECS Worker Node 2</text>
        <text x="316" y="274" fill="#9A3412" font-size="9" text-anchor="middle">ecs.gn7i (GPU) &bull; AI Inference</text>

        <!-- GPU Pods -->
        <rect x="242" y="282" width="148" height="34" rx="4" fill="#FDF4FF" stroke="#D946EF" stroke-width="1" />
        <text x="316" y="297" fill="#A21CAF" font-size="10" font-weight="700" text-anchor="middle">Model Pod (GPU Slice)</text>
        <text x="316" y="310" fill="#701A75" font-size="8" text-anchor="middle">NVIDIA Container Toolkit</text>

        <rect x="242" y="322" width="148" height="34" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
        <text x="316" y="337" fill="#B45309" font-size="10" font-weight="700" text-anchor="middle">API Pod (172.16.2.20)</text>
        <text x="316" y="350" fill="#78350F" font-size="8" text-anchor="middle">Direct VPC Routing</text>

        <!-- Agent Daemons -->
        <rect x="242" y="362" width="70" height="26" rx="3" fill="#E2E8F0" />
        <text x="277" y="378" fill="#334155" font-size="9" font-weight="600" text-anchor="middle">kubelet</text>
        <rect x="320" y="362" width="70" height="26" rx="3" fill="#E2E8F0" />
        <text x="355" y="378" fill="#334155" font-size="9" font-weight="600" text-anchor="middle">kube-proxy</text>

        <rect x="242" y="394" width="148" height="24" rx="3" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1" />
        <text x="316" y="410" fill="#0369A1" font-size="9" font-weight="700" text-anchor="middle">Terway CNI + CSI Plugins</text>
      </g>

      <!-- Worker Node Pool 2: Serverless ECI Virtual Kubelet -->
      <g>
        <rect x="430" y="210" width="220" height="230" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" />
        <rect x="430" y="210" width="220" height="24" rx="6" fill="#059669" />
        <rect x="430" y="228" width="220" height="6" fill="#059669" />
        <text x="445" y="227" fill="#FFFFFF" font-size="12" font-weight="700">Serverless ECI (Virtual Kubelet)</text>

        <!-- Virtual Node Header -->
        <rect x="442" y="242" width="196" height="34" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
        <text x="540" y="257" fill="#15803D" font-size="11" font-weight="700" text-anchor="middle">Virtual-Node Controller</text>
        <text x="540" y="270" fill="#166534" font-size="9" text-anchor="middle">Instant Pod Burst &bull; 0 VM Overhead</text>

        <!-- ECI Pods -->
        <rect x="442" y="284" width="196" height="44" rx="4" fill="#DCFCE7" stroke="#22C55E" stroke-width="1" />
        <text x="540" y="302" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">ECI Elastic Pod 1 (Surge)</text>
        <text x="540" y="318" fill="#14532D" font-size="9" text-anchor="middle">Direct ENI &bull; Per-Second Billing</text>

        <rect x="442" y="336" width="196" height="44" rx="4" fill="#DCFCE7" stroke="#22C55E" stroke-width="1" />
        <text x="540" y="354" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">ECI Batch Job Pod 2</text>
        <text x="540" y="370" fill="#14532D" font-size="9" text-anchor="middle">Zero Idle Cost &bull; Instant Spin-up</text>

        <!-- Autoscale Indicator -->
        <rect x="442" y="388" width="196" height="42" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" stroke-dasharray="3 3" />
        <text x="540" y="405" fill="#15803D" font-size="9" font-weight="700" text-anchor="middle">Auto-scale via HPA / KEDA</text>
        <text x="540" y="420" fill="#166534" font-size="8" text-anchor="middle">Overflow burst from ECS to ECI</text>
      </g>

      <!-- Cloud-Native Ecosystem Integration (Storage, Networking, Ingress) -->
      <g>
        <rect x="665" y="210" width="255" height="230" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
        <rect x="665" y="210" width="255" height="24" rx="6" fill="#475569" />
        <rect x="665" y="228" width="255" height="6" fill="#475569" />
        <text x="680" y="227" fill="#FFFFFF" font-size="12" font-weight="700">Cloud-Native Integrations</text>

        <!-- Network / Terway CNI -->
        <rect x="677" y="242" width="231" height="56" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
        <text x="688" y="260" fill="#0284C7" font-size="11" font-weight="700">Terway CNI (VPC Native)</text>
        <text x="688" y="275" fill="#475569" font-size="9">Allocates native VPC ENI IP to each Pod.</text>
        <text x="688" y="289" fill="#059669" font-size="9" font-weight="600">&bull; No overlay tax &bull; SG micro-segmentation</text>

        <!-- Storage / CSI Plugin -->
        <rect x="677" y="306" width="231" height="64" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
        <text x="688" y="324" fill="#D97706" font-size="11" font-weight="700">CSI Storage Plugin</text>
        <text x="688" y="339" fill="#475569" font-size="9">Dynamic PV provisioning across Alibaba storage:</text>
        <text x="688" y="353" fill="#1E293B" font-size="9">&bull; <strong>Cloud Disk (ESSD):</strong> High-IOPS Block</text>
        <text x="688" y="365" fill="#1E293B" font-size="9">&bull; <strong>NAS / OSS:</strong> Shared NFS & Object Storage</text>

        <!-- Traffic Ingress / SLB -->
        <rect x="677" y="378" width="231" height="54" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
        <text x="688" y="396" fill="#7C3AED" font-size="11" font-weight="700">Traffic Ingress (ALB / NLB)</text>
        <text x="688" y="411" fill="#475569" font-size="9">Automatic service discovery with CCM.</text>
        <text x="688" y="424" fill="#6D28D9" font-size="9" font-weight="600">&bull; Direct pod-level traffic routing (bypasses NodePort)</text>
      </g>
    </g>
  </g>
</svg>