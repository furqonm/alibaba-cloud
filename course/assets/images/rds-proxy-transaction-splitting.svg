<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" width="100%" height="100%">
  <defs>
    <filter id="proxy-shadow" x="-5%" y="-4%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-read" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="arr-write" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="arr-pin" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arr-commit" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#475569"/>
    </marker>
    <style>
      .halo-text { paint-order: stroke fill; stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Title Pill / Sequence Label -->
  <rect x="140" y="8" width="260" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#proxy-shadow)"/>
  <text x="270" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#475569">TRANSACTION SQL STATEMENT STREAM</text>

  <!-- Top SQL Sequence Pipeline Container -->
  <g transform="translate(30, 42)">
    <!-- Pipeline background capsule -->
    <rect width="480" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#proxy-shadow)"/>
    
    <!-- 1. BEGIN -->
    <rect x="6" y="5" width="70" height="36" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="41" y="27" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" fill="#475569">BEGIN</text>

    <!-- 2. READ (Pre-write) -->
    <rect x="82" y="5" width="72" height="36" rx="5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="118" y="27" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="12.5" font-weight="800" fill="#0369a1">READ</text>

    <!-- 3. READ (Pre-write) -->
    <rect x="160" y="5" width="72" height="36" rx="5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="196" y="27" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="12.5" font-weight="800" fill="#0369a1">READ</text>

    <!-- 4. UPDATE (Write Modification) -->
    <rect x="238" y="5" width="82" height="36" rx="5" fill="#ffedd5" stroke="#f97316" stroke-width="1.8"/>
    <text x="279" y="27" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="12.5" font-weight="900" fill="#c2410c">UPDATE</text>

    <!-- 5. READ (Post-write Pinned) -->
    <rect x="326" y="5" width="72" height="36" rx="5" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
    <text x="362" y="27" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="12.5" font-weight="800" fill="#b91c1c">READ</text>

    <!-- 6. COMMIT -->
    <rect x="404" y="5" width="70" height="36" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="439" y="27" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" fill="#475569">COMMIT</text>
  </g>

  <!-- Routing Curved Paths -->
  <!-- READ 1 -> Read-Only Instance -->
  <path d="M 148 90 C 148 140, 110 160, 110 212" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-read)"/>

  <!-- READ 2 -> Read-Only Instance -->
  <path d="M 226 90 C 226 150, 160 165, 160 212" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-read)"/>

  <!-- UPDATE -> Primary Instance -->
  <path d="M 309 90 C 309 140, 360 165, 360 212" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-write)"/>

  <!-- Post-Write READ 3 -> Primary Instance (PINNED) -->
  <path d="M 392 90 C 392 140, 410 165, 410 212" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-pin)"/>

  <!-- COMMIT -> Primary Instance -->
  <path d="M 469 90 C 469 150, 445 170, 445 212" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-commit)"/>

  <!-- Flow Callout Badges floating on connectors -->
  <rect x="65" y="145" width="88" height="22" rx="5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2" filter="url(#proxy-shadow)"/>
  <text x="109" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0369a1">Pre-Write Read</text>

  <rect x="375" y="145" width="112" height="22" rx="5" fill="#fee2e2" stroke="#f87171" stroke-width="1.2" filter="url(#proxy-shadow)"/>
  <text x="431" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#b91c1c">Post-Write Pinning</text>

  <!-- BOTTOM CARD 1: Read-Only Instance -->
  <g transform="translate(40, 220)">
    <rect width="200" height="125" rx="10" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" filter="url(#proxy-shadow)"/>
    <!-- RDS Icon Cluster (Orange) -->
    <g transform="translate(100, 22)">
      <polygon points="12,0 19,4 19,13 12,17 5,13 5,4" fill="#ff6a00"/>
      <polygon points="5,13 12,17 12,26 5,30 -2,26 -2,17" fill="#ff6a00"/>
      <polygon points="19,13 26,17 26,26 19,30 12,26 12,17" fill="#ff6a00"/>
    </g>
    <text x="100" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Read-Only Instance</text>
    <rect x="25" y="80" width="150" height="26" rx="5" fill="#f0f9ff"/>
    <text x="100" y="97" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0284c7">Offloads SELECT Queries</text>
  </g>

  <!-- BOTTOM CARD 2: Primary Instance -->
  <g transform="translate(300, 220)">
    <rect width="200" height="125" rx="10" fill="#ffffff" stroke="#ff6a00" stroke-width="2" filter="url(#proxy-shadow)"/>
    <!-- RDS Icon Cluster (Orange) -->
    <g transform="translate(100, 22)">
      <polygon points="12,0 19,4 19,13 12,17 5,13 5,4" fill="#ff6a00"/>
      <polygon points="5,13 12,17 12,26 5,30 -2,26 -2,17" fill="#ff6a00"/>
      <polygon points="19,13 26,17 26,26 19,30 12,26 12,17" fill="#ff6a00"/>
    </g>
    <text x="100" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Primary Instance</text>
    <rect x="20" y="80" width="160" height="26" rx="5" fill="#fff7ed"/>
    <text x="100" y="97" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#c2410c">Writes &amp; In-Flight Reads</text>
  </g>
</svg>