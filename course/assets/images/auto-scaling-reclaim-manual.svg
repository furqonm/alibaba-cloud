<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 378" width="100%" height="100%">
  <defs>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- BEFORE Box -->
  <g transform="translate(4, 4)" filter="url(#box-shadow)">
    <rect width="280" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="12" y="8" width="60" height="18" rx="4" fill="#0f172a"/>
    <text x="42" y="21" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">BEFORE</text>

    <!-- SLB Mini Badge -->
    <g transform="translate(190, 8)">
      <circle cx="12" cy="9" r="8" fill="#ff6a00"/>
      <text x="26" y="13" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#ea580c">SLB Attached</text>
    </g>

    <!-- Scaling Group Container -->
    <rect x="12" y="32" width="256" height="116" rx="6" fill="#ffffff" stroke="#ff6a00" stroke-width="1.5"/>
    <text x="24" y="47" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#ea580c">Scaling Group</text>

    <!-- ECS Instance 1 -->
    <g transform="translate(24, 55)">
      <rect width="105" height="82" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="15" y="12" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="16" r="1.5" fill="#ffffff"/>
      <rect x="15" y="24" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="28" r="1.5" fill="#ffffff"/>
      <text x="52" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Manual VM-1</text>
      <circle cx="28" cy="64" r="3.5" fill="#16a34a"/>
      <text x="36" y="67" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#15803d">Running</text>
    </g>

    <!-- ECS Instance 2 -->
    <g transform="translate(150, 55)">
      <rect width="105" height="82" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="15" y="12" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="16" r="1.5" fill="#ffffff"/>
      <rect x="15" y="24" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="28" r="1.5" fill="#ffffff"/>
      <text x="52" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Manual VM-2</text>
      <circle cx="28" cy="64" r="3.5" fill="#16a34a"/>
      <text x="36" y="67" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#15803d">Running</text>
    </g>
  </g>

  <!-- Downward Arrow Transition -->
  <line x1="144" y1="164" x2="144" y2="203" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <polygon points="136,200 152,200 144,212" fill="#16a34a"/>
  <rect x="92" y="174" width="104" height="18" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="144" y="186" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Remove from Group</text>

  <!-- AFTER Box -->
  <g transform="translate(4, 214)" filter="url(#box-shadow)">
    <rect width="280" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="12" y="8" width="55" height="18" rx="4" fill="#16a34a"/>
    <text x="39" y="21" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">AFTER</text>

    <!-- SLB Mini Detached Badge -->
    <g transform="translate(190, 8)">
      <circle cx="12" cy="9" r="8" fill="#94a3b8"/>
      <text x="26" y="13" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#64748b">SLB Detached</text>
    </g>

    <!-- Detached VMs (Still Running, Standalone outside group) -->
    <!-- ECS Instance 1 (Preserved & Running) -->
    <g transform="translate(24, 38)">
      <rect width="105" height="106" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <rect x="15" y="14" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="18" r="1.5" fill="#ffffff"/>
      <rect x="15" y="26" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="30" r="1.5" fill="#ffffff"/>
      <text x="52" y="52" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Manual VM-1</text>
      <circle cx="22" cy="72" r="3.5" fill="#16a34a"/>
      <text x="30" y="75" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#15803d">Still Running</text>
      <rect x="10" y="85" width="85" height="14" rx="3" fill="#dcfce7"/>
      <text x="52" y="95" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">Preserved (Not Stopped)</text>
    </g>

    <!-- ECS Instance 2 (Preserved & Running) -->
    <g transform="translate(150, 38)">
      <rect width="105" height="106" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <rect x="15" y="14" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="18" r="1.5" fill="#ffffff"/>
      <rect x="15" y="26" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="30" r="1.5" fill="#ffffff"/>
      <text x="52" y="52" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Manual VM-2</text>
      <circle cx="22" cy="72" r="3.5" fill="#16a34a"/>
      <text x="30" y="75" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#15803d">Still Running</text>
      <rect x="10" y="85" width="85" height="14" rx="3" fill="#dcfce7"/>
      <text x="52" y="95" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">Preserved (Not Stopped)</text>
    </g>
  </g>
</svg>
