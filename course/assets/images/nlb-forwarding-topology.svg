      <text x="15" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13">🔒</text>
      <text x="40" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">TCPSSL Port 1883</text>
    </g>
  </g>

