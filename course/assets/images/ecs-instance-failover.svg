<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" width="100%" height="auto">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="fo-arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff6a00"/>
    </marker>
    <marker id="fo-arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="fo-arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Card shadow -->
    <filter id="fo-shadow" x="-4%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Transparent Canvas Background -->
  <rect width="540" height="450" fill="none"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    
    <!-- ==================== OUTER REGION BOUNDARY ==================== -->
    <rect x="12" y="16" width="516" height="420" rx="12" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6,4"/>
    
    <!-- Region Title Badge -->
    <rect x="28" y="6" width="245" height="24" rx="4" fill="#0284c7"/>
    <text x="150" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">Jakarta Region (ap-southeast-5)</text>

    <!-- ==================== ZONE A (LEFT) ==================== -->
    <g transform="translate(24, 44)">
      <!-- Zone A Boundary -->
      <rect x="0" y="0" width="370" height="376" rx="10" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="12" y="-10" width="75" height="20" rx="4" fill="#38bdf8"/>
      <text x="49.5" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">Zone A</text>

      <!-- Host 1: NC1 -->
      <g transform="translate(18, 26)" filter="url(#fo-shadow)">
        <rect x="0" y="0" width="146" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <!-- Header -->
        <rect x="0" y="0" width="146" height="28" rx="8" fill="#e2e8f0"/>
        <rect x="0" y="14" width="146" height="14" fill="#e2e8f0"/>
        <text x="73" y="19" text-anchor="middle" font-size="12" font-weight="800" fill="#334155">NC1</text>
        
        <!-- Instance i-001 (Failed) -->
        <rect x="15" y="42" width="116" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="73" y="74" text-anchor="middle" font-size="14" font-weight="800" fill="#64748b">i-001</text>

        <!-- Host Failure Symbol -->
        <g transform="translate(73, 140)">
          <circle cx="0" cy="0" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
          <line x1="-6" y1="-6" x2="6" y2="6" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
          <line x1="6" y1="-6" x2="-6" y2="6" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Failover Arrow from NC1 to NC2: i-001 -> i-001 -->
      <path d="M 167 95 L 202 95" stroke="#ff6a00" stroke-width="2.8" marker-end="url(#fo-arrow-orange)"/>

      <!-- Host 2: NC2 -->
      <g transform="translate(206, 26)" filter="url(#fo-shadow)">
        <rect x="0" y="0" width="146" height="180" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
        <!-- Header -->
        <rect x="0" y="0" width="146" height="28" rx="8" fill="#d1fae5"/>
        <rect x="0" y="14" width="146" height="14" fill="#d1fae5"/>
        <text x="73" y="19" text-anchor="middle" font-size="12" font-weight="800" fill="#065f46">NC2</text>
        
        <!-- Instance i-001 (Active) -->
        <rect x="15" y="42" width="116" height="54" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
        <text x="73" y="74" text-anchor="middle" font-size="14" font-weight="800" fill="#047857">i-001</text>

        <!-- Healthy Checkmark -->
        <g transform="translate(73, 140)">
          <circle cx="0" cy="0" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
          <path d="M -5 0 L -1 4 L 6 -4" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Storage Layer: Cloud Disks -->
      <g transform="translate(18, 238)" filter="url(#fo-shadow)">
        <rect x="0" y="0" width="334" height="114" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
        
        <!-- Disk Cylinders -->
        <!-- Disk 1 -->
        <g transform="translate(42, 22)">
          <rect x="0" y="6" width="105" height="38" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
          <ellipse cx="52.5" cy="6" rx="52.5" ry="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
          <text x="52.5" y="30" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0369a1">System Disk</text>
        </g>

        <!-- Disk 2 -->
        <g transform="translate(187, 22)">
          <rect x="0" y="6" width="105" height="38" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
          <ellipse cx="52.5" cy="6" rx="52.5" ry="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
          <text x="52.5" y="30" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0369a1">Data Disk</text>
        </g>

        <text x="167" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">Cloud Disks</text>
      </g>

      <!-- Connection Lines from Disks to NC1 and NC2 -->
      <!-- Line to NC1 (Dashed / Disconnected) -->
      <line x1="91" y1="238" x2="91" y2="206" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
      <!-- Line to NC2 (Solid Green / Reconnected) -->
      <line x1="279" y1="238" x2="279" y2="206" stroke="#059669" stroke-width="2.5"/>
    </g>

    <!-- ==================== ZONE B (RIGHT) ==================== -->
    <g transform="translate(408, 44)">
      <!-- Zone B Boundary -->
      <rect x="0" y="0" width="106" height="376" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
      <rect x="15" y="-10" width="76" height="20" rx="4" fill="#94a3b8"/>
      <text x="53" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">Zone B</text>

      <!-- Node Controllers Placeholder / Server Rack Box in Zone B -->
      <g transform="translate(15, 68)" filter="url(#fo-shadow)">
        <rect x="0" y="0" width="76" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        <text x="38" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#94a3b8">NC</text>
      </g>
    </g>

  </g>
</svg>
