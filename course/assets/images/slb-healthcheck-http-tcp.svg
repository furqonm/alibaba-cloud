<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="620" height="540" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== TOP SECTION: HTTP / HTTPS HEALTH CHECK ==================== -->
  <g transform="translate(15, 15)">
    <rect width="590" height="235" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- SLB Node (Top Left) -->
    <g transform="translate(45, 20)" filter="url(#shadow)">
      <rect width="110" height="65" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <rect x="0" y="0" width="110" height="22" rx="8" fill="#0284c7"/>
      <rect x="0" y="14" width="110" height="8" fill="#0284c7"/>
      <text x="55" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SLB</text>
      <g transform="translate(40.38, 29.78) scale(0.8125)"><line x1="18.0" y1="8.5" x2="8.2" y2="24.8" stroke="#FF6A00" stroke-width="2.6" stroke-linecap="round"/><line x1="18.0" y1="8.5" x2="27.8" y2="24.8" stroke="#FF6A00" stroke-width="2.6" stroke-linecap="round"/><line x1="8.2" y1="24.8" x2="27.8" y2="24.8" stroke="#FF6A00" stroke-width="2.6" stroke-linecap="round"/><circle cx="18.0" cy="8.5" r="5.6" fill="#FF6A00"/><circle cx="8.2" cy="24.8" r="5.6" fill="#FF6A00"/><circle cx="27.8" cy="24.8" r="5.6" fill="#FF6A00"/></g>
    </g>

    <!-- Backend ECS Node (Top Right) -->
    <g transform="translate(435, 20)" filter="url(#shadow)">
      <rect width="110" height="65" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      <rect x="0" y="0" width="110" height="22" rx="8" fill="#059669"/>
      <rect x="0" y="14" width="110" height="8" fill="#059669"/>
      <text x="55" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ECS</text>
      <g transform="translate(37.40, 26.43) scale(0.03365)"><path d="M864.768 903.68H180.736c-40.96 0-73.728-29.696-73.728-70.656v-81.92c0-40.96 33.28-70.656 73.728-70.656h684.032c40.96 0 74.24 29.696 74.24 70.656v81.92c-0.512 40.96-33.28 70.656-74.24 70.656z m-82.944-165.376c-29.696 0-53.76 24.064-53.76 53.248 0 29.696 24.064 53.76 53.76 53.76 29.696-1.024 52.736-25.6 52.224-54.784-1.024-28.16-23.552-51.2-52.224-52.224z m82.944-111.104H180.736c-40.96 0-73.728-29.696-73.728-70.656v-81.92c0-40.96 33.28-70.656 73.728-70.656h684.032c40.96 0 74.24 29.696 74.24 70.656v81.92c-0.512 40.96-33.28 70.656-74.24 70.656z m-82.944-164.864c-29.696 0-53.76 24.064-53.76 53.76s24.064 53.248 53.76 53.76c29.696 0 53.76-23.552 53.76-53.248 0.512-30.208-23.552-54.272-53.76-54.272 0.512 0 0.512 0 0 0z m82.944-111.104H180.736c-40.96 0-73.728-29.696-73.728-70.656v-81.92c0-40.96 33.28-70.656 73.728-70.656h684.032c40.96 0 74.24 29.696 74.24 70.656v81.92c-0.512 40.96-33.28 70.656-74.24 70.656z m-82.944-165.376c-29.696 0-53.76 24.064-53.76 53.76s24.064 53.248 53.76 53.248c29.184 0 53.248-24.064 53.248-53.248 0.512-29.696-23.552-53.76-53.248-53.76z" fill="#FF6A00"/></g>
    </g>

    <!-- Lifelines -->
    <line x1="100" y1="85" x2="100" y2="215" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="490" y1="85" x2="490" y2="215" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Step 1: HTTP HEAD Request -->
    <g transform="translate(0, 115)">
      <line x1="100" y1="0" x2="480" y2="0" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
      <rect x="220" y="-14" width="150" height="24" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
      <circle cx="234" cy="-2" r="7" fill="#ea580c"/>
      <text x="234" y="1" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">1</text>
      <text x="250" y="2" fill="#9a3412" font-family="monospace" font-size="10.5" font-weight="700">HTTP HEAD /uri</text>
    </g>

    <!-- Step 2: HTTP 2xx/3xx Status -->
    <g transform="translate(0, 165)">
      <line x1="490" y1="0" x2="110" y2="0" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
      <rect x="210" y="-14" width="170" height="24" rx="4" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
      <circle cx="224" cy="-2" r="7" fill="#059669"/>
      <text x="224" y="1" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">2</text>
      <text x="240" y="2" fill="#166534" font-family="monospace" font-size="10.5" font-weight="700">HTTP 2xx / 3xx OK</text>
    </g>

    <!-- Healthy Status Badge -->
    <g transform="translate(235, 195)">
      <rect width="120" height="26" rx="13" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
      <circle cx="16" cy="13" r="6.5" fill="#10b981"/>
      <path d="M 13 13 L 15 15 L 19 11" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="65" y="17" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">HEALTHY</text>
    </g>
  </g>

  <!-- Horizontal Divider -->
  <line x1="30" y1="262" x2="590" y2="262" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ==================== BOTTOM SECTION: TCP HEALTH CHECK ==================== -->
  <g transform="translate(15, 275)">
    <rect width="590" height="250" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- SLB Node (Bottom Left) -->
    <g transform="translate(45, 15)" filter="url(#shadow)">
      <rect width="110" height="50" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <rect x="0" y="0" width="110" height="18" rx="6" fill="#0284c7"/>
      <rect x="0" y="12" width="110" height="6" fill="#0284c7"/>
      <text x="55" y="13" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SLB</text>
      <g transform="translate(43.19, 22.52) scale(0.6562)"><line x1="18.0" y1="8.5" x2="8.2" y2="24.8" stroke="#FF6A00" stroke-width="2.6" stroke-linecap="round"/><line x1="18.0" y1="8.5" x2="27.8" y2="24.8" stroke="#FF6A00" stroke-width="2.6" stroke-linecap="round"/><line x1="8.2" y1="24.8" x2="27.8" y2="24.8" stroke="#FF6A00" stroke-width="2.6" stroke-linecap="round"/><circle cx="18.0" cy="8.5" r="5.6" fill="#FF6A00"/><circle cx="8.2" cy="24.8" r="5.6" fill="#FF6A00"/><circle cx="27.8" cy="24.8" r="5.6" fill="#FF6A00"/></g>
    </g>

    <!-- Backend ECS Node (Bottom Right) -->
    <g transform="translate(435, 15)" filter="url(#shadow)">
      <rect width="110" height="50" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      <rect x="0" y="0" width="110" height="18" rx="6" fill="#059669"/>
      <rect x="0" y="12" width="110" height="6" fill="#059669"/>
      <text x="55" y="13" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ECS</text>
      <g transform="translate(40.54, 19.57) scale(0.02764)"><path d="M864.768 903.68H180.736c-40.96 0-73.728-29.696-73.728-70.656v-81.92c0-40.96 33.28-70.656 73.728-70.656h684.032c40.96 0 74.24 29.696 74.24 70.656v81.92c-0.512 40.96-33.28 70.656-74.24 70.656z m-82.944-165.376c-29.696 0-53.76 24.064-53.76 53.248 0 29.696 24.064 53.76 53.76 53.76 29.696-1.024 52.736-25.6 52.224-54.784-1.024-28.16-23.552-51.2-52.224-52.224z m82.944-111.104H180.736c-40.96 0-73.728-29.696-73.728-70.656v-81.92c0-40.96 33.28-70.656 73.728-70.656h684.032c40.96 0 74.24 29.696 74.24 70.656v81.92c-0.512 40.96-33.28 70.656-74.24 70.656z m-82.944-164.864c-29.696 0-53.76 24.064-53.76 53.76s24.064 53.248 53.76 53.76c29.696 0 53.76-23.552 53.76-53.248 0.512-30.208-23.552-54.272-53.76-54.272 0.512 0 0.512 0 0 0z m82.944-111.104H180.736c-40.96 0-73.728-29.696-73.728-70.656v-81.92c0-40.96 33.28-70.656 73.728-70.656h684.032c40.96 0 74.24 29.696 74.24 70.656v81.92c-0.512 40.96-33.28 70.656-74.24 70.656z m-82.944-165.376c-29.696 0-53.76 24.064-53.76 53.76s24.064 53.248 53.76 53.248c29.184 0 53.248-24.064 53.248-53.248 0.512-29.696-23.552-53.76-53.248-53.76z" fill="#FF6A00"/></g>
    </g>

    <!-- Lifelines -->
    <line x1="100" y1="65" x2="100" y2="235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="490" y1="65" x2="490" y2="235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- State Labels Top -->
    <g transform="translate(65, 75)">
      <rect width="70" height="16" rx="3" fill="#0284c7"/>
      <text x="35" y="12" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" font-weight="700">SYN_SENT</text>
    </g>
    <g transform="translate(455, 75)">
      <rect width="70" height="16" rx="3" fill="#059669"/>
      <text x="35" y="12" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" font-weight="700">LISTEN</text>
    </g>

    <!-- Packet 1: SYN -->
    <g transform="translate(0, 105)">
      <line x1="100" y1="0" x2="480" y2="15" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
      <rect x="260" y="-4" width="70" height="20" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
      <circle cx="270" cy="6" r="6" fill="#0284c7"/>
      <text x="270" y="9" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700">1</text>
      <text x="282" y="10" fill="#0369a1" font-family="monospace" font-size="9" font-weight="700">SYN</text>
    </g>

    <!-- Packet 2: SYN + ACK -->
    <g transform="translate(0, 140)">
      <line x1="490" y1="0" x2="110" y2="15" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
      <rect x="245" y="-4" width="100" height="20" rx="4" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
      <circle cx="256" cy="6" r="6" fill="#059669"/>
      <text x="256" y="9" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700">2</text>
      <text x="270" y="10" fill="#166534" font-family="monospace" font-size="9" font-weight="700">SYN + ACK</text>
    </g>

    <!-- Packet 3: ACK -->
    <g transform="translate(0, 175)">
      <line x1="100" y1="0" x2="480" y2="15" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
      <rect x="260" y="-4" width="70" height="20" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
      <circle cx="270" cy="6" r="6" fill="#0284c7"/>
      <text x="270" y="9" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700">3</text>
      <text x="282" y="10" fill="#0369a1" font-family="monospace" font-size="9" font-weight="700">ACK</text>
    </g>

    <!-- Packet 4: RST -->
    <g transform="translate(0, 205)">
      <line x1="100" y1="0" x2="480" y2="15" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
      <rect x="240" y="-4" width="110" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <circle cx="251" cy="6" r="6" fill="#dc2626"/>
      <text x="251" y="9" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700">4</text>
      <text x="265" y="10" fill="#991b1b" font-family="monospace" font-size="9" font-weight="700">RST (Reset)</text>
    </g>

    <!-- State Labels Bottom -->
    <g transform="translate(65, 222)">
      <rect width="70" height="16" rx="3" fill="#64748b"/>
      <text x="35" y="12" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" font-weight="700">CLOSED</text>
    </g>
    <g transform="translate(455, 222)">
      <rect width="70" height="16" rx="3" fill="#64748b"/>
      <text x="35" y="12" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" font-weight="700">CLOSED</text>
    </g>
  </g>
</svg>