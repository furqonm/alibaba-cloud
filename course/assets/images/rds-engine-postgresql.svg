<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 48" width="100%" height="100%">
  <defs>
    <style>
      .pg-halo {
        paint-order: stroke fill;
        stroke: #ffffff;
        stroke-width: 3.5px;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .pg-icon-halo {
        paint-order: stroke fill;
        stroke: #ffffff;
        stroke-width: 2px;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Elephant Mascot (Slonik) -->
  <g transform="translate(6, 4) scale(0.8)">
    <!-- Ears & Head Shape -->
    <path class="pg-icon-halo" d="M 8 18 C 3 10, 8 2, 18 2 C 22 2, 26 4, 28 8 C 30 4, 34 2, 38 2 C 48 2, 53 10, 48 18 C 45 23, 40 26, 36 28 C 36 34, 34 40, 31 46 C 30 48, 27 48, 26 45 C 24 38, 24 30, 24 28 C 18 26, 12 23, 8 18 Z" fill="#336791"/>
    <!-- Inner Ear Highlights -->
    <path d="M 12 16 C 9 11, 12 6, 17 5 C 15 10, 16 14, 18 17 C 15 17, 13 17, 12 16 Z" fill="#ffffff" opacity="0.4"/>
    <path d="M 44 16 C 47 11, 44 6, 39 5 C 41 10, 40 14, 38 17 C 41 17, 43 17, 44 16 Z" fill="#ffffff" opacity="0.4"/>
    <!-- Tusks -->
    <path class="pg-icon-halo" d="M 22 30 C 18 32, 14 36, 12 40 C 14 40, 19 37, 23 33 Z" fill="#ffffff"/>
    <path class="pg-icon-halo" d="M 34 30 C 38 32, 42 36, 44 40 C 42 40, 37 37, 33 33 Z" fill="#ffffff"/>
    <!-- Eyes -->
    <circle cx="21" cy="17" r="2" fill="#ffffff"/>
    <circle cx="35" cy="17" r="2" fill="#ffffff"/>
    <circle cx="21.5" cy="17" r="1" fill="#0f172a"/>
    <circle cx="34.5" cy="17" r="1" fill="#0f172a"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(56, 32)">
    <text class="pg-halo" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800">
      <tspan fill="#336791">Postgre</tspan><tspan fill="#0284c7">SQL</tspan>
    </text>
  </g>
</svg>