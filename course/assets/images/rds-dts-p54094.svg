<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 370" width="100%" height="100%">
  <defs>
    <filter id="etl-shadow" x="-5%" y="-4%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="etl-arr-orange" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="etl-arr-green" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <!-- TOP ECS APPLICATION NODE -->
  <g transform="translate(70, 25)">
    <rect width="200" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#etl-shadow)"/>
    <g transform="translate(18, 15)">
      <rect x="0" y="0" width="26" height="6.5" rx="1.5" fill="#ff6a00"/>
      <circle cx="21" cy="3.25" r="1.2" fill="#ffffff"/>
      <rect x="0" y="9.5" width="26" height="6.5" rx="1.5" fill="#ff6a00"/>
      <circle cx="21" cy="12.75" r="1.2" fill="#ffffff"/>
      <rect x="0" y="19" width="26" height="6.5" rx="1.5" fill="#ff6a00"/>
      <circle cx="21" cy="22.25" r="1.2" fill="#ffffff"/>
    </g>
    <text x="116" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#0f172a">ECS Application</text>
    <text x="116" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">Transactional Workloads</text>
  </g>

  <!-- Vertical Connector: ECS -> RDS -->
  <path d="M 170 83 L 170 185" stroke="#ea580c" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#etl-arr-orange)"/>
  <!-- Badge ECS -> RDS -->
  <rect x="95" y="120" width="150" height="24" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1" filter="url(#etl-shadow)"/>
  <text x="170" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#c2410c">Application Data (OLTP)</text>

  <!-- APSARADB FOR RDS (OLTP Master) -->
  <g transform="translate(60, 190)">
    <rect width="220" height="92" rx="10" fill="#ffffff" stroke="#ff6a00" stroke-width="2" filter="url(#etl-shadow)"/>
    <g transform="translate(18, 16)">
      <polygon points="10,0 16,3.5 16,10 10,13.5 4,10 4,3.5" fill="#ff6a00"/>
      <polygon points="4,10 10,13.5 10,20 4,23.5 -2,20 -2,13.5" fill="#ff6a00"/>
      <polygon points="16,10 22,13.5 22,20 16,23.5 10,20 10,13.5" fill="#ff6a00"/>
    </g>
    <text x="122" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">ApsaraDB for RDS</text>
    <text x="122" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#ea580c">OLTP Master (Row Store)</text>

    <rect x="20" y="56" width="180" height="24" rx="4" fill="#fff7ed"/>
    <text x="110" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#c2410c">High-Concurrency Writes</text>
  </g>

  <!-- Horizontal Connector 1: RDS -> DTS (Spaced out properly) -->
  <path d="M 280 236 L 430 236" stroke="#10b981" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#etl-arr-green)"/>
  <!-- Badge: Change Data Capture (Centered at 355) -->
  <rect x="295" y="205" width="120" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" filter="url(#etl-shadow)"/>
  <text x="355" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#047857">Change Data Capture</text>

  <!-- DATA TRANSMISSION SERVICE (DTS) -->
  <g transform="translate(435, 190)">
    <rect width="210" height="92" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#etl-shadow)"/>
    <g transform="translate(90, 14)">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="#ff6a00"/>
      <path d="M 8 15 L 15 8 L 15 12 L 22 12 L 22 18 L 15 18 L 15 22 Z" fill="#ffffff"/>
    </g>
    <text x="105" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#065f46">Data Transmission</text>
    <text x="105" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#047857">Service (DTS)</text>
    <text x="105" y="83" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748b">Zero-ETL Sub-Second CDC</text>
  </g>

  <!-- Horizontal Connector 2: DTS -> AnalyticDB (Spaced out properly) -->
  <path d="M 645 236 L 765 236" stroke="#10b981" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#etl-arr-green)"/>
  <!-- Badge: Data Applier (Centered at 705) -->
  <rect x="660" y="205" width="90" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" filter="url(#etl-shadow)"/>
  <text x="705" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#047857">Data Applier</text>

  <!-- ANALYTICDB (OLAP Engine) -->
  <g transform="translate(770, 190)">
    <rect width="210" height="92" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#etl-shadow)"/>
    <g transform="translate(18, 16)">
      <polygon points="14,0 28,14 14,28 0,14" fill="#0284c7"/>
      <polygon points="14,6 22,14 14,22 6,14" fill="#ffffff"/>
    </g>
    <text x="122" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">AnalyticDB</text>
    <text x="122" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#0284c7">OLAP Engine (Column Store)</text>

    <rect x="20" y="56" width="170" height="24" rx="4" fill="#f0f9ff"/>
    <text x="105" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Complex Real-Time BI &amp; SQL</text>
  </g>
</svg>