        <rect x="785" y="300" width="115" height="85" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" />
        <!-- Model Studio Layers Icon -->
        <g transform="translate(827, 312)">
          <polygon points="16,2 30,8 16,14 2,8" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1.5" />
          <polygon points="16,8 30,14 16,20 2,14" fill="#A78BFA" stroke="#6D28D9" stroke-width="1.5" />
          <polygon points="16,14 30,20 16,26 2,20" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5" />
        </g>
        <text x="842" y="352" font-size="11.5" font-weight="800" fill="#6D28D9" text-anchor="middle">Model Studio</text>
        <text x="842" y="368" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">LLM &amp; GenAI</text>
      </g>
    </g>
  </g>
