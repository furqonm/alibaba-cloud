<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="auto">
  <defs>
    <filter id="shadow-spa" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-card-sm" x="-4%" y="-5%" width="108%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <linearGradient id="grad-arrow-link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Top Region Pill -->
    <g filter="url(#shadow-card-sm)">
      <rect x="30" y="16" width="160" height="32" rx="16" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
      <!-- Location / Pin Icon -->
      <path d="M 45 28 C 45 23.58 48.58 20 53 20 C 57.42 20 61 23.58 61 28 C 61 33.5 53 41 53 41 C 53 41 45 33.5 45 28 Z M 53 30.5 C 54.38 30.5 55.5 29.38 55.5 28 C 55.5 26.62 54.38 25.5 53 25.5 C 51.62 25.5 50.5 26.62 50.5 28 C 50.5 29.38 51.62 30.5 53 30.5 Z" fill="#0284C7" />
      <text x="68" y="37" font-size="12" font-weight="700" fill="#0369A1">Region: Jakarta</text>
    </g>

    <!-- ==================== LEFT: CONSUMER VPC ==================== -->
    <g filter="url(#shadow-spa)">
      <!-- VPC Container Outer Box -->
      <rect x="30" y="60" width="430" height="370" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
      <!-- VPC Header Banner -->
      <rect x="30" y="60" width="430" height="42" rx="12" fill="#F0F9FF" />
      <rect x="30" y="90" width="430" height="12" fill="#F0F9FF" />
      
      <!-- VPC Cloud Icon -->
      <path d="M 50 82 C 48.5 82 47.1 82.6 46.2 83.6 C 45.3 84.6 44.8 86 45 87.5 C 43.2 88.2 42 90 42 92 C 42 94.8 44.2 97 47 97 L 61 97 C 63.8 97 66 94.8 66 92 C 66 89.6 64.3 87.6 62.1 87.1 C 61.6 84.2 59.1 82 56 82 C 55.5 82 55 82.1 54.5 82.2 C 53.6 83.3 51.9 82 50 82 Z" fill="#0284C7" />
      <text x="75" y="87" font-size="14" font-weight="800" fill="#0369A1">Consumer VPC</text>
      <text x="380" y="86" font-size="11" font-weight="600" fill="#0284C7" text-anchor="end">10.0.0.0/16</text>

      <!-- ZONE G ROW -->
      <rect x="45" y="115" width="400" height="135" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="45" y="115" width="80" height="24" rx="6" fill="#E2E8F0" />
      <text x="85" y="131" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Zone G</text>

      <!-- vSwitch G Card -->
      <g filter="url(#shadow-card-sm)">
        <rect x="60" y="150" width="150" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <!-- vSwitch Dual-Arrow Icon -->
        <g transform="translate(75, 162)">
          <path d="M 0 10 L 18 10 M 14 6 L 18 10 L 14 14" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M 18 20 L 0 20 M 4 16 L 0 20 L 4 24" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </g>
        <text x="110" y="178" font-size="12" font-weight="700" fill="#0F172A">vSwitch</text>
        <text x="75" y="202" font-size="10" font-family="'Consolas', monospace" font-weight="600" fill="#64748B">10.0.1.0/24</text>
        <text x="75" y="218" font-size="9.5" font-weight="500" fill="#059669">✔ Subnet Route</text>
      </g>

      <!-- Connection Line between vSwitch and ENI in Zone G -->
      <line x1="210" y1="192" x2="250" y2="192" stroke="#0284C7" stroke-width="2" stroke-dasharray="3 3" />

      <!-- ENI G Card -->
      <g filter="url(#shadow-card-sm)">
        <rect x="250" y="150" width="175" height="85" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
        <!-- ENI Card Icon -->
        <g transform="translate(265, 162)">
          <rect x="0" y="0" width="24" height="18" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
          <line x1="4" y1="18" x2="4" y2="22" stroke="#2563EB" stroke-width="1.5" />
          <line x1="8" y1="18" x2="8" y2="22" stroke="#2563EB" stroke-width="1.5" />
          <line x1="12" y1="18" x2="12" y2="22" stroke="#2563EB" stroke-width="1.5" />
          <line x1="16" y1="18" x2="16" y2="22" stroke="#2563EB" stroke-width="1.5" />
          <circle cx="12" cy="9" r="3" fill="#2563EB" />
        </g>
        <text x="300" y="178" font-size="12" font-weight="700" fill="#1D4ED8">ENI (Interface)</text>
        <text x="265" y="202" font-size="10" font-family="'Consolas', monospace" font-weight="600" fill="#475569">10.0.1.55 (Private)</text>
        <text x="265" y="218" font-size="9.5" font-weight="600" fill="#1E40AF">Security Group Bound</text>
      </g>

      <!-- ZONE H ROW -->
      <rect x="45" y="265" width="400" height="135" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="45" y="265" width="80" height="24" rx="6" fill="#E2E8F0" />
      <text x="85" y="281" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Zone H</text>

      <!-- vSwitch H Card -->
      <g filter="url(#shadow-card-sm)">
        <rect x="60" y="300" width="150" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <!-- vSwitch Dual-Arrow Icon -->
        <g transform="translate(75, 312)">
          <path d="M 0 10 L 18 10 M 14 6 L 18 10 L 14 14" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M 18 20 L 0 20 M 4 16 L 0 20 L 4 24" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </g>
        <text x="110" y="328" font-size="12" font-weight="700" fill="#0F172A">vSwitch</text>
        <text x="75" y="352" font-size="10" font-family="'Consolas', monospace" font-weight="600" fill="#64748B">10.0.2.0/24</text>
        <text x="75" y="368" font-size="9.5" font-weight="500" fill="#059669">✔ Subnet Route</text>
      </g>

      <!-- Connection Line between vSwitch and ENI in Zone H -->
      <line x1="210" y1="342" x2="250" y2="342" stroke="#0284C7" stroke-width="2" stroke-dasharray="3 3" />

      <!-- ENI H Card -->
      <g filter="url(#shadow-card-sm)">
        <rect x="250" y="300" width="175" height="85" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
        <!-- ENI Card Icon -->
        <g transform="translate(265, 312)">
          <rect x="0" y="0" width="24" height="18" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
          <line x1="4" y1="18" x2="4" y2="22" stroke="#2563EB" stroke-width="1.5" />
          <line x1="8" y1="18" x2="8" y2="22" stroke="#2563EB" stroke-width="1.5" />
          <line x1="12" y1="18" x2="12" y2="22" stroke="#2563EB" stroke-width="1.5" />
          <line x1="16" y1="18" x2="16" y2="22" stroke="#2563EB" stroke-width="1.5" />
          <circle cx="12" cy="9" r="3" fill="#2563EB" />
        </g>
        <text x="300" y="328" font-size="12" font-weight="700" fill="#1D4ED8">ENI (Interface)</text>
        <text x="265" y="352" font-size="10" font-family="'Consolas', monospace" font-weight="600" fill="#475569">10.0.2.89 (Private)</text>
        <text x="265" y="368" font-size="9.5" font-weight="600" fill="#1E40AF">Security Group Bound</text>
      </g>

      <!-- Overarching Interface Endpoint Boundary -->
      <rect x="242" y="140" width="192" height="255" rx="10" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="5 4" />
      <!-- Shield Badge for Interface Endpoint -->
      <g filter="url(#shadow-card-sm)">
        <rect x="265" y="130" width="145" height="22" rx="11" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" />
        <!-- Shield Icon -->
        <path d="M 276 135 L 282 133 L 288 135 L 288 141 C 288 145 282 148 282 148 C 282 148 276 145 276 141 Z" fill="#16A34A" />
        <text x="294" y="145" font-size="10.5" font-weight="800" fill="#15803D">Interface Endpoint</text>
      </g>
    </g>

    <!-- ==================== CENTER: PRIVATE TUNNEL ==================== -->
    <g>
      <!-- Big Connecting Directional Arrow -->
      <path d="M 435 235 L 535 235" stroke="url(#grad-arrow-link)" stroke-width="8" stroke-linecap="round" />
      <!-- Arrow Head -->
      <polygon points="530,225 550,235 530,245" fill="#FF6A00" />
      
      <!-- Connection Pill Header -->
      <g filter="url(#shadow-card-sm)">
        <rect x="420" y="185" width="145" height="34" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
        <text x="492" y="201" font-size="11" font-weight="800" fill="#0369A1" text-anchor="middle">Endpoint Connection</text>
        <text x="492" y="213" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">PrivateLink Backbone</text>
      </g>

      <text x="492" y="260" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">✔ Zero Public Transit</text>
    </g>

    <!-- ==================== RIGHT: ALIBABA CLOUD SERVICES ==================== -->
    <g filter="url(#shadow-spa)">
      <!-- Target Cloud Box -->
      <rect x="555" y="60" width="375" height="370" rx="12" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2" />
      <!-- Target Cloud Banner -->
      <rect x="555" y="60" width="375" height="42" rx="12" fill="#FFF7ED" />
      <rect x="555" y="90" width="375" height="12" fill="#FFF7ED" />

      <!-- Cloud Icon -->
      <path d="M 575 82 C 573.5 82 572.1 82.6 571.2 83.6 C 570.3 84.6 569.8 86 570 87.5 C 568.2 88.2 567 90 567 92 C 567 94.8 569.2 97 572 97 L 586 97 C 588.8 97 591 94.8 591 92 C 591 89.6 589.3 87.6 587.1 87.1 C 586.6 84.2 584.1 82 581 82 C 580.5 82 580 82.1 579.5 82.2 C 578.6 83.3 576.9 82 575 82 Z" fill="#FF6A00" />
      <text x="600" y="87" font-size="14" font-weight="800" fill="#C2410C">Alibaba Cloud Services</text>

      <!-- Target Multi-Zone Grid: Zone G Tier -->
      <rect x="570" y="115" width="345" height="135" rx="8" fill="#FFFBF5" stroke="#FED7AA" stroke-width="1.5" />
      <rect x="570" y="115" width="80" height="24" rx="6" fill="#FED7AA" />
      <text x="610" y="131" font-size="11" font-weight="700" fill="#9A3412" text-anchor="middle">Zone G</text>

      <!-- Service Icons in Zone G -->
      <!-- 1. OSS Icon Card -->
      <g filter="url(#shadow-card-sm)">
        <rect x="585" y="150" width="90" height="85" rx="8" fill="#FFFFFF" stroke="#FF6A00" stroke-width="1.5" />
        <!-- Official OSS Icon -->
        <g transform="translate(615, 162) scale(0.75)">
          <path d="M 178 93 L 192 93 L 192 105 L 184.03 109.47 L 181.72 108.04 L 178 104 Z" fill="#FFFFFF" />
          <path d="M 189.64 82.46 C 183.01 82.46 177.46 87.03 175.96 93.18 C 175.82 93.17 175.68 93.17 175.55 93.17 C 170.73 93.17 166.83 97.08 166.83 101.89 C 166.83 104.21 167.75 106.42 169.39 108.05 C 171.02 109.69 173.24 110.6 175.55 110.6 C 177.86 110.6 180.08 109.68 181.72 108.04 C 183.09 106.66 183.85 104.83 184.07 102.8 L 180.91 102.56 C 180.2 102.47 179.97 101.92 180.4 101.35 L 185.76 94.73 C 186.19 94.15 186.78 94.23 187.06 94.89 L 190.09 102.3 C 190.37 102.97 190.01 103.44 189.3 103.35 L 186.94 103.13 C 186.69 105.59 185.58 107.76 184.03 109.47 C 185.8 110.24 187.71 110.64 189.64 110.63 C 197.42 110.63 203.72 104.32 203.72 96.55 C 203.72 88.77 197.42 82.47 189.64 82.47 Z" fill="#FF6A00" transform="translate(-164, -79)" />
        </g>
        <text x="630" y="202" font-size="12" font-weight="800" fill="#EA580C" text-anchor="middle">OSS</text>
        <text x="630" y="218" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">Object Storage</text>
      </g>

      <!-- 2. PAI Icon Card -->
      <g filter="url(#shadow-card-sm)">
        <rect x="685" y="150" width="90" height="85" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
        <!-- PAI Neural Node Icon -->
        <g transform="translate(715, 162)">
          <circle cx="8" cy="8" r="4" fill="#2563EB" />
          <circle cx="24" cy="8" r="4" fill="#2563EB" />
          <circle cx="16" cy="24" r="5" fill="#1D4ED8" />
          <line x1="8" y1="8" x2="16" y2="24" stroke="#2563EB" stroke-width="2" />
          <line x1="24" y1="8" x2="16" y2="24" stroke="#2563EB" stroke-width="2" />
          <line x1="8" y1="8" x2="24" y2="8" stroke="#93C5FD" stroke-width="1.5" />
        </g>
        <text x="730" y="202" font-size="12" font-weight="800" fill="#1D4ED8" text-anchor="middle">PAI</text>
        <text x="730" y="218" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">AI Platform</text>
      </g>

      <!-- 3. Model Studio Card -->
      <g filter="url(#shadow-card-sm)">
        <rect x="785" y="150" width="115" height="85" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" />
        <!-- Model Studio Layers Icon -->
        <g transform="translate(827, 162)">
          <polygon points="16,2 30,8 16,14 2,8" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1.5" />
          <polygon points="16,8 30,14 16,20 2,14" fill="#A78BFA" stroke="#6D28D9" stroke-width="1.5" />
          <polygon points="16,14 30,20 16,26 2,20" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5" />
        </g>
        <text x="842" y="202" font-size="11.5" font-weight="800" fill="#6D28D9" text-anchor="middle">Model Studio</text>
        <text x="842" y="218" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">LLM &amp; GenAI</text>
      </g>

      <!-- Target Multi-Zone Grid: Zone H Tier -->
      <rect x="570" y="265" width="345" height="135" rx="8" fill="#FFFBF5" stroke="#FED7AA" stroke-width="1.5" />
      <rect x="570" y="265" width="80" height="24" rx="6" fill="#FED7AA" />
      <text x="610" y="281" font-size="11" font-weight="700" fill="#9A3412" text-anchor="middle">Zone H</text>

      <!-- Service Icons in Zone H -->
      <!-- 1. OSS Icon Card -->
      <g filter="url(#shadow-card-sm)">
        <rect x="585" y="300" width="90" height="85" rx="8" fill="#FFFFFF" stroke="#FF6A00" stroke-width="1.5" />
        <!-- Official OSS Icon -->
        <g transform="translate(615, 312) scale(0.75)">
          <path d="M 178 93 L 192 93 L 192 105 L 184.03 109.47 L 181.72 108.04 L 178 104 Z" fill="#FFFFFF" />
          <path d="M 189.64 82.46 C 183.01 82.46 177.46 87.03 175.96 93.18 C 175.82 93.17 175.68 93.17 175.55 93.17 C 170.73 93.17 166.83 97.08 166.83 101.89 C 166.83 104.21 167.75 106.42 169.39 108.05 C 171.02 109.69 173.24 110.6 175.55 110.6 C 177.86 110.6 180.08 109.68 181.72 108.04 C 183.09 106.66 183.85 104.83 184.07 102.8 L 180.91 102.56 C 180.2 102.47 179.97 101.92 180.4 101.35 L 185.76 94.73 C 186.19 94.15 186.78 94.23 187.06 94.89 L 190.09 102.3 C 190.37 102.97 190.01 103.44 189.3 103.35 L 186.94 103.13 C 186.69 105.59 185.58 107.76 184.03 109.47 C 185.8 110.24 187.71 110.64 189.64 110.63 C 197.42 110.63 203.72 104.32 203.72 96.55 C 203.72 88.77 197.42 82.47 189.64 82.47 Z" fill="#FF6A00" transform="translate(-164, -79)" />
        </g>
        <text x="630" y="352" font-size="12" font-weight="800" fill="#EA580C" text-anchor="middle">OSS</text>
        <text x="630" y="368" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">Object Storage</text>
      </g>

      <!-- 2. PAI Icon Card -->
      <g filter="url(#shadow-card-sm)">
        <rect x="685" y="300" width="90" height="85" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
        <!-- PAI Neural Node Icon -->
        <g transform="translate(715, 312)">
          <circle cx="8" cy="8" r="4" fill="#2563EB" />
          <circle cx="24" cy="8" r="4" fill="#2563EB" />
          <circle cx="16" cy="24" r="5" fill="#1D4ED8" />
          <line x1="8" y1="8" x2="16" y2="24" stroke="#2563EB" stroke-width="2" />
          <line x1="24" y1="8" x2="16" y2="24" stroke="#2563EB" stroke-width="2" />
          <line x1="8" y1="8" x2="24" y2="8" stroke="#93C5FD" stroke-width="1.5" />
        </g>
        <text x="730" y="352" font-size="12" font-weight="800" fill="#1D4ED8" text-anchor="middle">PAI</text>
        <text x="730" y="368" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">AI Platform</text>
      </g>

      <!-- 3. Model Studio Card -->
