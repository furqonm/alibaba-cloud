<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="650" height="420">
  <rect width="650" height="420" fill="none"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Outer VPC Boundary (with white halo so dashed border pops in night mode) -->
    <rect x="64" y="160" width="352" height="236" rx="28" fill="none" stroke="#ffffff" stroke-width="4"/>
    <rect x="64" y="160" width="352" height="236" rx="28" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5,4"/>

    <!-- Official VPC Cloud Icon at Top-Left of VPC -->
    <g transform="translate(38, 134)">
      <path d="M 12 28 A 10 10 0 0 1 22 16 A 15 15 0 0 1 48 16 A 10 10 0 0 1 58 28 A 9 9 0 0 1 50 38 L 18 38 A 9 9 0 0 1 12 28 Z" fill="#ff6a00" stroke="#ffffff" stroke-width="1.8"/>
      <text x="35" y="32" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">VPC</text>
    </g>

    <!-- Top: Internet Cloud Icon -->
    <g transform="translate(198, 20)">
      <path d="M 16 40 A 15 15 0 0 1 30 22 A 22 22 0 0 1 68 22 A 15 15 0 0 1 82 40 A 13 13 0 0 1 72 55 L 24 55 A 13 13 0 0 1 16 40 Z" 
            fill="#ff6a00" stroke="#ffffff" stroke-width="2"/>
      <text x="49" y="45" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">Internet</text>
    </g>

    <!-- Line from Internet to vRouter -->
    <line x1="247" y1="76" x2="247" y2="134" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="247" y1="76" x2="247" y2="134" stroke="#ea580c" stroke-width="2.2"/>

    <!-- Line from vRouter directly to top of ECS01 (x=185, y=300) -->
    <line x1="247" y1="160" x2="185" y2="300" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="247" y1="160" x2="185" y2="300" stroke="#ea580c" stroke-width="2.2"/>

    <!-- vRouter Circle Icon at top border of VPC (cx=247, cy=160) -->
    <g transform="translate(247, 160)">
      <circle cx="0" cy="0" r="25" fill="#ffffff" stroke="#ff6a00" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="21" fill="#ff6a00"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <!-- 4 Cross Arrows -->
      <path d="M 0 -12 L 0 -3 M -3.5 -6.5 L 0 -3 L 3.5 -6.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 0 12 L 0 3 M -3.5 6.5 L 0 3 L 3.5 6.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M -3 0 L -12 0 M -8.5 -3.5 L -12 0 L -8.5 3.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 3 0 L 12 0 M 8.5 -3.5 L 12 0 L 8.5 3.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <!-- vRouter Label (placed cleanly below the VPC dashed top border) -->
    <text x="278" y="198" text-anchor="middle" font-size="14.5" font-weight="700" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none">vRouter</text>
    <text x="278" y="198" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ea580c">vRouter</text>

    <!-- Inner vSwitch Box -->
    <rect x="118" y="264" width="260" height="110" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <rect x="118" y="264" width="260" height="110" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4"/>

    <!-- Dashed Link between ECS01 and ECS02 -->
    <line x1="208" y1="325" x2="298" y2="325" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="208" y1="325" x2="298" y2="325" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="253" y="315" text-anchor="middle" font-size="14" font-weight="700" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none">vSwitch</text>
    <text x="253" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c">vSwitch</text>

    <!-- ECS01 (centered at x=180, top at y=300) -->
    <g transform="translate(160, 302)">
      <rect x="-2" y="-2" width="44" height="40" rx="4" fill="#ffffff"/>
      <rect x="0" y="0" width="40" height="10" rx="2.5" fill="#ff6a00"/>
      <circle cx="33" cy="5" r="1.8" fill="#ffffff"/>
      <rect x="0" y="13" width="40" height="10" rx="2.5" fill="#ff6a00"/>
      <circle cx="33" cy="18" r="1.8" fill="#ffffff"/>
      <rect x="0" y="26" width="40" height="10" rx="2.5" fill="#ff6a00"/>
      <circle cx="33" cy="31" r="1.8" fill="#ffffff"/>
    </g>
    <text x="180" y="358" text-anchor="middle" font-size="14" font-weight="700" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none">ECS01</text>
    <text x="180" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c">ECS01</text>

    <!-- ECS02 (centered at x=316, top at y=300) -->
    <g transform="translate(296, 302)">
      <rect x="-2" y="-2" width="44" height="40" rx="4" fill="#ffffff"/>
      <rect x="0" y="0" width="40" height="10" rx="2.5" fill="#ff6a00"/>
      <circle cx="33" cy="5" r="1.8" fill="#ffffff"/>
      <rect x="0" y="13" width="40" height="10" rx="2.5" fill="#ff6a00"/>
      <circle cx="33" cy="18" r="1.8" fill="#ffffff"/>
      <rect x="0" y="26" width="40" height="10" rx="2.5" fill="#ff6a00"/>
      <circle cx="33" cy="31" r="1.8" fill="#ffffff"/>
    </g>
    <text x="316" y="358" text-anchor="middle" font-size="14" font-weight="700" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none">ECS02</text>
    <text x="316" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c">ECS02</text>

    <!-- Right: VPC Custom Route Entry Table (Matches original 3-column layout & colors) -->
    <g transform="translate(282, 48)">
      <rect x="-2" y="-2" width="352" height="104" rx="3" fill="#ffffff"/>
      <!-- Header Row -->
      <rect x="0" y="0" width="348" height="26" fill="#ea580c"/>
      <text x="174" y="18" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">VPC Custom Route Entry</text>

      <!-- Column Header Row -->
      <rect x="0" y="28" width="106" height="42" fill="#f5d5c6"/>
      <rect x="108" y="28" width="116" height="42" fill="#f5d5c6"/>
      <rect x="226" y="28" width="122" height="42" fill="#f5d5c6"/>
      <text x="10" y="45" font-size="13" font-weight="600" fill="#0f172a">Destination</text>
      <text x="10" y="62" font-size="13" font-weight="600" fill="#0f172a">CIDR Block</text>
      <text x="118" y="45" font-size="13" font-weight="600" fill="#0f172a">Next Hop Type</text>
      <text x="236" y="45" font-size="13" font-weight="600" fill="#0f172a">Next Hop</text>

      <!-- Data Row -->
      <rect x="0" y="72" width="106" height="28" fill="#faeae3"/>
      <rect x="108" y="72" width="116" height="28" fill="#faeae3"/>
      <rect x="226" y="72" width="122" height="28" fill="#faeae3"/>
      <text x="10" y="91" font-size="13" font-weight="600" fill="#0f172a">0.0.0.0/0</text>
      <text x="118" y="91" font-size="13" font-weight="600" fill="#0f172a">ECS Instance</text>
      <text x="236" y="91" font-size="13" font-weight="600" fill="#0f172a">ECS01</text>
    </g>
  </g>
</svg>