<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="100%" height="auto">
  <defs>
    <filter id="rt-shadow" x="-3%" y="-4%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Transparent Canvas Background for Night Mode -->
  <rect width="660" height="420" fill="none"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Top: Internet Cloud Icon -->
    <g transform="translate(240, 20)">
      <!-- Cloud Shape -->
      <path d="M 20 30 
               A 16 16 0 0 1 36 14 
               A 22 22 0 0 1 74 14 
               A 16 16 0 0 1 90 30 
               A 14 14 0 0 1 82 46 
               L 26 46 
               A 14 14 0 0 1 20 30 Z" 
            fill="#ff6a00"/>
      <text x="54" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Internet</text>
    </g>

    <!-- Line from Internet to vRouter -->
    <line x1="294" y1="68" x2="294" y2="135" stroke="#ea580c" stroke-width="2.2"/>

    <!-- Right: Route Table -->
    <g transform="translate(340, 42)" filter="url(#rt-shadow)">
      <!-- Table Header -->
      <rect x="0" y="0" width="300" height="28" rx="4" fill="#ea580c"/>
      <text x="150" y="19" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">VPC Custom Route Entry</text>
      
      <!-- Table Column Headers -->
      <rect x="0" y="28" width="300" height="42" fill="#ffedd5" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="47" font-size="11" font-weight="700" fill="#9a3412">Destination</text>
      <text x="12" y="61" font-size="11" font-weight="700" fill="#9a3412">CIDR Block</text>
      
      <text x="110" y="54" font-size="11" font-weight="700" fill="#9a3412">Next Hop Type</text>
      <text x="215" y="54" font-size="11" font-weight="700" fill="#9a3412">Next Hop</text>
      
      <!-- Table Data Row -->
      <rect x="0" y="70" width="300" height="32" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="91" font-size="12" font-weight="700" fill="#1e293b">0.0.0.0/0</text>
      <text x="110" y="91" font-size="12" font-weight="600" fill="#334155">ECS Instance</text>
      <text x="215" y="91" font-size="12" font-weight="700" fill="#ea580c">ECS01</text>
    </g>

    <!-- Outer VPC Boundary -->
    <g transform="translate(60, 150)">
      <rect x="0" y="0" width="540" height="250" rx="20" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6,4"/>

      <!-- VPC Cloud Icon & Badge (Top Left of VPC) -->
      <g transform="translate(-18, -18)">
        <circle cx="20" cy="20" r="18" fill="#ff6a00"/>
        <!-- Mini cloud dots -->
        <circle cx="15" cy="19" r="2.5" fill="#ffffff"/>
        <circle cx="25" cy="16" r="2" fill="#ffffff"/>
        <circle cx="23" cy="24" r="2.5" fill="#ffffff"/>
        <line x1="15" y1="19" x2="25" y2="16" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="15" y1="19" x2="23" y2="24" stroke="#ffffff" stroke-width="1.2"/>
        <text x="20" y="32" text-anchor="middle" font-size="8" font-weight="800" fill="#ffffff">VPC</text>
      </g>
      
      <!-- Inner vSwitch Box -->
      <g transform="translate(60, 100)">
        <rect x="0" y="0" width="380" height="120" rx="8" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="190" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c">vSwitch</text>

        <!-- ECS01 -->
        <g transform="translate(65, 38)">
          <!-- 3 Server Blades -->
          <rect x="0" y="0" width="55" height="12" rx="3" fill="#ff6a00"/>
          <circle cx="10" cy="6" r="2" fill="#ffffff"/>
          <circle cx="45" cy="6" r="2" fill="#ffffff"/>
          
          <rect x="0" y="15" width="55" height="12" rx="3" fill="#ff6a00"/>
          <circle cx="10" cy="21" r="2" fill="#ffffff"/>
          <circle cx="45" cy="21" r="2" fill="#ffffff"/>

          <rect x="0" y="30" width="55" height="12" rx="3" fill="#ff6a00"/>
          <circle cx="10" cy="36" r="2" fill="#ffffff"/>
          <circle cx="45" cy="36" r="2" fill="#ffffff"/>

          <text x="27.5" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="#ea580c">ECS01</text>
        </g>

        <!-- Dashed Link between ECS01 and ECS02 -->
        <line x1="125" y1="58" x2="255" y2="58" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="4,4"/>

        <!-- ECS02 -->
        <g transform="translate(260, 38)">
          <!-- 3 Server Blades -->
          <rect x="0" y="0" width="55" height="12" rx="3" fill="#ff6a00"/>
          <circle cx="10" cy="6" r="2" fill="#ffffff"/>
          <circle cx="45" cy="6" r="2" fill="#ffffff"/>
          
          <rect x="0" y="15" width="55" height="12" rx="3" fill="#ff6a00"/>
          <circle cx="10" cy="21" r="2" fill="#ffffff"/>
          <circle cx="45" cy="21" r="2" fill="#ffffff"/>

          <rect x="0" y="30" width="55" height="12" rx="3" fill="#ff6a00"/>
          <circle cx="10" cy="36" r="2" fill="#ffffff"/>
          <circle cx="45" cy="36" r="2" fill="#ffffff"/>

          <text x="27.5" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="#ea580c">ECS02</text>
        </g>
      </g>
    </g>

    <!-- Line from vRouter to ECS01 -->
    <line x1="294" y1="150" x2="152" y2="288" stroke="#ea580c" stroke-width="2.2"/>

    <!-- vRouter Circle Icon at top border of VPC (x=294, y=150) -->
    <g transform="translate(294, 150)">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#ff6a00" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="21" fill="#ff6a00"/>
      <!-- Diagonal arrows -->
      <path d="M 4 -4 L 12 -12 M 6 -12 L 12 -12 L 12 -6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M -4 -4 L -12 -12 M -6 -12 L -12 -12 L -12 -6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 4 4 L 12 12 M 6 12 L 12 12 L 12 6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M -4 4 L -12 12 M -6 12 L -12 12 L -12 6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Label -->
      <text x="32" y="5" font-size="14" font-weight="700" fill="#ea580c">vRouter</text>
    </g>

  </g>
</svg>
