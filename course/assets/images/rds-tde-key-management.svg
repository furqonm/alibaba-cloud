<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="100%" height="100%">
  <defs>
    <filter id="tde-shadow" x="-5%" y="-4%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="tde-arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#475569"/>
    </marker>
    <marker id="tde-blue-arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="tde-orange-arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#ea580c"/>
    </marker>
    <linearGradient id="tde-disk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="35%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- TOP NODE: Application -->
  <g transform="translate(520, 15)">
    <rect width="160" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#tde-shadow)"/>
    <text x="80" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Application</text>
  </g>

  <!-- Application connection arrow to RDS Memory -->
  <path d="M 600 57 L 600 95" stroke="#475569" stroke-width="1.8" marker-end="url(#tde-arr)"/>

  <!-- LEFT BOX: KMS (Key Management Service) -->
  <g transform="translate(40, 120)">
    <rect width="200" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3" stroke-width="1.5" filter="url(#tde-shadow)"/>
    <text x="100" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">KMS</text>
    <text x="100" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">Key Management Service</text>

    <!-- KMS / CMK Card -->
    <g transform="translate(25, 60)">
      <rect width="150" height="120" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
      <!-- Key Icon (Orange) -->
      <g transform="translate(75, 32)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#ff6a00" stroke-width="3"/>
        <line x1="0" y1="14" x2="0" y2="40" stroke="#ff6a00" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="0" y1="26" x2="8" y2="26" stroke="#ff6a00" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="34" x2="6" y2="34" stroke="#ff6a00" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="75" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#c2410c">Service Key / BYOK</text>
      <text x="75" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ea580c">CMK (Customer Master Key)</text>
    </g>
  </g>

  <!-- Arrow from KMS to KEK -->
  <path d="M 240 225 L 290 225" stroke="#ea580c" stroke-width="2" marker-end="url(#tde-orange-arr)"/>

  <!-- KEK (Key Encryption Key) Node -->
  <g transform="translate(295, 185)">
    <rect width="80" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#tde-shadow)"/>
    <!-- Key icon -->
    <g transform="translate(40, 24)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#ff6a00" stroke-width="2.5"/>
      <line x1="0" y1="10" x2="0" y2="28" stroke="#ff6a00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="18" x2="6" y2="18" stroke="#ff6a00" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="40" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0f172a">KEK</text>
  </g>

  <!-- Arrow from KEK into RDS Instance -->
  <path d="M 375 225 L 420 225" stroke="#ea580c" stroke-width="2" marker-end="url(#tde-orange-arr)"/>

  <!-- RIGHT BOX: RDS Database Instance -->
  <g transform="translate(420, 80)">
    <rect width="360" height="300" rx="10" fill="#ffffff" stroke="#ff6a00" stroke-dasharray="4 3" stroke-width="1.8" filter="url(#tde-shadow)"/>
    
    <!-- RDS Header -->
    <g transform="translate(24, 16)">
      <!-- RDS 3-hex icon -->
      <polygon points="8,0 13,3 13,8 8,11 3,8 3,3" fill="#ff6a00"/>
      <polygon points="3,8 8,11 8,16 3,19 -2,16 -2,11" fill="#ff6a00"/>
      <polygon points="13,8 18,11 18,16 13,19 8,16 8,11" fill="#ff6a00"/>
    </g>
    <text x="50" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">RDS Database Instance</text>

    <!-- Top Card inside RDS: Memory (Data Decrypted) -->
    <g transform="translate(30, 42)">
      <rect width="300" height="42" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="150" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Memory (Data Decrypted / Plaintext)</text>
    </g>

    <!-- Middle Cryptographic Layer -->
    <!-- Down Arrow: Write Data -->
    <path d="M 80 84 L 80 200" stroke="#ea580c" stroke-width="2" marker-end="url(#tde-orange-arr)"/>
    <rect x="35" y="125" width="90" height="20" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
    <text x="80" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#c2410c">Write Data</text>

    <!-- Up Arrow: Read Data -->
    <path d="M 280 200 L 280 84" stroke="#0284c7" stroke-width="2" marker-end="url(#tde-blue-arr)"/>
    <rect x="235" y="125" width="90" height="20" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="280" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0284c7">Read Data</text>

    <!-- Center: DEK (Data Encryption Key) Node -->
    <g transform="translate(135, 110)">
      <rect width="90" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#tde-shadow)"/>
      <g transform="translate(45, 18)">
        <circle cx="0" cy="0" r="9" fill="none" stroke="#ff6a00" stroke-width="2.2"/>
        <line x1="0" y1="9" x2="0" y2="24" stroke="#ff6a00" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="0" y1="16" x2="5" y2="16" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <text x="45" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#ea580c">DEK</text>
    </g>

    <!-- Real-time Encrypt & Decrypt Indicators -->
    <text x="105" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ea580c">◀ Encrypt</text>
    <text x="210" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#0284c7">Decrypt ▶</text>

    <!-- Bottom Cylinder: Disk (Data Encrypted) -->
    <g transform="translate(70, 205)">
      <!-- Cylinder -->
      <path d="M 0 30 A 110 16 0 0 0 220 30 L 220 54 A 110 16 0 0 1 0 54 Z" fill="url(#tde-disk-grad)" stroke="#c2410c" stroke-width="1.2"/>
      <ellipse cx="110" cy="30" rx="110" ry="16" fill="#ea580c" stroke="#c2410c" stroke-width="1.2"/>
      <text x="110" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">Disk (Data Encrypted - AES-256)</text>
      <text x="110" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#ffffff">Tablespaces &amp; Physical Blocks</text>
    </g>
  </g>
</svg>