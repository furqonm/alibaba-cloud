<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 760" width="100%" height="auto">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="dns-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#1e293b"/>
    </marker>
    <filter id="dns-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Transparent Canvas Background for Night Mode -->
  <rect width="740" height="760" fill="none"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- ==================== USER (TOP) ==================== -->
    <g transform="translate(370, 45)">
      <!-- User Avatar -->
      <circle cx="0" cy="-14" r="14" fill="#0284c7"/>
      <path d="M -22 14 C -22 0, 22 0, 22 14 Z" fill="#0284c7"/>
    </g>

    <!-- Arrow down to DNS with DNS Lookup Label -->
    <line x1="370" y1="75" x2="370" y2="125" stroke="#1e293b" stroke-width="1.8" marker-end="url(#dns-arr)"/>
    <g transform="translate(370, 95)">
      <rect x="-48" y="-11" width="96" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">DNS Lookup</text>
    </g>

    <!-- ==================== ALIBABA CLOUD DNS (CENTER TOP) ==================== -->
    <g transform="translate(370, 160)" filter="url(#dns-shadow)">
      <!-- 3D Isometric Card -->
      <polygon points="0,-25 55,-2 0,21 -55,-2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <polygon points="-55,-2 0,21 0,38 -55,15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
      <polygon points="0,21 55,-2 55,15 0,38" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- DNS Globe Icon (Official Orange) -->
      <circle cx="0" cy="-2" r="14" fill="#ff6a00"/>
      <ellipse cx="0" cy="-2" rx="6" ry="14" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Label Card -->
      <rect x="-75" y="46" width="150" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="0" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Alibaba Cloud DNS</text>
    </g>

    <!-- Flow Split Paths from DNS to Regions -->
    <!-- Left path to SZ Region -->
    <path d="M 315 160 L 190 160 L 190 350" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#dns-arr)"/>
    <g transform="translate(190, 240)">
      <rect x="-50" y="-12" width="100" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">China visitors</text>
    </g>

    <!-- Right path to HK Region -->
    <path d="M 425 160 L 550 160 L 550 350" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#dns-arr)"/>
    <g transform="translate(550, 240)">
      <rect x="-52" y="-12" width="104" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Oversea visitors</text>
    </g>

    <!-- ==================== SZ REGION (LEFT) ==================== -->
    <g transform="translate(60, 310)">
      <!-- Region Outer Boundary -->
      <path d="M 0 0 L 235 0 L 260 25 L 260 185 L 0 185 Z" fill="rgba(241, 245, 249, 0.6)" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,4"/>

      <!-- ECS (Proxy) 3D Card -->
      <g transform="translate(130, 80)" filter="url(#dns-shadow)">
        <polygon points="0,-25 55,-2 0,21 -55,-2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <polygon points="-55,-2 0,21 0,38 -55,15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
        <polygon points="0,21 55,-2 55,15 0,38" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>

        <!-- Official Orange ECS Server Icon -->
        <g transform="translate(-16, -16)">
          <rect x="0" y="0" width="32" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="5" cy="3.5" r="1.2" fill="#ffffff"/>
          <circle cx="27" cy="3.5" r="1.2" fill="#ffffff"/>
          
          <rect x="0" y="10" width="32" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="5" cy="13.5" r="1.2" fill="#ffffff"/>
          <circle cx="27" cy="13.5" r="1.2" fill="#ffffff"/>

          <rect x="0" y="20" width="32" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="5" cy="23.5" r="1.2" fill="#ffffff"/>
          <circle cx="27" cy="23.5" r="1.2" fill="#ffffff"/>
        </g>

        <!-- Label Card -->
        <rect x="-60" y="46" width="120" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="0" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">ECS (Proxy)</text>
      </g>

      <!-- SZ Region Badge -->
      <g transform="translate(135, 155)">
        <rect x="0" y="0" width="125" height="30" fill="#1e293b"/>
        <text x="62.5" y="21" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">SZ Region</text>
      </g>
    </g>

    <!-- Cross-Region Connection (SZ Proxy -> HK ECS) -->
    <line x1="250" y1="390" x2="480" y2="390" stroke="#1e293b" stroke-width="1.8" marker-end="url(#dns-arr)"/>

    <!-- ==================== HK REGION (RIGHT) ==================== -->
    <g transform="translate(420, 310)">
      <!-- Region Outer Boundary -->
      <path d="M 0 0 L 235 0 L 260 25 L 260 185 L 0 185 Z" fill="rgba(241, 245, 249, 0.6)" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,4"/>

      <!-- ECS 3D Card -->
      <g transform="translate(130, 80)" filter="url(#dns-shadow)">
        <polygon points="0,-25 55,-2 0,21 -55,-2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <polygon points="-55,-2 0,21 0,38 -55,15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
        <polygon points="0,21 55,-2 55,15 0,38" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>

        <!-- Official Orange ECS Server Icon -->
        <g transform="translate(-16, -16)">
          <rect x="0" y="0" width="32" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="5" cy="3.5" r="1.2" fill="#ffffff"/>
          <circle cx="27" cy="3.5" r="1.2" fill="#ffffff"/>
          
          <rect x="0" y="10" width="32" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="5" cy="13.5" r="1.2" fill="#ffffff"/>
          <circle cx="27" cy="13.5" r="1.2" fill="#ffffff"/>

          <rect x="0" y="20" width="32" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="5" cy="23.5" r="1.2" fill="#ffffff"/>
          <circle cx="27" cy="23.5" r="1.2" fill="#ffffff"/>
        </g>

        <!-- Label Card -->
        <rect x="-50" y="46" width="100" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="0" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">ECS</text>
      </g>

      <!-- HK Region Badge -->
      <g transform="translate(135, 155)">
        <rect x="0" y="0" width="125" height="30" fill="#1e293b"/>
        <text x="62.5" y="21" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">HK Region</text>
      </g>
    </g>

    <!-- Path from ECS Proxy down to DNS Private Zone -->
    <path d="M 165 470 L 165 635 L 340 635" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#dns-arr)"/>
    <g transform="translate(245, 635)">
      <rect x="-46" y="-12" width="92" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">DNS Lookup</text>
    </g>

    <!-- ==================== DNS PRIVATE ZONE (BOTTOM) ==================== -->
    <g transform="translate(410, 620)" filter="url(#dns-shadow)">
      <polygon points="0,-25 55,-2 0,21 -55,-2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <polygon points="-55,-2 0,21 0,38 -55,15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
      <polygon points="0,21 55,-2 55,15 0,38" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>

      <!-- DNS Globe Icon (Official Orange) -->
      <circle cx="0" cy="-2" r="14" fill="#ff6a00"/>
      <ellipse cx="0" cy="-2" rx="6" ry="14" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Label Card -->
      <rect x="-75" y="46" width="150" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="0" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">DNS Private Zone</text>
    </g>

  </g>
</svg>
