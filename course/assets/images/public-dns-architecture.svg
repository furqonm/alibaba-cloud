<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 720" width="740" height="720">
  <defs>
    <marker id="dns-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="740" height="720" fill="none"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- ==================== USER (TOP) ==================== -->
    <g transform="translate(375, 45)">
      <circle cx="0" cy="-16" r="19" fill="#ffffff"/>
      <circle cx="0" cy="-16" r="17" fill="#1d70b8"/>
      <path d="M -36 32 L -32 8 C -30 0, -18 -2, -12 0 A 18 18 0 0 0 12 0 C 18 -2, 30 0, 32 8 L 36 32 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -36 32 L -32 8 C -30 0, -18 -2, -12 0 A 18 18 0 0 0 12 0 C 18 -2, 30 0, 32 8 L 36 32 Z" fill="#1d70b8"/>
    </g>

    <!-- Arrow down from User to Alibaba Cloud DNS -->
    <line x1="375" y1="78" x2="375" y2="92" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="375" y1="78" x2="375" y2="92" stroke="#0f172a" stroke-width="1.6"/>
    <line x1="375" y1="110" x2="375" y2="128" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="375" y1="110" x2="375" y2="128" stroke="#0f172a" stroke-width="1.6" marker-end="url(#dns-arr)"/>
    <text x="375" y="105" text-anchor="middle" font-size="11.5" font-weight="600" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none">DNS Lookup</text>
    <text x="375" y="105" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">DNS Lookup</text>

    <!-- Flow Split Paths from DNS to Regions (with white halo for Night Mode) -->
    <!-- Left path to SZ Region -->
    <path d="M 326 168 L 152 168 L 152 246" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 326 168 L 152 168 L 152 246" fill="none" stroke="#0f172a" stroke-width="1.6"/>
    <path d="M 152 266 L 152 382" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 152 266 L 152 382" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#dns-arr)"/>
    <text x="152" y="260" text-anchor="middle" font-size="11.5" font-weight="600" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none">China visitors</text>
    <text x="152" y="260" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">China visitors</text>

    <!-- Right path to HK Region -->
    <path d="M 424 168 L 585 168 L 585 252" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 424 168 L 585 168 L 585 252" fill="none" stroke="#0f172a" stroke-width="1.6"/>
    <path d="M 585 272 L 585 382" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 585 272 L 585 382" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#dns-arr)"/>
    <text x="585" y="266" text-anchor="middle" font-size="11.5" font-weight="600" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none">Oversea visitors</text>
    <text x="585" y="266" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Oversea visitors</text>

    <!-- ==================== ALIBABA CLOUD DNS (CENTER TOP) ==================== -->
    <g transform="translate(375, 168)">
      <!-- 3D Isometric Block -->
      <polygon points="0,-36 49,-10 0,16 -49,-10" fill="#ffffff" stroke="#737373" stroke-width="1.2"/>
      <polygon points="-49,-10 0,16 0,38 -49,12" fill="#e5e7eb" stroke="#737373" stroke-width="1.2"/>
      <polygon points="0,16 49,-10 49,12 0,38" fill="#d1d5db" stroke="#737373" stroke-width="1.2"/>

      <!-- Official Orange DNS Icon (with "DNS" text across middle) -->
      <circle cx="0" cy="-10" r="16" fill="#f94c24"/>
      <ellipse cx="0" cy="-10" rx="7" ry="15" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="-15" y1="-16" x2="15" y2="-16" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="-15" y1="-4" x2="15" y2="-4" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="-17" y="-15" width="34" height="10" fill="#ffffff"/>
      <text x="0" y="-6.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#f94c24" letter-spacing="0.5">DNS</text>

      <!-- Label Card -->
      <rect x="-82" y="45" width="168" height="29" fill="#cbd5e1"/>
      <rect x="-84" y="42" width="168" height="29" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
      <text x="0" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Alibaba Cloud DNS</text>
    </g>

    <!-- ==================== SZ REGION (LEFT) ==================== -->
    <g transform="translate(12, 338)">
      <!-- Region Outer Boundary (Valid SVG 1.1 fill="#f1f5f9") -->
      <polygon points="0,0 256,0 284,28 284,202 0,202" fill="#f1f5f9" stroke="#ffffff" stroke-width="4"/>
      <polygon points="0,0 256,0 284,28 284,202 0,202" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6,5"/>

      <!-- ECS (Proxy) 3D Card -->
      <g transform="translate(140, 88)">
        <polygon points="0,-36 49,-10 0,16 -49,-10" fill="#ffffff" stroke="#737373" stroke-width="1.2"/>
        <polygon points="-49,-10 0,16 0,38 -49,12" fill="#e5e7eb" stroke="#737373" stroke-width="1.2"/>
        <polygon points="0,16 49,-10 49,12 0,38" fill="#d1d5db" stroke="#737373" stroke-width="1.2"/>

        <!-- Official Orange ECS Icon -->
        <g transform="translate(-17, -24)">
          <rect x="0" y="0" width="34" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="28" cy="3.5" r="1.4" fill="#ffffff"/>
          <rect x="0" y="9" width="34" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="28" cy="12.5" r="1.4" fill="#ffffff"/>
          <rect x="0" y="18" width="34" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="28" cy="21.5" r="1.4" fill="#ffffff"/>
        </g>

        <!-- Label Card -->
        <rect x="-60" y="45" width="124" height="29" fill="#cbd5e1"/>
        <rect x="-62" y="42" width="124" height="29" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
        <text x="0" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">ECS (Proxy)</text>
      </g>

      <!-- SZ Region Badge -->
      <rect x="144" y="172" width="140" height="30" fill="#262626"/>
      <text x="214" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">SZ Region</text>
    </g>

    <!-- ==================== HK REGION (RIGHT) ==================== -->
    <g transform="translate(445, 338)">
      <!-- Region Outer Boundary -->
      <polygon points="0,0 256,0 284,28 284,202 0,202" fill="#f1f5f9" stroke="#ffffff" stroke-width="4"/>
      <polygon points="0,0 256,0 284,28 284,202 0,202" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6,5"/>

      <!-- ECS 3D Card -->
      <g transform="translate(140, 88)">
        <polygon points="0,-36 49,-10 0,16 -49,-10" fill="#ffffff" stroke="#737373" stroke-width="1.2"/>
        <polygon points="-49,-10 0,16 0,38 -49,12" fill="#e5e7eb" stroke="#737373" stroke-width="1.2"/>
        <polygon points="0,16 49,-10 49,12 0,38" fill="#d1d5db" stroke="#737373" stroke-width="1.2"/>

        <!-- Official Orange ECS Icon -->
        <g transform="translate(-17, -24)">
          <rect x="0" y="0" width="34" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="28" cy="3.5" r="1.4" fill="#ffffff"/>
          <rect x="0" y="9" width="34" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="28" cy="12.5" r="1.4" fill="#ffffff"/>
          <rect x="0" y="18" width="34" height="7" rx="2" fill="#ff6a00"/>
          <circle cx="28" cy="21.5" r="1.4" fill="#ffffff"/>
        </g>

        <!-- Label Card -->
        <rect x="-50" y="45" width="104" height="29" fill="#cbd5e1"/>
        <rect x="-52" y="42" width="104" height="29" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
        <text x="0" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">ECS</text>
      </g>

      <!-- HK Region Badge -->
      <rect x="144" y="172" width="140" height="30" fill="#262626"/>
      <text x="214" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">HK Region</text>
    </g>

    <!-- Cross-Region Connection (SZ Proxy -> HK ECS) -->
    <line x1="201" y1="426" x2="532" y2="426" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="201" y1="426" x2="532" y2="426" stroke="#0f172a" stroke-width="1.6" marker-end="url(#dns-arr)"/>

    <!-- Path from ECS Proxy down to DNS Private Zone -->
    <path d="M 124 498 L 124 624 L 154 624" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 124 498 L 124 624 L 154 624" fill="none" stroke="#0f172a" stroke-width="1.6"/>
    <line x1="232" y1="624" x2="320" y2="624" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="232" y1="624" x2="320" y2="624" stroke="#0f172a" stroke-width="1.6" marker-end="url(#dns-arr)"/>
    <text x="193" y="628" text-anchor="middle" font-size="11.5" font-weight="600" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none">DNS Lookup</text>
    <text x="193" y="628" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">DNS Lookup</text>

    <!-- ==================== DNS PRIVATE ZONE (BOTTOM) ==================== -->
    <g transform="translate(373, 614)">
      <polygon points="0,-36 49,-10 0,16 -49,-10" fill="#ffffff" stroke="#737373" stroke-width="1.2"/>
      <polygon points="-49,-10 0,16 0,38 -49,12" fill="#e5e7eb" stroke="#737373" stroke-width="1.2"/>
      <polygon points="0,16 49,-10 49,12 0,38" fill="#d1d5db" stroke="#737373" stroke-width="1.2"/>

      <!-- DNS Globe Icon (Official Orange) -->
      <circle cx="0" cy="-10" r="16" fill="#f94c24"/>
      <ellipse cx="0" cy="-10" rx="7" ry="15" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <line x1="-15" y1="-15" x2="15" y2="-15" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="-15" y1="-5" x2="15" y2="-5" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="0" y1="-25" x2="0" y2="5" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Label Card -->
      <rect x="-78" y="45" width="160" height="29" fill="#cbd5e1"/>
      <rect x="-80" y="42" width="160" height="29" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
      <text x="0" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">DNS Private Zone</text>
    </g>
  </g>
</svg>