<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="100%" height="100%">
  <defs>
    <filter id="topo-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#475569"/>
    </marker>
    <marker id="arr-sync" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arr-sync-rev" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto">
      <polygon points="7 1, 0 3.5, 7 6" fill="#10b981"/>
    </marker>
  </defs>

  <!-- TOP NODE: ECS Instance -->
  <g transform="translate(250, 15)">
    <rect width="120" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#topo-shadow)"/>
    <!-- ECS Icon -->
    <g transform="translate(48, 10)">
      <rect x="0" y="0" width="24" height="6" rx="1.5" fill="#ff6a00"/>
      <circle cx="19" cy="3" r="1.2" fill="#ffffff"/>
      <rect x="0" y="8" width="24" height="6" rx="1.5" fill="#ff6a00"/>
      <circle cx="19" cy="11" r="1.2" fill="#ffffff"/>
      <rect x="0" y="16" width="24" height="6" rx="1.5" fill="#ff6a00"/>
      <circle cx="19" cy="19" r="1.2" fill="#ffffff"/>
    </g>
    <text x="60" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">ECS Instance</text>
  </g>

  <!-- Connector from ECS to Primary/Secondary -->
  <path d="M 270 69 L 270 95 L 135 95 L 135 130" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-m)"/>
  <!-- Label Badge -->
  <rect x="85" y="85" width="135" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="152" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#334155">Read and Write Requests</text>

  <!-- Connector from ECS to Read-Only Fleet -->
  <path d="M 350 69 L 350 95 L 450 95 L 450 130" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-m)"/>
  <!-- Label Badge -->
  <rect x="390" y="85" width="120" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="450" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#334155">Read-only Requests</text>

  <!-- Data Sync Arrow between the two containers -->
  <path d="M 252 205 L 308 205" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-sync)"/>
  <rect x="252" y="185" width="60" height="18" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="282" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#059669">Data Sync</text>

  <!-- LEFT CONTAINER: Primary and Secondary RDS Instances in Region A -->
  <g transform="translate(15, 130)">
    <rect width="235" height="150" rx="8" fill="#ffffff" stroke="#ea580c" stroke-dasharray="4 3" stroke-width="1.5" filter="url(#topo-shadow)"/>
    <text x="117" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#c2410c">Primary and Secondary RDS</text>
    <text x="117" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">in Region A (HA Pair)</text>

    <!-- Primary Instance Card -->
    <g transform="translate(15, 48)">
      <rect width="90" height="90" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
      <!-- RDS Icon -->
      <g transform="translate(45, 18)">
        <polygon points="9,0 15,3 15,10 9,13 3,10 3,3" fill="#ff6a00"/>
        <polygon points="3,10 9,13 9,20 3,23 -3,20 -3,13" fill="#ff6a00"/>
        <polygon points="15,10 21,13 21,20 15,23 9,20 9,13" fill="#ff6a00"/>
      </g>
      <text x="45" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Primary</text>
      <text x="45" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#ea580c">RDS Instance</text>
    </g>

    <!-- Two-way sync arrow between Primary & Secondary -->
    <path d="M 108 85 L 124 85" stroke="#10b981" stroke-width="1.8" marker-start="url(#arr-sync-rev)" marker-end="url(#arr-sync)"/>
    <text x="117" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#047857">Sync</text>

    <!-- Secondary Instance Card -->
    <g transform="translate(128, 48)">
      <rect width="90" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <!-- RDS Icon -->
      <g transform="translate(45, 18)">
        <polygon points="9,0 15,3 15,10 9,13 3,10 3,3" fill="#94a3b8"/>
        <polygon points="3,10 9,13 9,20 3,23 -3,20 -3,13" fill="#94a3b8"/>
        <polygon points="15,10 21,13 21,20 15,23 9,20 9,13" fill="#94a3b8"/>
      </g>
      <text x="45" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Secondary</text>
      <text x="45" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">Standby Node</text>
    </g>
  </g>

  <!-- RIGHT CONTAINER: Read-only RDS Instances in Region A -->
  <g transform="translate(310, 130)">
    <rect width="295" height="150" rx="8" fill="#ffffff" stroke="#38bdf8" stroke-dasharray="4 3" stroke-width="1.5" filter="url(#topo-shadow)"/>
    <text x="147" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7">Read-only RDS Instances</text>
    <text x="147" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">in Region A (Throughput Scale)</text>

    <!-- RO 1 -->
    <g transform="translate(12, 48)">
      <rect width="84" height="90" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
      <g transform="translate(42, 18)">
        <polygon points="9,0 15,3 15,10 9,13 3,10 3,3" fill="#ff6a00"/>
        <polygon points="3,10 9,13 9,20 3,23 -3,20 -3,13" fill="#ff6a00"/>
        <polygon points="15,10 21,13 21,20 15,23 9,20 9,13" fill="#ff6a00"/>
      </g>
      <text x="42" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Read-only</text>
      <text x="42" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#0284c7">Replica 1</text>
    </g>

    <!-- RO 2 -->
    <g transform="translate(104, 48)">
      <rect width="84" height="90" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
      <g transform="translate(42, 18)">
        <polygon points="9,0 15,3 15,10 9,13 3,10 3,3" fill="#ff6a00"/>
        <polygon points="3,10 9,13 9,20 3,23 -3,20 -3,13" fill="#ff6a00"/>
        <polygon points="15,10 21,13 21,20 15,23 9,20 9,13" fill="#ff6a00"/>
      </g>
      <text x="42" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Read-only</text>
      <text x="42" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#0284c7">Replica 2</text>
    </g>

    <!-- RO 3 -->
    <g transform="translate(196, 48)">
      <rect width="84" height="90" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
      <g transform="translate(42, 18)">
        <polygon points="9,0 15,3 15,10 9,13 3,10 3,3" fill="#ff6a00"/>
        <polygon points="3,10 9,13 9,20 3,23 -3,20 -3,13" fill="#ff6a00"/>
        <polygon points="15,10 21,13 21,20 15,23 9,20 9,13" fill="#ff6a00"/>
      </g>
      <text x="42" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Read-only</text>
      <text x="42" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#0284c7">Replica 3</text>
    </g>
  </g>
</svg>