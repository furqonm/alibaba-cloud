<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="auto">
  <defs>
    <filter id="vm-shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Outer Container -->
    <rect x="5" y="5" width="530" height="370" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Top: 3 Virtual Machines -->
    <!-- VM 1 -->
    <g filter="url(#vm-shadow)">
      <rect x="25" y="20" width="150" height="155" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5" />
      <rect x="25" y="20" width="150" height="28" rx="8" fill="#F0F7FB" />
      <rect x="25" y="40" width="150" height="8" fill="#F0F7FB" />
      <text x="100" y="39" fill="#1E3A5F" font-size="13" font-weight="700" text-anchor="middle">VM 1</text>
      
      <!-- App 1 -->
      <rect x="35" y="56" width="130" height="48" rx="6" fill="#3A88C8" stroke="#2C75B0" stroke-width="1" />
      <text x="100" y="85" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">App</text>

      <!-- Guest OS 1 -->
      <rect x="35" y="112" width="130" height="52" rx="6" fill="#E1F0F8" stroke="#B0D7EC" stroke-width="1" />
      <text x="100" y="143" fill="#1E3A5F" font-size="14" font-weight="700" text-anchor="middle">Guest OS</text>
    </g>

    <!-- VM 2 -->
    <g filter="url(#vm-shadow)">
      <rect x="195" y="20" width="150" height="155" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5" />
      <rect x="195" y="20" width="150" height="28" rx="8" fill="#F0F7FB" />
      <rect x="195" y="40" width="150" height="8" fill="#F0F7FB" />
      <text x="270" y="39" fill="#1E3A5F" font-size="13" font-weight="700" text-anchor="middle">VM 2</text>
      
      <!-- App 2 -->
      <rect x="205" y="56" width="130" height="48" rx="6" fill="#3A88C8" stroke="#2C75B0" stroke-width="1" />
      <text x="270" y="85" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">App</text>

      <!-- Guest OS 2 -->
      <rect x="205" y="112" width="130" height="52" rx="6" fill="#E1F0F8" stroke="#B0D7EC" stroke-width="1" />
      <text x="270" y="143" fill="#1E3A5F" font-size="14" font-weight="700" text-anchor="middle">Guest OS</text>
    </g>

    <!-- VM 3 -->
    <g filter="url(#vm-shadow)">
      <rect x="365" y="20" width="150" height="155" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5" />
      <rect x="365" y="20" width="150" height="28" rx="8" fill="#F0F7FB" />
      <rect x="365" y="40" width="150" height="8" fill="#F0F7FB" />
      <text x="440" y="39" fill="#1E3A5F" font-size="13" font-weight="700" text-anchor="middle">VM 3</text>
      
      <!-- App 3 -->
      <rect x="375" y="56" width="130" height="48" rx="6" fill="#3A88C8" stroke="#2C75B0" stroke-width="1" />
      <text x="440" y="85" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">App</text>

      <!-- Guest OS 3 -->
      <rect x="375" y="112" width="130" height="52" rx="6" fill="#E1F0F8" stroke="#B0D7EC" stroke-width="1" />
      <text x="440" y="143" fill="#1E3A5F" font-size="14" font-weight="700" text-anchor="middle">Guest OS</text>
    </g>

    <!-- Layer 3: Hypervisor -->
    <g filter="url(#vm-shadow)">
      <rect x="25" y="190" width="490" height="50" rx="8" fill="#3A88C8" stroke="#2C75B0" stroke-width="1.5" />
      <text x="270" y="221" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Hypervisor</text>
    </g>

    <!-- Layer 2: Host Operating System -->
    <g filter="url(#vm-shadow)">
      <rect x="25" y="250" width="490" height="50" rx="8" fill="#E1F0F8" stroke="#B0D7EC" stroke-width="1.5" />
      <text x="270" y="281" fill="#1E3A5F" font-size="15" font-weight="700" text-anchor="middle">Host Operating System</text>
    </g>

    <!-- Layer 1: Host Hardware -->
    <g filter="url(#vm-shadow)">
      <rect x="25" y="310" width="490" height="50" rx="8" fill="#48B092" stroke="#31977A" stroke-width="1.5" />
      <text x="270" y="341" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Host Hardware</text>
    </g>
  </g>
</svg>