<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <filter id="shadow-alb-clean" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="alb-grad-clean" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <marker id="arrow-gray-clean" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange-clean" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#FF6A00"/>
    </marker>
  </defs>

  <!-- Canvas Outer Background -->
  <rect x="4" y="4" width="832" height="392" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== TOP: ALB ==================== -->
  <g transform="translate(345, 16)" filter="url(#shadow-alb-clean)">
    <rect width="150" height="52" rx="8" fill="#fff7ed" stroke="#FF6A00" stroke-width="2"/>
    <rect x="10" y="8" width="36" height="36" rx="6" fill="url(#alb-grad-clean)"/>
    <text x="28" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18">⚖️</text>
    <text x="58" y="34" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#9a3412">ALB</text>
  </g>

  <!-- Connectors from ALB to Listeners -->
  <path d="M 385 68 L 385 92 L 245 92 L 245 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray-clean)"/>
  <path d="M 455 68 L 455 92 L 660 92 L 660 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray-clean)"/>

  <!-- ==================== MIDDLE TIER: LISTENERS & RULES ==================== -->
  <!-- Left Listener: HTTP:80 -->
  <g transform="translate(20, 115)" filter="url(#shadow-alb-clean)">
    <rect width="450" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="450" height="28" rx="8" fill="#0284c7"/>
    <rect y="18" width="450" height="10" fill="#0284c7"/>
    <text x="16" y="19" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff">Listener HTTP:80</text>

    <!-- Rule: header=foo -->
    <g transform="translate(15, 38)">
      <rect width="195" height="58" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Forwarding rule</text>
      <rect x="12" y="29" width="171" height="20" rx="4" fill="#eff6ff"/>
      <text x="97" y="43" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">header = foo</text>
    </g>

    <!-- Rule: cookie=bar -->
    <g transform="translate(240, 38)">
      <rect width="195" height="58" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Forwarding rule</text>
      <rect x="12" y="29" width="171" height="20" rx="4" fill="#eff6ff"/>
      <text x="97" y="43" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">cookie = bar</text>
    </g>
  </g>

  <!-- Right Listener: HTTPS:443 -->
  <g transform="translate(500, 115)" filter="url(#shadow-alb-clean)">
    <rect width="320" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="320" height="28" rx="8" fill="#059669"/>
    <rect y="18" width="320" height="10" fill="#059669"/>
    <text x="16" y="19" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff">Listener HTTPS:443</text>

    <!-- Rule: host=www.example.com -->
    <g transform="translate(15, 38)">
      <rect width="290" height="58" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">Forwarding rule</text>
      <rect x="12" y="29" width="266" height="20" rx="4" fill="#ecfdf5"/>
      <text x="145" y="43" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#065f46">host = www.example.com</text>
    </g>
  </g>

  <!-- Connectors from Rules down to Server Groups -->
  <path d="M 132 225 L 132 245 L 145 245 L 145 260" fill="none" stroke="#FF6A00" stroke-width="2" marker-end="url(#arrow-orange-clean)"/>
  <path d="M 337 225 L 337 245 L 420 245 L 420 260" fill="none" stroke="#FF6A00" stroke-width="2" marker-end="url(#arrow-orange-clean)"/>
  <path d="M 660 225 L 660 260" fill="none" stroke="#FF6A00" stroke-width="2" marker-end="url(#arrow-orange-clean)"/>

  <!-- ==================== BOTTOM TIER: SERVER GROUPS ==================== -->
  <!-- Server group A (ECS) -->
  <g transform="translate(20, 265)" filter="url(#shadow-alb-clean)">
    <rect width="250" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">Server group A</text>

    <g transform="translate(14, 28)">
      <rect width="66" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="33" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="33" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">ECS</text>
    </g>
    <g transform="translate(92, 28)">
      <rect width="66" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="33" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="33" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">ECS</text>
    </g>
    <g transform="translate(170, 28)">
      <rect width="66" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="33" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="33" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">ECS</text>
    </g>

    <rect x="14" y="85" width="222" height="24" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="125" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Health check</text>
  </g>

  <!-- Server group B (ECI) -->
  <g transform="translate(295, 265)" filter="url(#shadow-alb-clean)">
    <rect width="250" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">Server group B</text>

    <g transform="translate(14, 28)">
      <rect width="66" height="48" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="33" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">📦</text>
      <text x="33" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#6d28d9">ECI</text>
    </g>
    <g transform="translate(92, 28)">
      <rect width="66" height="48" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="33" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">📦</text>
      <text x="33" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#6d28d9">ECI</text>
    </g>
    <g transform="translate(170, 28)">
      <rect width="66" height="48" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="33" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">📦</text>
      <text x="33" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#6d28d9">ECI</text>
    </g>

    <rect x="14" y="85" width="222" height="24" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="125" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Health check</text>
  </g>

  <!-- Server group C (ENI) -->
  <g transform="translate(570, 265)" filter="url(#shadow-alb-clean)">
    <rect width="250" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">Server group C</text>

    <g transform="translate(14, 28)">
      <rect width="66" height="48" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="33" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🔌</text>
      <text x="33" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#047857">ENI</text>
    </g>
    <g transform="translate(92, 28)">
      <rect width="66" height="48" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="33" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🔌</text>
      <text x="33" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#047857">ENI</text>
    </g>
    <g transform="translate(170, 28)">
      <rect width="66" height="48" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="33" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🔌</text>
      <text x="33" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#047857">ENI</text>
    </g>

    <rect x="14" y="85" width="222" height="24" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="125" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Health check</text>
  </g>
</svg>