    <rect width="150" height="52" rx="8" fill="#fff7ed" stroke="#FF6A00" stroke-width="2"/>
    <rect x="10" y="8" width="36" height="36" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
      <g transform="translate(13.38, 11.78) scale(0.8125)"><line x1="18.0" y1="8.5" x2="8.2" y2="24.8" stroke="#FF6A00" stroke-width="2.6" stroke-linecap="round"/><line x1="18.0" y1="8.5" x2="27.8" y2="24.8" stroke="#FF6A00" stroke-width="2.6" stroke-linecap="round"/><line x1="8.2" y1="24.8" x2="27.8" y2="24.8" stroke="#FF6A00" stroke-width="2.6" stroke-linecap="round"/><circle cx="18.0" cy="8.5" r="5.6" fill="#FF6A00"/><circle cx="8.2" cy="24.8" r="5.6" fill="#FF6A00"/><circle cx="27.8" cy="24.8" r="5.6" fill="#FF6A00"/></g>
    <text x="58" y="34" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#9a3412">ALB</text>
  </g>

  <!-- Connectors from ALB to Listeners -->
