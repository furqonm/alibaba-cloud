<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <marker id="arr-down" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1.5 0 L 5 8 L 8.5 0 z" fill="#ff6a00"/>
    </marker>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== COLUMN 1: RELEASE MODE ==================== -->
  <g transform="translate(30, 20)">
    <!-- Column Title -->
    <rect width="280" height="34" rx="7" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="140" y="22" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">A. Release Mode (Default)</text>

    <!-- BEFORE Box -->
    <g transform="translate(0, 46)" filter="url(#box-shadow)">
      <rect width="280" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="12" y="8" width="60" height="18" rx="4" fill="#0f172a"/>
      <text x="42" y="21" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">BEFORE</text>
      
      <!-- Scaling Group Container -->
      <rect x="12" y="32" width="256" height="116" rx="6" fill="#ffffff" stroke="#ff6a00" stroke-width="1.5"/>
      <text x="24" y="47" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#ea580c">Scaling Group</text>

      <!-- ECS Instance 1 -->
      <g transform="translate(24, 55)">
        <rect width="105" height="82" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
        <rect x="15" y="12" width="40" height="8" rx="2" fill="#ff6a00"/>
        <circle cx="48" cy="16" r="1.5" fill="#ffffff"/>
        <rect x="15" y="24" width="40" height="8" rx="2" fill="#ff6a00"/>
        <circle cx="48" cy="28" r="1.5" fill="#ffffff"/>
        <text x="52" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">ECS-01</text>
        <circle cx="28" cy="64" r="3.5" fill="#16a34a"/>
        <text x="36" y="67" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#15803d">Running</text>
      </g>

      <!-- ECS Instance 2 -->
      <g transform="translate(150, 55)">
        <rect width="105" height="82" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
        <rect x="15" y="12" width="40" height="8" rx="2" fill="#ff6a00"/>
        <circle cx="48" cy="16" r="1.5" fill="#ffffff"/>
        <rect x="15" y="24" width="40" height="8" rx="2" fill="#ff6a00"/>
        <circle cx="48" cy="28" r="1.5" fill="#ffffff"/>
        <text x="52" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">ECS-02</text>
        <circle cx="28" cy="64" r="3.5" fill="#16a34a"/>
        <text x="36" y="67" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#15803d">Running</text>
