      <rect x="12" y="8" width="55" height="18" rx="4" fill="#dc2626"/>
      <text x="39" y="21" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">AFTER</text>

      <!-- Scaling Group Container (Empty) -->
      <rect x="12" y="32" width="256" height="116" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="24" y="47" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#64748b">Scaling Group</text>

      <!-- Empty / Terminated Notice -->
      <rect x="36" y="65" width="208" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>
      <circle cx="70" cy="95" r="14" fill="#fee2e2"/>
      <line x1="63" y1="88" x2="77" y2="102" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="77" y1="88" x2="63" y2="102" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <text x="96" y="91" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">All Instances Released</text>
      <text x="96" y="106" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#dc2626">VMs Deleted Permanently</text>
    </g>
  </g>

