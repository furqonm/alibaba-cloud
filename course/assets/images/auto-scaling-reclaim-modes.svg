    <text x="140" y="229" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">Scale-In</text>

    <!-- AFTER Box -->
    <g transform="translate(0, 248)" filter="url(#box-shadow)">
