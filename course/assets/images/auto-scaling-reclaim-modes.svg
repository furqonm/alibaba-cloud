    <rect x="100" y="218" width="80" height="15" rx="3" fill="#fff7ed" stroke="#ff6a00" stroke-width="1"/>
    <text x="140" y="229" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#c2410c" text-anchor="middle">Scale-In</text>

