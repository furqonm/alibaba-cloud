<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="auto">
  <defs>
    <filter id="shadow2" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker id="t-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="t-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="t-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Internet Cloud on the Left -->
    <g filter="url(#shadow2)">
      <rect x="15" y="135" width="105" height="110" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />
      <circle cx="55" cy="172" r="15" fill="#CBD5E1" />
      <circle cx="75" cy="166" r="18" fill="#94A3B8" />
      <circle cx="88" cy="176" r="13" fill="#CBD5E1" />
      <text x="68" y="212" fill="#1E293B" font-size="12" font-weight="700" text-anchor="middle">Internet</text>
      <text x="68" y="228" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">(Public Clients)</text>
    </g>

    <!-- Isolated Network Boundary Box -->
    <rect x="145" y="25" width="480" height="355" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="2" />
    
    <!-- Network Header Banner -->
    <rect x="145" y="25" width="480" height="34" rx="12" fill="#1E293B" />
    <rect x="145" y="47" width="480" height="12" fill="#1E293B" />
    <text x="385" y="47" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Isolated Network Boundary (CIDR: 10.0.0.0/16)</text>

    <!-- Router / Gateway Box -->
    <g filter="url(#shadow2)">
      <rect x="165" y="145" width="80" height="95" rx="8" fill="#0284C7" stroke="#0369A1" stroke-width="1.5" />
      <circle cx="205" cy="178" r="16" fill="#E0F2FE" />
      <path d="M 197 178 L 213 178 M 205 170 L 205 186" stroke="#0284C7" stroke-width="2.5" />
      <text x="205" y="214" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Router</text>
      <text x="205" y="228" fill="#E0F2FE" font-size="9" font-weight="500" text-anchor="middle">(Gateway)</text>
    </g>

    <!-- Link: Internet to Router -->
    <path d="M 120 190 L 157 190" stroke="#0284C7" stroke-width="2.5" marker-end="url(#t-blue)" />

    <!-- Public vSwitch Container -->
    <g filter="url(#shadow2)">
      <rect x="265" y="78" width="160" height="280" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4 3" />
      <rect x="265" y="78" width="160" height="30" rx="8" fill="#E0F2FE" />
      <rect x="265" y="96" width="160" height="12" fill="#E0F2FE" />
      <text x="345" y="97" fill="#0369A1" font-size="11" font-weight="700" text-anchor="middle">Public vSwitch (10.0.1.0/24)</text>
      <text x="345" y="122" fill="#0284C7" font-size="10" font-weight="600" text-anchor="middle">[Front-Desk / Cashier]</text>

      <!-- Web Server Card -->
      <rect x="280" y="145" width="130" height="115" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
      <rect x="290" y="157" width="110" height="26" rx="4" fill="#E0F2FE" />
      <text x="345" y="174" fill="#0369A1" font-size="10" font-weight="700" text-anchor="middle">Web Server / Proxy</text>
      <text x="345" y="202" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">App Ingress</text>
      <text x="345" y="220" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">IP: 10.0.1.10</text>
      <text x="345" y="244" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">Public Routing Enabled</text>
    </g>

    <!-- vSwitch Barrier / Divider Line -->
    <line x1="442" y1="78" x2="442" y2="358" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4" />
    <g filter="url(#shadow2)">
      <rect x="430" y="105" width="24" height="34" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2" />
      <text x="442" y="127" fill="#991B1B" font-size="13" font-weight="800" text-anchor="middle">&#128274;</text>
    </g>

    <!-- Private vSwitch Container -->
    <g filter="url(#shadow2)">
      <rect x="458" y="78" width="155" height="280" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" />
      <rect x="458" y="78" width="155" height="30" rx="8" fill="#D1FAE5" />
      <rect x="458" y="96" width="155" height="12" fill="#D1FAE5" />
      <text x="535" y="97" fill="#065F46" font-size="11" font-weight="700" text-anchor="middle">Private vSwitch (10.0.2.0/24)</text>
      <text x="535" y="122" fill="#059669" font-size="10" font-weight="600" text-anchor="middle">[Kitchen / Chef]</text>

      <!-- Database Card -->
      <rect x="470" y="145" width="130" height="115" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
      <rect x="480" y="157" width="110" height="26" rx="4" fill="#D1FAE5" />
      <text x="535" y="174" fill="#065F46" font-size="10" font-weight="700" text-anchor="middle">Database / Core App</text>
      <text x="535" y="202" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Data Store</text>
      <text x="535" y="220" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">IP: 10.0.2.50</text>
      <text x="535" y="244" fill="#DC2626" font-size="9" font-weight="700" text-anchor="middle">No Direct Internet Route</text>
    </g>

    <!-- Allowed Traffic Path: Router -> Web Server -->
    <path d="M 245 190 L 272 190" stroke="#059669" stroke-width="2.5" marker-end="url(#t-green)" />

    <!-- Allowed Traffic Path: Web Server -> Database -->
    <path d="M 410 200 L 460 200" stroke="#059669" stroke-width="2.5" marker-end="url(#t-green)" />
    <rect x="415" y="175" width="55" height="18" rx="3" fill="#D1FAE5" />
    <text x="442" y="188" fill="#065F46" font-size="9" font-weight="700" text-anchor="middle">Internal</text>

    <!-- Blocked External Traffic Path to Private vSwitch -->
    <path d="M 68 245 L 68 320 L 435 320" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#t-red)" />
    <g filter="url(#shadow2)">
      <rect x="155" y="308" width="220" height="24" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2" />
      <text x="265" y="324" fill="#991B1B" font-size="10" font-weight="800" text-anchor="middle">&#10006; Direct Public Access Blocked</text>
    </g>
  </g>
</svg>