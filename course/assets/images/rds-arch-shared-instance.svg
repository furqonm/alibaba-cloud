<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 210" width="100%" height="100%">
  <defs>
    <filter id="inst-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .text-title { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .text-category { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ea580c; text-anchor: middle; }
      .text-inst { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .text-sub { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; font-weight: 500; }
      .text-bar { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    </style>
  </defs>

  <!-- Instance 1 Card -->
  <g transform="translate(90, 20)">
    <rect width="230" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#inst-shadow)" />
    <g>
      <polygon points="120.9,26.3 115.0,29.7 109.1,26.3 109.1,19.4 115.0,16.0 120.9,19.4" fill="#ff6a00"/>
      <polygon points="114.1,38.0 108.2,41.4 102.3,38.0 102.3,31.2 108.2,27.8 114.1,31.2" fill="#ff6a00"/>
      <polygon points="127.7,38.0 121.8,41.4 115.9,38.0 115.9,31.2 121.8,27.8 127.7,31.2" fill="#ff6a00"/>
    </g>
    <text x="115" y="58" class="text-inst">RDS Instance 1</text>
    <g transform="translate(0, 0)">
      <rect x="62.0" y="74.0" width="26" height="24" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2" />
      <path d="M 62.0 79.0 L 88.0 79.0 M 68.0 74.0 L 68.0 98.0 M 75.0 74.0 L 75.0 98.0 M 82.0 74.0 L 82.0 98.0" fill="none" stroke="#475569" stroke-width="1" />
      <text x="75.0" y="112.0" class="text-sub">Memory</text>
    </g>
    <g transform="translate(0, 0)">
      <path d="M 143.0 78.5 C 143.0 74.5 167.0 74.5 167.0 78.5 L 167.0 93.5 C 167.0 97.5 143.0 97.5 143.0 93.5 Z" fill="#ffffff" stroke="#475569" stroke-width="1.2" />
      <path d="M 143.0 78.5 C 143.0 82.5 167.0 82.5 167.0 78.5 M 143.0 83.5 C 143.0 87.5 167.0 87.5 167.0 83.5 M 143.0 88.5 C 143.0 92.5 167.0 92.5 167.0 88.5" fill="none" stroke="#475569" stroke-width="1" />
      <text x="155.0" y="112.0" class="text-sub">Storage</text>
    </g>
  </g>

  <!-- Instance 2 Card -->
  <g transform="translate(330, 20)">
    <rect width="230" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#inst-shadow)" />
    <g>
      <polygon points="120.9,26.3 115.0,29.7 109.1,26.3 109.1,19.4 115.0,16.0 120.9,19.4" fill="#ff6a00"/>
      <polygon points="114.1,38.0 108.2,41.4 102.3,38.0 102.3,31.2 108.2,27.8 114.1,31.2" fill="#ff6a00"/>
      <polygon points="127.7,38.0 121.8,41.4 115.9,38.0 115.9,31.2 121.8,27.8 127.7,31.2" fill="#ff6a00"/>
    </g>
    <text x="115" y="58" class="text-inst">RDS Instance 2</text>
    <g transform="translate(0, 0)">
      <rect x="62.0" y="74.0" width="26" height="24" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2" />
      <path d="M 62.0 79.0 L 88.0 79.0 M 68.0 74.0 L 68.0 98.0 M 75.0 74.0 L 75.0 98.0 M 82.0 74.0 L 82.0 98.0" fill="none" stroke="#475569" stroke-width="1" />
      <text x="75.0" y="112.0" class="text-sub">Memory</text>
    </g>
    <g transform="translate(0, 0)">
      <path d="M 143.0 78.5 C 143.0 74.5 167.0 74.5 167.0 78.5 L 167.0 93.5 C 167.0 97.5 143.0 97.5 143.0 93.5 Z" fill="#ffffff" stroke="#475569" stroke-width="1.2" />
      <path d="M 143.0 78.5 C 143.0 82.5 167.0 82.5 167.0 78.5 M 143.0 83.5 C 143.0 87.5 167.0 87.5 167.0 83.5 M 143.0 88.5 C 143.0 92.5 167.0 92.5 167.0 88.5" fill="none" stroke="#475569" stroke-width="1" />
      <text x="155.0" y="112.0" class="text-sub">Storage</text>
    </g>
  </g>

  <!-- Connecting Link Bars to Shared Resource Pool -->
  <path d="M 205 138 L 205 155 M 445 138 L 445 155" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Shared Resource Pool Bar -->
  <rect x="90" y="155" width="470" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#inst-shadow)" />
  <text x="325" y="179" class="text-bar">Highly Reused CPUs</text>
</svg>