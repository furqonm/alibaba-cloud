<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 378" width="100%" height="100%">
  <defs>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- BEFORE Box -->
  <g transform="translate(4, 4)" filter="url(#box-shadow)">
    <rect width="280" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="12" y="8" width="60" height="18" rx="4" fill="#0f172a"/>
    <text x="42" y="21" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">BEFORE</text>

    <!-- Scaling Group Container -->
    <rect x="12" y="32" width="256" height="116" rx="6" fill="#ffffff" stroke="#ff6a00" stroke-width="1.5"/>
    <text x="24" y="47" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#ea580c">Scaling Group</text>

    <!-- ECS Instance 1 -->
    <g transform="translate(24, 55)">
      <rect width="105" height="82" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="15" y="12" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="16" r="1.5" fill="#ffffff"/>
      <rect x="15" y="24" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="28" r="1.5" fill="#ffffff"/>
      <text x="52" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">ECS-01</text>
      <circle cx="28" cy="64" r="3.5" fill="#16a34a"/>
      <text x="36" y="67" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#15803d">Running</text>
    </g>

    <!-- ECS Instance 2 -->
    <g transform="translate(150, 55)">
      <rect width="105" height="82" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="15" y="12" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="16" r="1.5" fill="#ffffff"/>
      <rect x="15" y="24" width="40" height="8" rx="2" fill="#ff6a00"/>
      <circle cx="48" cy="28" r="1.5" fill="#ffffff"/>
      <text x="52" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">ECS-02</text>
      <circle cx="28" cy="64" r="3.5" fill="#16a34a"/>
      <text x="36" y="67" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#15803d">Running</text>
    </g>
  </g>

  <!-- Downward Arrow Transition -->
  <line x1="144" y1="164" x2="144" y2="203" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <polygon points="136,200 152,200 144,212" fill="#0284c7"/>
  <rect x="104" y="174" width="80" height="18" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="144" y="186" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">Scale-In</text>

  <!-- AFTER Box -->
  <g transform="translate(4, 214)" filter="url(#box-shadow)">
    <rect width="280" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="12" y="8" width="55" height="18" rx="4" fill="#0284c7"/>
    <text x="39" y="21" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">AFTER</text>

    <!-- Scaling Group Container -->
    <rect x="12" y="32" width="256" height="116" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="24" y="47" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#0284c7">Scaling Group</text>

    <!-- ECS Instance 1 (Stopped) -->
    <g transform="translate(24, 55)">
      <rect width="105" height="82" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="15" y="12" width="40" height="8" rx="2" fill="#94a3b8"/>
      <circle cx="48" cy="16" r="1.5" fill="#ffffff"/>
      <rect x="15" y="24" width="40" height="8" rx="2" fill="#94a3b8"/>
      <circle cx="48" cy="28" r="1.5" fill="#ffffff"/>
      <text x="52" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">ECS-01</text>
      <circle cx="28" cy="64" r="3.5" fill="#64748b"/>
      <text x="36" y="67" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#475569">Stopped</text>
    </g>

    <!-- ECS Instance 2 (Stopped) -->
    <g transform="translate(150, 55)">
      <rect width="105" height="82" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="15" y="12" width="40" height="8" rx="2" fill="#94a3b8"/>
      <circle cx="48" cy="16" r="1.5" fill="#ffffff"/>
      <rect x="15" y="24" width="40" height="8" rx="2" fill="#94a3b8"/>
      <circle cx="48" cy="28" r="1.5" fill="#ffffff"/>
      <text x="52" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">ECS-02</text>
      <circle cx="28" cy="64" r="3.5" fill="#64748b"/>
      <text x="36" y="67" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#475569">Stopped</text>
    </g>
  </g>
</svg>
