<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="100%">
  <defs>
    <filter id="dms-shadow" x="-5%" y="-4%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="dms-arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 1, 7 3.5, 0 6" fill="#ea580c"/>
    </marker>
    <linearGradient id="db-orange-cyl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="35%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- COLUMN 1: Personas (Left) -->
  <g transform="translate(20, 20)">
    <!-- Pill Header -->
    <rect x="0" y="0" width="100" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#dms-shadow)"/>
    <text x="50" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#475569">PERSONAS</text>

    <!-- 1. Operator -->
    <g transform="translate(0, 28)">
      <rect width="100" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#dms-shadow)"/>
      <circle cx="20" cy="21" r="5" fill="#ff6a00"/>
      <text x="56" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Operator</text>
    </g>

    <!-- 2. Developer -->
    <g transform="translate(0, 78)">
      <rect width="100" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#dms-shadow)"/>
      <circle cx="20" cy="21" r="5" fill="#ff6a00"/>
      <text x="56" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Developer</text>
    </g>

    <!-- 3. Tester -->
    <g transform="translate(0, 128)">
      <rect width="100" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#dms-shadow)"/>
      <circle cx="20" cy="21" r="5" fill="#ff6a00"/>
      <text x="56" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Tester</text>
    </g>

    <!-- 4. Auditor -->
    <g transform="translate(0, 178)">
      <rect width="100" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#dms-shadow)"/>
      <circle cx="20" cy="21" r="5" fill="#ff6a00"/>
      <text x="56" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Auditor</text>
    </g>

    <!-- 5. Intern -->
    <g transform="translate(0, 228)">
      <rect width="100" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#dms-shadow)"/>
      <circle cx="20" cy="21" r="5" fill="#ff6a00"/>
      <text x="56" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Intern</text>
    </g>
  </g>

  <!-- Connector from Personas to Input -->
  <path d="M 125 155 L 145 155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- COLUMN 2: Input Request Dimensions -->
  <g transform="translate(145, 20)">
    <rect width="145" height="270" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3" stroke-width="1.2" filter="url(#dms-shadow)"/>
    <text x="72" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Input</text>

    <!-- Dimension 1: Permission Type -->
    <g transform="translate(10, 30)">
      <rect width="125" height="65" rx="5" fill="#f1f5f9"/>
      <text x="62" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#475569">Permission Type</text>
      <rect x="8" y="24" width="34" height="16" rx="3" fill="#ff6a00"/>
      <text x="25" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">query</text>
      <rect x="46" y="24" width="36" height="16" rx="3" fill="#ff6a00"/>
      <text x="64" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">update</text>
      <rect x="86" y="24" width="32" height="16" rx="3" fill="#ff6a00"/>
      <text x="102" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">export</text>
    </g>

    <!-- Dimension 2: Permission Period -->
    <g transform="translate(10, 105)">
      <rect width="125" height="65" rx="5" fill="#f1f5f9"/>
      <text x="62" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#475569">Period (days)</text>
      <rect x="12" y="24" width="28" height="16" rx="3" fill="#ff6a00"/>
      <text x="26" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">7</text>
      <rect x="48" y="24" width="28" height="16" rx="3" fill="#ff6a00"/>
      <text x="62" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">30</text>
      <rect x="84" y="24" width="30" height="16" rx="3" fill="#ff6a00"/>
      <text x="99" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">365</text>
    </g>

    <!-- Dimension 3: Target Scope -->
    <g transform="translate(10, 180)">
      <rect width="125" height="75" rx="5" fill="#f1f5f9"/>
      <text x="62" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#475569">Permission Target</text>
      <rect x="8" y="24" width="46" height="16" rx="3" fill="#ff6a00"/>
      <text x="31" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">schema</text>
      <rect x="58" y="24" width="58" height="16" rx="3" fill="#ff6a00"/>
      <text x="87" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">column</text>
      <rect x="8" y="46" width="38" height="16" rx="3" fill="#ff6a00"/>
      <text x="27" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">table</text>
    </g>
  </g>

  <!-- Chevron Flow Indicator 1 -->
  <g transform="translate(300, 145)">
    <path d="M 0 0 L 8 10 L 0 20 M 8 0 L 16 10 L 8 20" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- COLUMN 3: DMS Unified Authorization Management System -->
  <g transform="translate(330, 20)">
    <rect width="330" height="270" rx="10" fill="#ffffff" stroke="#ff6a00" stroke-width="1.8" filter="url(#dms-shadow)"/>
    
    <!-- DMS Logo / Header -->
    <g transform="translate(165, 20)">
      <!-- DMS Icon -->
      <polygon points="0,-12 12,-4 0,4 -12,-4" fill="#ff6a00"/>
      <polygon points="0,-2 12,6 0,14 -12,6" fill="#ea580c"/>
    </g>
    <text x="165" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#c2410c">DMS Unified Authorization System</text>

    <!-- 4 Governance Capability Badges -->
    <g transform="translate(20, 60)">
      <!-- 1. Account Revoke -->
      <rect x="0" y="0" width="135" height="30" rx="4" fill="#ff6a00"/>
      <text x="67" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">Account Revoke</text>

      <!-- 2. Column Granularity -->
      <rect x="150" y="0" width="140" height="30" rx="4" fill="#ff6a00"/>
      <text x="220" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">Column Granularity</text>

      <!-- 3. Individual Account -->
      <rect x="0" y="40" width="135" height="30" rx="4" fill="#ff6a00"/>
      <text x="67" y="59" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">Individual Account</text>

      <!-- 4. Overdue Notification -->
      <rect x="150" y="40" width="140" height="30" rx="4" fill="#ff6a00"/>
      <text x="220" y="59" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">Overdue Notification</text>
    </g>

    <!-- Real-time Fine-grained SQL Grants Box -->
    <g transform="translate(15, 145)">
      <rect width="300" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#475569">Granular Automated SQL Grants (Audit Trail):</text>
      <text x="12" y="36" font-family="Consolas, monospace" font-size="8.5" fill="#ea580c">GRANT SELECT ON orders.trade_info TO 'user_dev'@'%';</text>
      <text x="12" y="52" font-family="Consolas, monospace" font-size="8.5" fill="#475569">GRANT SELECT (col_user_id) ON app.users TO 'auditor'@'%';</text>
      <text x="12" y="68" font-family="Consolas, monospace" font-size="8.5" fill="#0284c7">GRANT UPDATE ON prod_db.inventory TO 'operator'@'%';</text>
      <text x="12" y="84" font-family="Consolas, monospace" font-size="8.5" fill="#dc2626">REVOKE ALL PRIVILEGES ON *.* FROM 'temp_intern'@'%';</text>
      <text x="12" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-style="italic" fill="#64748b">• 100% SQL logging, automated expiration &amp; dynamic masking</text>
    </g>
  </g>

  <!-- Chevron Flow Indicator 2 -->
  <g transform="translate(675, 145)">
    <path d="M 0 0 L 8 10 L 0 20 M 8 0 L 16 10 L 8 20" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- COLUMN 4: Delegated Target Databases -->
  <g transform="translate(705, 20)">
    <!-- Pill Header -->
    <rect x="25" y="0" width="160" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#dms-shadow)"/>
    <text x="105" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#475569">TARGET DATABASES</text>

    <!-- DB 1 -->
    <g transform="translate(0, 28)">
      <rect width="210" height="68" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2" filter="url(#dms-shadow)"/>
      <g transform="translate(20, 16)">
        <path d="M 0 10 A 18 6 0 0 0 36 10 L 36 26 A 18 6 0 0 1 0 26 Z" fill="url(#db-orange-cyl)"/>
        <ellipse cx="18" cy="10" rx="18" ry="6" fill="#fb923c"/>
      </g>
      <text x="65" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Production DB</text>
      <text x="65" y="44" font-family="Consolas, monospace" font-size="9" font-weight="700" fill="#ea580c">GRANT ALL ON * TO DMS</text>
    </g>

    <!-- DB 2 -->
    <g transform="translate(0, 110)">
      <rect width="210" height="68" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2" filter="url(#dms-shadow)"/>
      <g transform="translate(20, 16)">
        <path d="M 0 10 A 18 6 0 0 0 36 10 L 36 26 A 18 6 0 0 1 0 26 Z" fill="url(#db-orange-cyl)"/>
        <ellipse cx="18" cy="10" rx="18" ry="6" fill="#fb923c"/>
      </g>
      <text x="65" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Staging &amp; Test DB</text>
      <text x="65" y="44" font-family="Consolas, monospace" font-size="9" font-weight="700" fill="#ea580c">GRANT ALL ON * TO DMS</text>
    </g>

    <!-- DB 3 -->
    <g transform="translate(0, 192)">
      <rect width="210" height="68" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2" filter="url(#dms-shadow)"/>
      <g transform="translate(20, 16)">
        <path d="M 0 10 A 18 6 0 0 0 36 10 L 36 26 A 18 6 0 0 1 0 26 Z" fill="url(#db-orange-cyl)"/>
        <ellipse cx="18" cy="10" rx="18" ry="6" fill="#fb923c"/>
      </g>
      <text x="65" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Analytics Warehouse</text>
      <text x="65" y="44" font-family="Consolas, monospace" font-size="9" font-weight="700" fill="#ea580c">GRANT ALL ON * TO DMS</text>
    </g>
  </g>
</svg>