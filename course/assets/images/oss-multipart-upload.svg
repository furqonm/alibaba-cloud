<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="auto">
  <defs>
    <filter id="shadow-soft" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-card" x="-4%" y="-5%" width="108%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B" />
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- ==================== LEFT: CLIENT ENVIRONMENT ==================== -->
    <g filter="url(#shadow-soft)">
      <!-- Outer Card -->
      <rect x="30" y="25" width="255" height="410" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
      <!-- Banner -->
      <rect x="30" y="25" width="255" height="38" rx="12" fill="#F0F9FF" />
      <rect x="30" y="51" width="255" height="12" fill="#F0F9FF" />
      <!-- Client Icon -->
      <rect x="45" y="36" width="16" height="12" rx="2" fill="none" stroke="#0284C7" stroke-width="1.5" />
      <line x1="43" y1="50" x2="63" y2="50" stroke="#0284C7" stroke-width="1.5" />
      <text x="70" y="49" font-size="13" font-weight="800" fill="#0369A1">Client Application</text>

      <!-- 1. Original Large Object -->
      <g filter="url(#shadow-card)">
        <rect x="45" y="75" width="225" height="58" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" />
        <text x="157" y="98" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Original Large Object</text>
        <text x="157" y="116" font-size="10.5" font-family="'Consolas', monospace" font-weight="600" fill="#64748B" text-anchor="middle">Single File (e.g. 50 GB)</text>
      </g>

      <!-- Downward Split Indicator -->
      <g transform="translate(157, 137)">
        <line x1="0" y1="0" x2="0" y2="16" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />
        <rect x="-45" y="4" width="90" height="16" rx="8" fill="#E0F2FE" />
        <text x="0" y="15" font-size="8.5" font-weight="700" fill="#0369A1" text-anchor="middle">Split into Parts</text>
      </g>

      <!-- 2. Delineated Parts Container -->
      <rect x="45" y="170" width="225" height="165" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="157" y="190" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Delineated Parts</text>

      <!-- Part 1 -->
      <rect x="55" y="202" width="100" height="36" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
      <text x="105" y="218" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Part 1</text>
      <text x="105" y="231" font-size="8.5" font-weight="500" fill="#64748B" text-anchor="middle">100 MB</text>

      <!-- Part 2 -->
      <rect x="160" y="202" width="100" height="36" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
      <text x="210" y="218" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Part 2</text>
      <text x="210" y="231" font-size="8.5" font-weight="500" fill="#64748B" text-anchor="middle">100 MB</text>

      <!-- Part 3 -->
      <rect x="55" y="246" width="100" height="36" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
      <text x="105" y="262" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Part 3</text>
      <text x="105" y="275" font-size="8.5" font-weight="500" fill="#64748B" text-anchor="middle">100 MB</text>

      <!-- Part N -->
      <rect x="160" y="246" width="100" height="36" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
      <text x="210" y="262" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Part N</text>
      <text x="210" y="275" font-size="8.5" font-weight="500" fill="#64748B" text-anchor="middle">Final Chunk</text>

      <text x="157" y="306" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">100 KB to 5 GB per part</text>
      <text x="157" y="322" font-size="8.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Up to 10,000 parts</text>

      <!-- Resumability Badge -->
      <rect x="45" y="352" width="225" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="157" y="371" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Network error? Retry failed part only</text>
    </g>

    <!-- ==================== CENTER: API SEQUENCE & STREAMS ==================== -->
    <g>
      <!-- STEP 1: INITIATE -->
      <g>
        <!-- Arrow Client -> OSS -->
        <line x1="285" y1="75" x2="670" y2="75" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrow-blue)" />
        <g filter="url(#shadow-card)">
          <rect x="350" y="58" width="265" height="34" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
          <text x="482" y="79" font-size="12" font-weight="800" fill="#0369A1" text-anchor="middle">1. InitiateMultipartUpload</text>
        </g>

        <!-- Dashed Return Arrow OSS -> Client -->
        <line x1="670" y1="112" x2="295" y2="112" stroke="#16A34A" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-green)" />
        <g filter="url(#shadow-card)">
          <rect x="382" y="100" width="200" height="24" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
          <text x="482" y="116" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">Returns unique Upload ID</text>
        </g>
      </g>

      <!-- STEP 2: UPLOADPART (PARALLEL STREAMS) -->
      <g>
        <g filter="url(#shadow-card)">
          <rect x="345" y="165" width="275" height="34" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" />
          <text x="482" y="186" font-size="12" font-weight="800" fill="#C2410C" text-anchor="middle">2. UploadPart (Parallel Streams)</text>
        </g>

        <!-- Parallel Stream 1 -->
        <line x1="285" y1="215" x2="670" y2="215" stroke="#EA580C" stroke-width="2" marker-end="url(#arrow-orange)" />
        <rect x="420" y="206" width="125" height="18" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
        <text x="482" y="219" font-size="9.5" font-weight="600" fill="#EA580C" text-anchor="middle">Part 1 Stream ➔</text>

        <!-- Parallel Stream 2 -->
        <line x1="285" y1="245" x2="670" y2="245" stroke="#EA580C" stroke-width="2" marker-end="url(#arrow-orange)" />
        <rect x="420" y="236" width="125" height="18" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
        <text x="482" y="249" font-size="9.5" font-weight="600" fill="#EA580C" text-anchor="middle">Part 2 Stream ➔</text>

        <!-- Parallel Stream 3 -->
        <line x1="285" y1="275" x2="670" y2="275" stroke="#EA580C" stroke-width="2" marker-end="url(#arrow-orange)" />
        <rect x="420" y="266" width="125" height="18" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
        <text x="482" y="279" font-size="9.5" font-weight="600" fill="#EA580C" text-anchor="middle">Part 3 Stream ➔</text>

        <!-- Parallel Stream N -->
        <line x1="285" y1="305" x2="670" y2="305" stroke="#EA580C" stroke-width="2" marker-end="url(#arrow-orange)" />
        <rect x="420" y="296" width="125" height="18" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
        <text x="482" y="309" font-size="9.5" font-weight="600" fill="#EA580C" text-anchor="middle">Part N Stream ➔</text>
      </g>

      <!-- STEP 3: COMPLETE -->
      <g>
        <line x1="285" y1="375" x2="670" y2="375" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-green)" />
        <g filter="url(#shadow-card)">
          <rect x="335" y="358" width="295" height="34" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" />
          <text x="482" y="379" font-size="12" font-weight="800" fill="#15803D" text-anchor="middle">3. CompleteMultipartUpload</text>
        </g>
        <text x="482" y="405" font-size="9.5" font-weight="500" fill="#64748B" text-anchor="middle">Sends Part Numbers &amp; ETags to assemble object</text>
      </g>
    </g>

    <!-- ==================== RIGHT: ALIBABA CLOUD OSS ==================== -->
    <g filter="url(#shadow-soft)">
      <!-- Outer Card -->
      <rect x="675" y="25" width="255" height="410" rx="12" fill="#FFFFFF" stroke="#FF6A00" stroke-width="1.5" />
      <!-- Banner -->
      <rect x="675" y="25" width="255" height="38" rx="12" fill="#FFF7ED" />
      <rect x="675" y="51" width="255" height="12" fill="#FFF7ED" />
      
      <!-- Official OSS Icon -->
      <g transform="translate(692, 34) scale(0.65)">
        <path d="M 178 93 L 192 93 L 192 105 L 184.03 109.47 L 181.72 108.04 L 178 104 Z" fill="#FFFFFF" />
        <path d="M 189.64 82.46 C 183.01 82.46 177.46 87.03 175.96 93.18 C 175.82 93.17 175.68 93.17 175.55 93.17 C 170.73 93.17 166.83 97.08 166.83 101.89 C 166.83 104.21 167.75 106.42 169.39 108.05 C 171.02 109.69 173.24 110.6 175.55 110.6 C 177.86 110.6 180.08 109.68 181.72 108.04 C 183.09 106.66 183.85 104.83 184.07 102.8 L 180.91 102.56 C 180.2 102.47 179.97 101.92 180.4 101.35 L 185.76 94.73 C 186.19 94.15 186.78 94.23 187.06 94.89 L 190.09 102.3 C 190.37 102.97 190.01 103.44 189.3 103.35 L 186.94 103.13 C 186.69 105.59 185.58 107.76 184.03 109.47 C 185.8 110.24 187.71 110.64 189.64 110.63 C 197.42 110.63 203.72 104.32 203.72 96.55 C 203.72 88.77 197.42 82.47 189.64 82.47 Z" fill="#FF6A00" transform="translate(-164, -79)" />
      </g>
      <text x="722" y="49" font-size="13" font-weight="800" fill="#C2410C">Alibaba Cloud OSS</text>

      <!-- 1. Staged Parts Container -->
      <rect x="690" y="75" width="225" height="170" rx="8" fill="#FFFBF5" stroke="#FED7AA" stroke-width="1.5" />
      <text x="802" y="96" font-size="11" font-weight="700" fill="#9A3412" text-anchor="middle">Parts Staged in Bucket</text>

      <!-- Staged Part 1 -->
      <rect x="700" y="108" width="100" height="34" rx="5" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5" />
      <text x="750" y="124" font-size="10.5" font-weight="700" fill="#C2410C" text-anchor="middle">Part 1</text>
      <text x="750" y="136" font-size="8.5" font-family="'Consolas', monospace" fill="#64748B" text-anchor="middle">ETag: a1b2...</text>

      <!-- Staged Part 2 -->
      <rect x="805" y="108" width="100" height="34" rx="5" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5" />
      <text x="855" y="124" font-size="10.5" font-weight="700" fill="#C2410C" text-anchor="middle">Part 2</text>
      <text x="855" y="136" font-size="8.5" font-family="'Consolas', monospace" fill="#64748B" text-anchor="middle">ETag: c3d4...</text>

      <!-- Staged Part 3 -->
      <rect x="700" y="150" width="100" height="34" rx="5" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5" />
      <text x="750" y="166" font-size="10.5" font-weight="700" fill="#C2410C" text-anchor="middle">Part 3</text>
      <text x="750" y="178" font-size="8.5" font-family="'Consolas', monospace" fill="#64748B" text-anchor="middle">ETag: e5f6...</text>

      <!-- Staged Part N -->
      <rect x="805" y="150" width="100" height="34" rx="5" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5" />
      <text x="855" y="166" font-size="10.5" font-weight="700" fill="#C2410C" text-anchor="middle">Part N</text>
      <text x="855" y="178" font-size="8.5" font-family="'Consolas', monospace" fill="#64748B" text-anchor="middle">ETag: 7890...</text>

      <text x="802" y="202" font-size="9" font-weight="600" fill="#78350F" text-anchor="middle">Indexed by Upload ID</text>
      <text x="802" y="216" font-size="8.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Staged independently</text>
      <rect x="700" y="224" width="205" height="15" rx="3" fill="#FEF3C7" />
      <text x="802" y="235" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle">Auto-abort via lifecycle to prevent leaks</text>

      <!-- Downward Merge Indicator -->
      <g transform="translate(802, 250)">
        <line x1="0" y1="0" x2="0" y2="18" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
        <rect x="-45" y="4" width="90" height="16" rx="8" fill="#DCFCE7" />
        <text x="0" y="15" font-size="8.5" font-weight="700" fill="#15803D" text-anchor="middle">Assemble Object</text>
      </g>

      <!-- 2. Final Unified Object -->
      <g filter="url(#shadow-card)">
        <rect x="690" y="280" width="225" height="85" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" />
        <text x="802" y="303" font-size="12" font-weight="800" fill="#15803D" text-anchor="middle">Final Unified Object</text>
        <text x="802" y="321" font-size="10.5" font-family="'Consolas', monospace" font-weight="600" fill="#166534" text-anchor="middle">Single Object (Up to 48.8 TB)</text>
        
        <rect x="705" y="332" width="195" height="22" rx="4" fill="#DCFCE7" />
        <text x="802" y="347" font-size="9.5" font-weight="700" fill="#15803D" text-anchor="middle">✔ Complete &amp; Persistent in Bucket</text>
      </g>

      <!-- Storage Backend Note -->
      <rect x="690" y="375" width="225" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="802" y="394" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Stitched seamlessly in underlying Pangu</text>
    </g>
  </g>
</svg>
