<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="auto">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff6a00"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Card shadow -->
    <filter id="shadow-card" x="-4%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Transparent Canvas Background -->
  <rect width="540" height="380" fill="none"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    
    <!-- ==================== LEFT COLUMN: UNBIND / ECS 1 ==================== -->
    <g transform="translate(30, 20)">
      <!-- Top Card: EIP (Detached/Unbinding) -->
      <g filter="url(#shadow-card)">
        <rect x="0" y="0" width="190" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5,4"/>
        <text x="95" y="26" text-anchor="middle" font-size="14" font-weight="800" fill="#64748b">EIP</text>
        
        <!-- EIP Vector Graphic (Network Globe) -->
        <g transform="translate(95, 58)">
          <circle cx="0" cy="0" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
          <ellipse cx="0" cy="0" rx="9" ry="18" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
          <line x1="-18" y1="0" x2="18" y2="0" stroke="#94a3b8" stroke-width="1.4"/>
          <line x1="0" y1="-18" x2="0" y2="18" stroke="#94a3b8" stroke-width="1.4"/>
        </g>
      </g>

      <!-- Downward Arrow to ENI (Dashed / Unbinding) -->
      <line x1="95" y1="96" x2="95" y2="135" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-gray)"/>

      <!-- Middle Card: ENI & Private IP -->
      <g transform="translate(0, 140)" filter="url(#shadow-card)">
        <rect x="0" y="0" width="190" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
        <text x="95" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">ENI</text>
        
        <!-- Private IP Pill -->
        <rect x="25" y="34" width="140" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="95" y="53" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Private IP</text>
      </g>

      <!-- Downward Line to ECS 1 -->
      <line x1="95" y1="214" x2="95" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>

      <!-- Bottom Server: ECS 1 -->
      <g transform="translate(0, 255)" filter="url(#shadow-card)">
        <rect x="0" y="0" width="190" height="78" rx="8" fill="#ffffff" stroke="#ff6a00" stroke-width="2"/>
        <!-- Server Accent Header -->
        <rect x="0" y="0" width="190" height="26" rx="8" fill="#ff6a00"/>
        <rect x="0" y="16" width="190" height="10" fill="#ff6a00"/>
        
        <!-- Server Faceplate Elements -->
        <circle cx="16" cy="13" r="3.5" fill="#ffffff"/>
        <circle cx="28" cy="13" r="3.5" fill="#ffffff" opacity="0.6"/>
        <line x1="130" y1="13" x2="175" y2="13" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        
        <!-- Server Label -->
        <text x="95" y="58" text-anchor="middle" font-size="16" font-weight="800" fill="#ff6a00">ECS 1</text>
      </g>
    </g>

    <!-- ==================== MIDDLE: MIGRATION ARROW ==================== -->
    <g transform="translate(220, 68)">
      <!-- Smooth Rebind Arrow from Left to Right -->
      <path d="M 15 0 L 85 0" stroke="#ff6a00" stroke-width="3" marker-end="url(#arrow-orange)"/>
    </g>

    <!-- ==================== RIGHT COLUMN: BIND / ECS 2 ==================== -->
    <g transform="translate(320, 20)">
      <!-- Top Card: EIP (Bound / Active) -->
      <g filter="url(#shadow-card)">
        <rect x="0" y="0" width="190" height="96" rx="8" fill="#ffffff" stroke="#ff6a00" stroke-width="2"/>
        <text x="95" y="26" text-anchor="middle" font-size="14" font-weight="800" fill="#ff6a00">EIP</text>
        
        <!-- EIP Vector Graphic (Active Network Globe) -->
        <g transform="translate(95, 58)">
          <circle cx="0" cy="0" r="18" fill="#fff7ed" stroke="#ff6a00" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="9" ry="18" fill="none" stroke="#ff6a00" stroke-width="1.5"/>
          <line x1="-18" y1="0" x2="18" y2="0" stroke="#ff6a00" stroke-width="1.5"/>
          <line x1="0" y1="-18" x2="0" y2="18" stroke="#ff6a00" stroke-width="1.5"/>
        </g>
      </g>

      <!-- Downward Arrow to ENI (Solid Orange Active Binding) -->
      <line x1="95" y1="96" x2="95" y2="135" stroke="#ff6a00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

      <!-- Middle Card: ENI & Private IP -->
      <g transform="translate(0, 140)" filter="url(#shadow-card)">
        <rect x="0" y="0" width="190" height="74" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
        <text x="95" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0284c7">ENI</text>
        
        <!-- Private IP Pill -->
        <rect x="25" y="34" width="140" height="28" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="95" y="53" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">Private IP</text>
      </g>

      <!-- Downward Line to ECS 2 -->
      <line x1="95" y1="214" x2="95" y2="250" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <!-- Bottom Server: ECS 2 -->
      <g transform="translate(0, 255)" filter="url(#shadow-card)">
        <rect x="0" y="0" width="190" height="78" rx="8" fill="#ffffff" stroke="#ff6a00" stroke-width="2"/>
        <!-- Server Accent Header -->
        <rect x="0" y="0" width="190" height="26" rx="8" fill="#ff6a00"/>
        <rect x="0" y="16" width="190" height="10" fill="#ff6a00"/>
        
        <!-- Server Faceplate Elements -->
        <circle cx="16" cy="13" r="3.5" fill="#ffffff"/>
        <circle cx="28" cy="13" r="3.5" fill="#ffffff" opacity="0.6"/>
        <line x1="130" y1="13" x2="175" y2="13" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        
        <!-- Server Label -->
        <text x="95" y="58" text-anchor="middle" font-size="16" font-weight="800" fill="#ff6a00">ECS 2</text>
      </g>
    </g>

  </g>
</svg>
