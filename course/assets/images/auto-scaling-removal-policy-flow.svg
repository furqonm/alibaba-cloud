<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff6a00"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title & Subtitle -->
  <text x="40" y="36" font-family="Segoe UI, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Alibaba Cloud ESS — Instance Removal Decision Flow</text>
  <text x="40" y="54" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">Scale-in evaluation sequence for evicting ECS instances across Multi-Zone vSwitches</text>

  <!-- ==================== LEFT COLUMN: DECISION FLOW ==================== -->

  <!-- STEP 1: Scale-In Trigger -->
  <g transform="translate(80, 72)" filter="url(#card-shadow)">
    <rect width="460" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <circle cx="24" cy="22" r="12" fill="#ff6a00"/>
    <path d="M 24 14 L 21 22 L 25 22 L 23 30 L 28 21 L 24 21 Z" fill="#ffffff"/>
    <text x="48" y="20" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Scale-In Activity Triggered</text>
    <text x="48" y="34" font-family="Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#c2410c">CloudMonitor alarm threshold, scheduled timer, or API trigger</text>
  </g>

  <!-- Arrow Step 1 -> Step 2 -->
  <line x1="310" y1="116" x2="310" y2="138" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- STEP 2: Multi-Zone vSwitch Balance Check -->
  <g transform="translate(80, 140)" filter="url(#card-shadow)">
    <rect width="460" height="54" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#0284c7"/>
    <path d="M 18 26 L 26 18 L 34 26 L 26 34 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="50" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0369a1">1. Multi-Zone / vSwitch Balance Check</text>
    <text x="50" y="41" font-family="Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#0284c7">Select zone or vSwitch with the LARGEST number of ECS instances</text>
  </g>

  <!-- Arrow Step 2 -> Step 3 -->
  <line x1="310" y1="194" x2="310" y2="222" stroke="#ff6a00" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- STEP 3: RemovalPolicy.1 -->
  <g transform="translate(80, 224)" filter="url(#card-shadow)">
    <rect width="460" height="64" rx="8" fill="#ffffff" stroke="#ff6a00" stroke-width="2"/>
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#ff6a00"/>
    <text x="26" y="33" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">P1</text>
    <text x="50" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a">2. Evaluate RemovalPolicy.1</text>
    <text x="50" y="40" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#d97706">OldestScalingConfiguration | OldestInstance | NewestInstance</text>
    <text x="50" y="54" font-family="Segoe UI, sans-serif" font-size="10" font-weight="500" fill="#64748b">Filters instances according to primary policy</text>
  </g>

  <!-- Branching from Step 3: Single Match (Right) -->
  <line x1="540" y1="256" x2="625" y2="256" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="545" y="242" width="75" height="16" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="582" y="254" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">1 Match</text>

  <!-- Branching from Step 3: Multiple Matches (Down) -->
  <line x1="310" y1="288" x2="310" y2="322" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange)"/>
  <rect x="265" y="294" width="90" height="16" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="310" y="306" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#c2410c" text-anchor="middle">Tie (Multiple)</text>

  <!-- STEP 4: RemovalPolicy.2 (Tie-Breaker) -->
  <g transform="translate(80, 324)" filter="url(#card-shadow)">
    <rect width="460" height="64" rx="8" fill="#ffffff" stroke="#ff6a00" stroke-width="2"/>
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#f97316"/>
    <text x="26" y="33" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">P2</text>
    <text x="50" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a">3. Evaluate RemovalPolicy.2 (Tie-Breaker)</text>
    <text x="50" y="40" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#ea580c">OldestInstance | NewestInstance | OldestScalingConfiguration</text>
    <text x="50" y="54" font-family="Segoe UI, sans-serif" font-size="10" font-weight="500" fill="#64748b">Secondary filter applied to candidates that tied under Policy 1</text>
  </g>

  <!-- Branching from Step 4: Single Match (Right) -->
  <line x1="540" y1="356" x2="625" y2="356" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="545" y="342" width="75" height="16" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="582" y="354" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">1 Match</text>

  <!-- Branching from Step 4: Multiple Matches (Down) -->
  <line x1="310" y1="388" x2="310" y2="422" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate)"/>
  <rect x="265" y="394" width="90" height="16" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="310" y="406" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">Tie (Multiple)</text>

  <!-- STEP 5: Random Selection -->
  <g transform="translate(80, 424)" filter="url(#card-shadow)">
    <rect width="460" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="12" y="8" width="28" height="28" rx="6" fill="#64748b"/>
    <circle cx="20" cy="16" r="2" fill="#ffffff"/>
    <circle cx="26" cy="22" r="2" fill="#ffffff"/>
    <circle cx="32" cy="28" r="2" fill="#ffffff"/>
    <text x="50" y="20" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e293b">4. Random Selection (Final Tie-Breaker)</text>
    <text x="50" y="34" font-family="Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#64748b">Randomly selects an instance among remaining candidates</text>
  </g>

  <!-- Branching from Step 5: Selected (Right) -->
  <line x1="540" y1="446" x2="625" y2="446" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="545" y="432" width="75" height="16" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="582" y="444" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">Selected</text>

  <!-- Bus line connecting Right Arrows into Action Box -->
  <line x1="630" y1="256" x2="630" y2="446" stroke="#10b981" stroke-width="2"/>
  <line x1="630" y1="285" x2="660" y2="285" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- ==================== RIGHT COLUMN: EXECUTION & RECLAIM CARD ==================== -->
  <g transform="translate(660, 72)" filter="url(#card-shadow)">
    <rect width="260" height="396" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 0 10 Q 0 0 10 0 L 250 0 Q 260 0 260 10 L 260 42 L 0 42 Z" fill="#1e293b"/>
    <text x="130" y="26" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Deregister &amp; Reclaim Action</text>

    <!-- Substep 1: SLB Connection Draining -->
    <g transform="translate(15, 56)">
      <rect width="230" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <!-- SLB Mini Icon -->
      <circle cx="24" cy="24" r="12" fill="#ff6a00"/>
      <circle cx="24" cy="19" r="2.5" fill="#ffffff"/>
      <circle cx="19" cy="28" r="2.5" fill="#ffffff"/>
      <circle cx="29" cy="28" r="2.5" fill="#ffffff"/>
      <text x="44" y="20" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1. SLB Deregistration</text>
      <text x="44" y="36" font-family="Segoe UI, sans-serif" font-size="10" font-weight="500" fill="#64748b">Removes backend server</text>
      <text x="14" y="56" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#ea580c">• In-flight connections drained</text>
      <text x="14" y="68" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#ea580c">• Zero traffic drop guaranteed</text>
    </g>

    <!-- Substep 2: RDS Security Whitelist -->
    <g transform="translate(15, 142)">
      <rect width="230" height="68" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <!-- RDS Mini Icon -->
      <circle cx="24" cy="22" r="12" fill="#0284c7"/>
      <rect x="18" y="16" width="12" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="18" y1="20" x2="30" y2="20" stroke="#ffffff" stroke-width="1"/>
      <text x="44" y="20" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2. RDS Whitelist Prune</text>
      <text x="44" y="36" font-family="Segoe UI, sans-serif" font-size="10" font-weight="500" fill="#64748b">Removes private IP address</text>
      <text x="14" y="56" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#0284c7">• Database access revoked</text>
    </g>

    <!-- Substep 3: Instance Reclaim -->
    <g transform="translate(15, 220)">
      <rect width="230" height="162" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">3. Reclaim Mode Execution</text>
      <text x="14" y="38" font-family="Segoe UI, sans-serif" font-size="10" font-weight="500" fill="#15803d">Applies group Reclaim Mode:</text>

      <!-- Option A -->
      <rect x="12" y="46" width="206" height="48" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="62" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Option A: Release Mode</text>
      <text x="20" y="76" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="500" fill="#475569">Permanently terminates &amp; deletes</text>
      <text x="20" y="88" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="600" fill="#059669">Immediate cost termination</text>

      <!-- Option B -->
      <rect x="12" y="102" width="206" height="48" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="118" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0369a1">Option B: Shutdown Mode</text>
      <text x="20" y="132" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="500" fill="#475569">Stops VM (No-Fee When Stopped)</text>
      <text x="20" y="144" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="600" fill="#0284c7">Instant warm-restart ready</text>
    </g>
  </g>
</svg>