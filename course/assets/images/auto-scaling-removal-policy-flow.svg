<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 455" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff6a00"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="455" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== LEFT COLUMN: DECISION FLOW ==================== -->

  <!-- STEP 1: Scale-In Trigger (Title Only) -->
  <g transform="translate(45, 25)" filter="url(#card-shadow)">
    <rect width="470" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <circle cx="28" cy="25" r="13" fill="#ff6a00"/>
    <path d="M 28 16 L 24 25 L 29 25 L 26 34 L 33 24 L 28 24 Z" fill="#ffffff"/>
    <text x="54" y="30" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#9a3412">Scale-In Activity Triggered</text>
  </g>

  <!-- Arrow Step 1 -> Step 2 -->
  <line x1="280" y1="75" x2="280" y2="103" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- STEP 2: Multi-Zone vSwitch Balance Check (Title Only) -->
  <g transform="translate(45, 105)" filter="url(#card-shadow)">
    <rect width="470" height="50" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <rect x="14" y="11" width="28" height="28" rx="6" fill="#0284c7"/>
    <path d="M 20 25 L 28 17 L 36 25 L 28 33 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="54" y="30" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0369a1">1. Multi-Zone / vSwitch Balance Check</text>
  </g>

  <!-- Arrow Step 2 -> Step 3 -->
  <line x1="280" y1="155" x2="280" y2="183" stroke="#ff6a00" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- STEP 3: RemovalPolicy.1 (Title + Subtitle Only) -->
  <g transform="translate(45, 185)" filter="url(#card-shadow)">
    <rect width="470" height="62" rx="8" fill="#ffffff" stroke="#ff6a00" stroke-width="2"/>
    <rect x="14" y="17" width="28" height="28" rx="6" fill="#ff6a00"/>
    <text x="28" y="36" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">P1</text>
    <text x="54" y="27" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f172a">2. Evaluate RemovalPolicy.1</text>
    <text x="54" y="46" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#d97706">OldestScalingConfiguration | OldestInstance | NewestInstance</text>
  </g>

  <!-- Branching from Step 3: Single Match (Right) -->
  <line x1="515" y1="216" x2="602" y2="216" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="522" y="202" width="75" height="16" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="559.5" y="214" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">1 Match</text>

  <!-- Branching from Step 3: Multiple Matches (Down) -->
  <line x1="280" y1="247" x2="280" y2="283" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange)"/>
  <rect x="235" y="255" width="90" height="16" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="280" y="267" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#c2410c" text-anchor="middle">Tie (Multiple)</text>

  <!-- STEP 4: RemovalPolicy.2 (Title + Subtitle Only) -->
  <g transform="translate(45, 285)" filter="url(#card-shadow)">
    <rect width="470" height="62" rx="8" fill="#ffffff" stroke="#ff6a00" stroke-width="2"/>
    <rect x="14" y="17" width="28" height="28" rx="6" fill="#f97316"/>
    <text x="28" y="36" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">P2</text>
    <text x="54" y="27" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f172a">3. Evaluate RemovalPolicy.2 (Tie-Breaker)</text>
    <text x="54" y="46" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#ea580c">OldestInstance | NewestInstance | OldestScalingConfiguration</text>
  </g>

  <!-- Branching from Step 4: Single Match (Right) -->
  <line x1="515" y1="316" x2="602" y2="316" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="522" y="302" width="75" height="16" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="559.5" y="314" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">1 Match</text>

  <!-- Branching from Step 4: Multiple Matches (Down) -->
  <line x1="280" y1="347" x2="280" y2="378" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate)"/>
  <rect x="235" y="353" width="90" height="16" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="280" y="365" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">Tie (Multiple)</text>

  <!-- STEP 5: Random Selection (Title Only) -->
  <g transform="translate(45, 380)" filter="url(#card-shadow)">
    <rect width="470" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="14" y="11" width="28" height="28" rx="6" fill="#64748b"/>
    <circle cx="22" cy="19" r="2" fill="#ffffff"/>
    <circle cx="28" cy="25" r="2" fill="#ffffff"/>
    <circle cx="34" cy="31" r="2" fill="#ffffff"/>
    <text x="54" y="30" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e293b">4. Random Selection (Final Tie-Breaker)</text>
  </g>

  <!-- Branching from Step 5: Selected (Right) -->
  <line x1="515" y1="405" x2="602" y2="405" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="522" y="391" width="75" height="16" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="559.5" y="403" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">Selected</text>

  <!-- Bus line connecting Right Arrows into Action Box -->
  <line x1="607" y1="216" x2="607" y2="405" stroke="#10b981" stroke-width="2.5"/>
  <line x1="607" y1="310" x2="635" y2="310" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- ==================== RIGHT COLUMN: ACTION CARD (TITLES ONLY) ==================== -->
  <g transform="translate(640, 185)" filter="url(#card-shadow)">
    <rect width="235" height="245" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 0 10 Q 0 0 10 0 L 225 0 Q 235 0 235 10 L 235 42 L 0 42 Z" fill="#1e293b"/>
    <text x="117.5" y="27" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Action</text>

    <!-- Action 1: SLB Deregistration (Title Only) -->
    <g transform="translate(15, 58)">
      <rect width="205" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="24" cy="25" r="12" fill="#ff6a00"/>
      <circle cx="24" cy="20" r="2.5" fill="#ffffff"/>
      <circle cx="19" cy="29" r="2.5" fill="#ffffff"/>
      <circle cx="29" cy="29" r="2.5" fill="#ffffff"/>
      <text x="44" y="29" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">1. SLB Deregistration</text>
    </g>

    <!-- Action 2: RDS Whitelist Prune (Title Only) -->
    <g transform="translate(15, 120)">
      <rect width="205" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="24" cy="25" r="12" fill="#0284c7"/>
      <rect x="18" y="19" width="12" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="18" y1="23" x2="30" y2="23" stroke="#ffffff" stroke-width="1"/>
      <text x="44" y="29" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">2. RDS Whitelist Prune</text>
    </g>

    <!-- Action 3: Remove ECS Instance (Title Only, no Reclaim Mode mention) -->
    <g transform="translate(15, 182)">
      <rect width="205" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <circle cx="24" cy="25" r="12" fill="#16a34a"/>
      <rect x="17" y="19" width="14" height="5" rx="1" fill="#ffffff"/>
      <rect x="17" y="26" width="14" height="5" rx="1" fill="#ffffff"/>
      <text x="44" y="29" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#166534">3. Remove ECS Instance</text>
    </g>
  </g>
</svg>