<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <filter id="secShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="sGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="sRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="840" height="460" fill="#f8fafc" rx="12"/>

  <text x="420" y="30" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Edge Defense-in-Depth &amp; Origin Protection Architecture</text>

  <!-- Left: Traffic Ingress -->
  <g transform="translate(30, 60)">
    <rect width="130" height="360" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#secShadow)"/>
    <rect width="130" height="38" rx="10" fill="#f1f5f9"/>
    <text x="65" y="24" fill="#334155" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Public Ingress</text>

    <g transform="translate(10, 60)">
      <rect width="110" height="75" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
      <text x="55" y="20" fill="#065f46" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">✔ Clean Users</text>
      <text x="55" y="38" fill="#047857" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Valid Browsers</text>
      <text x="55" y="52" fill="#047857" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Mobile Apps</text>
      <text x="55" y="66" fill="#059669" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Legitimate Traffic</text>
    </g>

    <g transform="translate(10, 160)">
      <rect width="110" height="90" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
      <text x="55" y="20" fill="#991b1b" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">✖ Threat Actors</text>
      <text x="55" y="38" fill="#b91c1c" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">DDoS Botnets</text>
      <text x="55" y="52" fill="#b91c1c" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Content Leeches</text>
      <text x="55" y="66" fill="#b91c1c" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">SQLi / XSS Scanners</text>
      <text x="55" y="80" fill="#dc2626" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">CC Attack Floods</text>
    </g>

    <g transform="translate(10, 275)">
      <rect width="110" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="55" y="20" fill="#475569" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">First Touchpoint</text>
      <text x="55" y="38" fill="#64748b" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Never touches origin</text>
      <text x="55" y="52" fill="#0284c7" font-size="9" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Edge Absorbed</text>
    </g>
  </g>

  <!-- Middle: CDN Security Defense Boundary (Edge Mesh) -->
  <g transform="translate(195, 60)">
    <rect width="400" height="360" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#secShadow)"/>
    <rect width="400" height="38" rx="10" fill="#ffedd5"/>
    <text x="200" y="24" fill="#c2410c" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Alibaba Cloud Edge Security Mesh (5 Protective Layers)</text>

    <!-- Layer 1: Anti-DDoS -->
    <g transform="translate(15, 50)">
      <rect width="370" height="52" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <text x="20" y="22" fill="#9a3412" font-size="11" font-weight="700" font-family="system-ui, sans-serif">1. Edge Anti-DDoS Anycast Scrubbing</text>
      <text x="20" y="40" fill="#64748b" font-size="9.5" font-family="system-ui, sans-serif">Tbps-scale Anycast network absorbs SYN floods, UDP amplification, and Layer 4 surges.</text>
    </g>

    <!-- Layer 2: Edge WAF -->
    <g transform="translate(15, 110)">
      <rect width="370" height="52" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <text x="20" y="22" fill="#9a3412" font-size="11" font-weight="700" font-family="system-ui, sans-serif">2. Edge WAF 3.0 &amp; CC Protection</text>
      <text x="20" y="40" fill="#64748b" font-size="9.5" font-family="system-ui, sans-serif">Filters OWASP Top 10 (SQLi, XSS, Webshells) &amp; rate limits aggressive IP request spikes.</text>
    </g>

    <!-- Layer 3: Anti-Leech & URL Signing -->
    <g transform="translate(15, 170)">
      <rect width="370" height="52" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <text x="20" y="22" fill="#9a3412" font-size="11" font-weight="700" font-family="system-ui, sans-serif">3. Anti-Leech &amp; URL Signing Authentication</text>
      <text x="20" y="40" fill="#64748b" font-size="9.5" font-family="system-ui, sans-serif">Referer header validation + MD5 timestamp token auth (Types A/B/C) stops content piracy.</text>
    </g>

    <!-- Layer 4: SSL/TLS & IP Control -->
    <g transform="translate(15, 230)">
      <rect width="370" height="52" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <text x="20" y="22" fill="#9a3412" font-size="11" font-weight="700" font-family="system-ui, sans-serif">4. Zero-Trust SSL/TLS Termination &amp; IP Geo-ACL</text>
      <text x="20" y="40" fill="#64748b" font-size="9.5" font-family="system-ui, sans-serif">TLS 1.3 / HTTP/3 termination, SNI verification, and country/regional CIDR blacklisting.</text>
    </g>

    <!-- Layer 5: Origin Shield & OSS Private Auth -->
    <g transform="translate(15, 290)">
      <rect width="370" height="55" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
      <text x="20" y="22" fill="#065f46" font-size="11" font-weight="700" font-family="system-ui, sans-serif">5. Origin Shield &amp; Private OSS Authorization</text>
      <text x="20" y="40" fill="#047857" font-size="9.5" font-family="system-ui, sans-serif">RAM Role assumes secure back-to-origin credentials; origin IP hidden from public Internet.</text>
    </g>
  </g>

  <!-- Right: Protected Origin -->
  <g transform="translate(630, 60)">
    <rect width="180" height="360" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#secShadow)"/>
    <rect width="180" height="38" rx="10" fill="#dcfce7"/>
    <text x="90" y="24" fill="#166534" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Shielded Origin</text>

    <g transform="translate(15, 55)">
      <circle cx="75" cy="35" r="28" fill="#10b981"/>
      <text x="75" y="42" fill="#ffffff" font-size="22" text-anchor="middle">🛡️</text>
      <text x="75" y="80" fill="#15803d" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Origin IP Masked</text>
      <text x="75" y="96" fill="#475569" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Zero Direct Ingress</text>
    </g>

    <g transform="translate(15, 170)">
      <rect width="150" height="80" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="75" y="20" fill="#166534" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Authorized Only</text>
      <text x="75" y="38" fill="#15803d" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">• Private OSS Bucket</text>
      <text x="75" y="54" fill="#15803d" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">• Security Group Whitelist</text>
      <text x="75" y="70" fill="#15803d" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">• Origin Shield BGP IPs</text>
    </g>

    <g transform="translate(15, 265)">
      <rect width="150" height="75" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="75" y="20" fill="#166534" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Security Benefits</text>
      <text x="75" y="38" fill="#15803d" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">• 99.99% Availability</text>
      <text x="75" y="52" fill="#15803d" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">• Zero Bandwidth Tax</text>
      <text x="75" y="66" fill="#15803d" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">• Compliance Guaranteed</text>
    </g>
  </g>

  <!-- Ingress Arrows -->
  <line x1="160" y1="100" x2="190" y2="100" stroke="#059669" stroke-width="2.5" marker-end="url(#sGreen)"/>
  <line x1="160" y1="200" x2="190" y2="200" stroke="#dc2626" stroke-width="2.5" marker-end="url(#sRed)"/>

  <!-- Egress to Origin -->
  <line x1="595" y1="315" x2="625" y2="315" stroke="#059669" stroke-width="2.5" marker-end="url(#sGreen)"/>
</svg>
