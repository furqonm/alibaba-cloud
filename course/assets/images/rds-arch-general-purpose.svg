      <path d="M 81.0 63.0 L 107.0 63.0 M 87.0 58.0 L 87.0 82.0 M 94.0 58.0 L 94.0 82.0 M 101.0 58.0 L 101.0 82.0" fill="none" stroke="#475569" stroke-width="1" />
