    <g>
      <polygon points="73.1,18.8 68.0,21.7 62.9,18.8 62.9,12.9 68.0,9.9 73.1,12.9" fill="#ff6a00"/>
      <polygon points="67.2,28.9 62.1,31.9 57.0,28.9 57.0,23.0 62.1,20.1 67.2,23.0" fill="#ff6a00"/>
      <polygon points="79.0,28.9 73.9,31.9 68.8,28.9 68.8,23.0 73.9,20.1 79.0,23.0" fill="#ff6a00"/>
