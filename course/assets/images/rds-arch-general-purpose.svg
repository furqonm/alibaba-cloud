<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 210" width="100%" height="100%">
  <defs>
    <filter id="inst-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .text-title { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .text-category { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #c2410c; text-anchor: middle; }
      .text-inst { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .text-sub { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #475569; text-anchor: middle; font-weight: 500; }
      .text-bar { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    </style>
  </defs>

  <!-- Left: Premium Local SSDs Pill -->
  <rect x="88" y="8" width="160" height="24" rx="12" fill="#fff7ed" stroke="#ffedd5" stroke-width="1.2" />
  <text x="168" y="24" class="text-category">Premium Local SSDs</text>

  <!-- Instance 1 -->
  <g transform="translate(25, 38)">
    <rect width="136" height="106" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#inst-shadow)" />
    <g>
      <polygon points="73.1,18.8 68.0,21.7 62.9,18.8 62.9,12.9 68.0,9.9 73.1,12.9" fill="#ff6a00"/>
      <polygon points="67.2,28.9 62.1,31.9 57.0,28.9 57.0,23.0 62.1,20.1 67.2,23.0" fill="#ff6a00"/>
      <polygon points="79.0,28.9 73.9,31.9 68.8,28.9 68.8,23.0 73.9,20.1 79.0,23.0" fill="#ff6a00"/>
    </g>
    <text x="68" y="44" class="text-inst">RDS Instance 1</text>
    <g transform="translate(0, 0)">
      <rect x="55.0" y="58.0" width="26" height="24" rx="2" ry="2" fill="#ffffff" stroke="#475569" stroke-width="1.2" />
