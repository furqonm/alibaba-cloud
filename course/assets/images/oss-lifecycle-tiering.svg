<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 205" width="100%" height="auto">
  <defs>
    <filter id="shadow-pipe" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-pipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <linearGradient id="grad-standard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="grad-ia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="grad-archive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="grad-cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <linearGradient id="grad-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- Tier 1: Standard -->
    <g filter="url(#shadow-pipe)" transform="translate(20, 20)">
      <rect x="0" y="0" width="140" height="142" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" />
      <rect x="0" y="0" width="140" height="34" rx="10" fill="url(#grad-standard)" />
      <text x="70" y="22" fill="#C2410C" font-size="12.5" font-weight="800" text-anchor="middle">🔥 Standard</text>
      
      <!-- Duration Badge -->
      <rect x="15" y="48" width="110" height="24" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1" />
      <text x="70" y="64" fill="#9A3412" font-size="10.5" font-weight="700" text-anchor="middle">Day 0 – 30</text>
      
      <!-- Workload Pill -->
      <rect x="12" y="86" width="116" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="70" y="103" fill="#475569" font-size="9.5" font-weight="600" text-anchor="middle">Active Hot Data</text>
      <text x="70" y="118" fill="#64748B" font-size="8.5" text-anchor="middle">Web, Apps &amp; Media</text>
    </g>

    <!-- Transition 1 (Badge at y=68, Arrow at y=118 -> 30px clear gap!) -->
    <g transform="translate(160, 0)">
      <!-- Days Badge -->
      <rect x="0" y="70" width="40" height="20" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
      <text x="20" y="84" fill="#1D4ED8" font-size="9.5" font-weight="800" text-anchor="middle">30d</text>
      <!-- Arrow lowered and clearly separated -->
      <line x1="2" y1="118" x2="36" y2="118" stroke="#0284C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pipe)" />
    </g>

    <!-- Tier 2: Infrequent Access -->
    <g filter="url(#shadow-pipe)" transform="translate(200, 20)">
      <rect x="0" y="0" width="140" height="142" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2" />
      <rect x="0" y="0" width="140" height="34" rx="10" fill="url(#grad-ia)" />
      <text x="70" y="22" fill="#92400E" font-size="12" font-weight="800" text-anchor="middle">🌤️ Infrequent Access</text>
      
      <!-- Duration Badge -->
      <rect x="15" y="48" width="110" height="24" rx="12" fill="#FEFCE8" stroke="#FDE047" stroke-width="1" />
      <text x="70" y="64" fill="#854D0E" font-size="10.5" font-weight="700" text-anchor="middle">Day 30 – 60</text>
      
      <!-- Workload Pill -->
      <rect x="12" y="86" width="116" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="70" y="103" fill="#475569" font-size="9.5" font-weight="600" text-anchor="middle">Warm Data</text>
      <text x="70" y="118" fill="#64748B" font-size="8.5" text-anchor="middle">Monthly Reports</text>
    </g>

    <!-- Transition 2 (Badge at y=68, Arrow at y=118 -> 30px clear gap!) -->
    <g transform="translate(340, 0)">
      <rect x="0" y="70" width="40" height="20" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
      <text x="20" y="84" fill="#1D4ED8" font-size="9.5" font-weight="800" text-anchor="middle">60d</text>
      <line x1="2" y1="118" x2="36" y2="118" stroke="#0284C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pipe)" />
    </g>

    <!-- Tier 3: Archive -->
    <g filter="url(#shadow-pipe)" transform="translate(380, 20)">
      <rect x="0" y="0" width="140" height="142" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
      <rect x="0" y="0" width="140" height="34" rx="10" fill="url(#grad-archive)" />
      <text x="70" y="22" fill="#0369A1" font-size="12.5" font-weight="800" text-anchor="middle">❄️ Archive</text>
      
      <!-- Duration Badge -->
      <rect x="15" y="48" width="110" height="24" rx="12" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1" />
      <text x="70" y="64" fill="#0369A1" font-size="10.5" font-weight="700" text-anchor="middle">Day 60 – 180</text>
      
      <!-- Workload Pill -->
      <rect x="12" y="86" width="116" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="70" y="103" fill="#475569" font-size="9.5" font-weight="600" text-anchor="middle">Cold Inactive</text>
      <text x="70" y="118" fill="#64748B" font-size="8.5" text-anchor="middle">Quarterly Logs</text>
    </g>

    <!-- Transition 3 (Badge at y=68, Arrow at y=118 -> 30px clear gap!) -->
    <g transform="translate(520, 0)">
      <rect x="0" y="70" width="40" height="20" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
      <text x="20" y="84" fill="#1D4ED8" font-size="9.5" font-weight="800" text-anchor="middle">180d</text>
      <line x1="2" y1="118" x2="36" y2="118" stroke="#0284C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pipe)" />
    </g>

    <!-- Tier 4: Cold Archive -->
    <g filter="url(#shadow-pipe)" transform="translate(560, 20)">
      <rect x="0" y="0" width="140" height="142" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" />
      <rect x="0" y="0" width="140" height="34" rx="10" fill="url(#grad-cold)" />
      <text x="70" y="22" fill="#3730A3" font-size="12.5" font-weight="800" text-anchor="middle">🧊 Cold Archive</text>
      
      <!-- Duration Badge -->
      <rect x="15" y="48" width="110" height="24" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1" />
      <text x="70" y="64" fill="#3730A3" font-size="10.5" font-weight="700" text-anchor="middle">Day 180 – 365</text>
      
      <!-- Workload Pill -->
      <rect x="12" y="86" width="116" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="70" y="103" fill="#475569" font-size="9.5" font-weight="600" text-anchor="middle">Deep Archival</text>
      <text x="70" y="118" fill="#64748B" font-size="8.5" text-anchor="middle">Annual Backups &amp; CCTV</text>
    </g>

    <!-- Transition 4 (Badge at y=68, Arrow at y=118 -> 30px clear gap!) -->
    <g transform="translate(700, 0)">
      <rect x="0" y="70" width="40" height="20" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
      <text x="20" y="84" fill="#1D4ED8" font-size="9.5" font-weight="800" text-anchor="middle">365d</text>
      <line x1="2" y1="118" x2="36" y2="118" stroke="#0284C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pipe)" />
    </g>

    <!-- Tier 5: Deep Cold Archive -->
    <g filter="url(#shadow-pipe)" transform="translate(740, 20)">
      <rect x="0" y="0" width="160" height="142" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
      <rect x="0" y="0" width="160" height="34" rx="10" fill="url(#grad-deep)" />
      <text x="80" y="22" fill="#1E293B" font-size="12" font-weight="800" text-anchor="middle">🏔️ Deep Cold Archive</text>
      
      <!-- Duration Badge -->
      <rect x="15" y="48" width="130" height="24" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="80" y="64" fill="#334155" font-size="10.5" font-weight="700" text-anchor="middle">&gt; 365 Days / WORM</text>
      
      <!-- Workload Pill -->
      <rect x="12" y="86" width="136" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="80" y="103" fill="#475569" font-size="9.5" font-weight="600" text-anchor="middle">Compliance Records</text>
      <text x="80" y="118" fill="#64748B" font-size="8.5" text-anchor="middle">Tape Replacement (WORM)</text>
    </g>
  </g>
</svg>
