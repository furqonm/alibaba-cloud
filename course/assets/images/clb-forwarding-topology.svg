<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <filter id="shadow-clb-clean" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="clb-grad-clean" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <marker id="arrow-clb-gray" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-clb-orange" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#FF6A00"/>
    </marker>
  </defs>

  <!-- Canvas Outer Background -->
  <rect x="4" y="4" width="832" height="392" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== TOP: CLB ==================== -->
  <g transform="translate(345, 16)" filter="url(#shadow-clb-clean)">
    <rect width="150" height="52" rx="8" fill="#fff7ed" stroke="#FF6A00" stroke-width="2"/>
    <rect x="10" y="8" width="36" height="36" rx="6" fill="url(#clb-grad-clean)"/>
    <text x="28" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18">⚖️</text>
    <text x="58" y="34" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#9a3412">CLB</text>
  </g>

  <!-- Connectors from CLB to 3 Listeners -->
  <path d="M 370 68 L 370 92 L 145 92 L 145 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-clb-gray)"/>
  <path d="M 420 68 L 420 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-clb-gray)"/>
  <path d="M 470 68 L 470 92 L 695 92 L 695 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-clb-gray)"/>

  <!-- ==================== MIDDLE TIER: 3 LISTENERS ==================== -->
  <!-- Listener 1: TCP:80 -->
  <g transform="translate(20, 115)" filter="url(#shadow-clb-clean)">
    <rect width="250" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="250" height="28" rx="8" fill="#0284c7"/>
    <rect y="18" width="250" height="10" fill="#0284c7"/>
    <text x="125" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff">Listener TCP:80</text>

    <g transform="translate(15, 36)">
      <circle cx="15" cy="18" r="14" fill="#eff6ff"/>
      <text x="15" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13">🌐</text>
      <text x="40" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">TCP Port 80</text>
    </g>
  </g>

  <!-- Listener 2: HTTPS:443 -->
  <g transform="translate(295, 115)" filter="url(#shadow-clb-clean)">
    <rect width="250" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="250" height="28" rx="8" fill="#059669"/>
    <rect y="18" width="250" height="10" fill="#059669"/>
    <text x="125" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff">Listener HTTPS:443</text>

    <g transform="translate(15, 36)">
      <circle cx="15" cy="18" r="14" fill="#ecfdf5"/>
      <text x="15" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13">🔒</text>
      <text x="40" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">HTTPS Port 443</text>
    </g>
  </g>

  <!-- Listener 3: HTTP:81 -->
  <g transform="translate(570, 115)" filter="url(#shadow-clb-clean)">
    <rect width="250" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="250" height="28" rx="8" fill="#0284c7"/>
    <rect y="18" width="250" height="10" fill="#0284c7"/>
    <text x="125" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff">Listener HTTP:81</text>

    <g transform="translate(15, 36)">
      <circle cx="15" cy="18" r="14" fill="#eff6ff"/>
      <text x="15" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13">🌐</text>
      <text x="40" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">HTTP Port 81</text>
    </g>
  </g>

  <!-- Connectors from Listeners down to Server Groups -->
  <path d="M 145 205 L 145 255" fill="none" stroke="#FF6A00" stroke-width="2" marker-end="url(#arrow-clb-orange)"/>
  <path d="M 420 205 L 420 255" fill="none" stroke="#FF6A00" stroke-width="2" marker-end="url(#arrow-clb-orange)"/>
  <path d="M 695 205 L 695 255" fill="none" stroke="#FF6A00" stroke-width="2" marker-end="url(#arrow-clb-orange)"/>

  <!-- ==================== BOTTOM TIER: 3 SERVER GROUPS ==================== -->
  <!-- Server Group A (4 ECS) -->
  <g transform="translate(20, 255)" filter="url(#shadow-clb-clean)">
    <rect width="250" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">Server Group A</text>

    <g transform="translate(12, 28)">
      <rect width="50" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="25" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="25" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af">ECS</text>
    </g>
    <g transform="translate(68, 28)">
      <rect width="50" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="25" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="25" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af">ECS</text>
    </g>
    <g transform="translate(124, 28)">
      <rect width="50" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="25" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="25" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af">ECS</text>
    </g>
    <g transform="translate(180, 28)">
      <rect width="50" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="25" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="25" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af">ECS</text>
    </g>

    <rect x="14" y="92" width="222" height="26" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="125" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Health Check</text>
  </g>

  <!-- Server Group B (ECS, ENI, ECI) -->
  <g transform="translate(295, 255)" filter="url(#shadow-clb-clean)">
    <rect width="250" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">Server Group B</text>

    <g transform="translate(14, 28)">
      <rect width="66" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="33" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="33" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">ECS</text>
    </g>
    <g transform="translate(92, 28)">
      <rect width="66" height="52" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="33" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🔌</text>
      <text x="33" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#047857">ENI</text>
    </g>
    <g transform="translate(170, 28)">
      <rect width="66" height="52" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="33" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">📦</text>
      <text x="33" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#6d28d9">ECI</text>
    </g>

    <rect x="14" y="92" width="222" height="26" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="125" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Health Check</text>
  </g>

  <!-- Server Group C (3 ECS) -->
  <g transform="translate(570, 255)" filter="url(#shadow-clb-clean)">
    <rect width="250" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">Server Group C</text>

    <g transform="translate(14, 28)">
      <rect width="66" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="33" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="33" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">ECS</text>
    </g>
    <g transform="translate(92, 28)">
      <rect width="66" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="33" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="33" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">ECS</text>
    </g>
    <g transform="translate(170, 28)">
      <rect width="66" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="33" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🖥️</text>
      <text x="33" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">ECS</text>
    </g>

    <rect x="14" y="92" width="222" height="26" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="125" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Health Check</text>
  </g>
</svg>
