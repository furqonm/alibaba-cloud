<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 48" width="100%" height="100%">
  <defs>
    <style>
      .ms-halo {
        paint-order: stroke fill;
        stroke: #ffffff;
        stroke-width: 3.5px;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .ms-icon-halo {
        paint-order: stroke fill;
        stroke: #ffffff;
        stroke-width: 1.5px;
      }
    </style>
  </defs>

  <!-- Microsoft 4-Squares Emblem -->
  <g transform="translate(8, 8)">
    <rect class="ms-icon-halo" x="0" y="0" width="14" height="14" rx="2" fill="#f25022"/>
    <rect class="ms-icon-halo" x="17" y="0" width="14" height="14" rx="2" fill="#7fba00"/>
    <rect class="ms-icon-halo" x="0" y="17" width="14" height="14" rx="2" fill="#00a4ef"/>
    <rect class="ms-icon-halo" x="17" y="17" width="14" height="14" rx="2" fill="#ffb900"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(48, 22)">
    <text class="ms-halo" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#64748b">Microsoft</text>
    <text class="ms-halo" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a">SQL Server</text>
  </g>
</svg>