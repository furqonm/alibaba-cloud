<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <rect x="15" y="15" width="850" height="410" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="440" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Network Load Balancer (NLB): CIPU Hardware-Accelerated Architecture</text>

  <!-- Left: Ingestion & Metrics -->
  <g transform="translate(35, 75)">
    <rect width="260" height="325" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="15" y="15" width="230" height="35" rx="6" fill="#0284c7"/>
    <text x="130" y="38" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Extreme Scale Metrics</text>

    <g transform="translate(20, 70)">
      <rect width="220" height="45" rx="6" fill="#ffffff" stroke="#bae6fd"/>
      <text x="15" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Concurrent Connections:</text>
      <text x="15" y="36" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0284c7">100,000,000 Connections</text>

      <rect y="55" width="220" height="45" rx="6" fill="#ffffff" stroke="#bae6fd"/>
      <text x="15" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">New Connections per Second:</text>
      <text x="15" y="91" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0284c7">Up to 10,000,000 QPS</text>

      <rect y="110" width="220" height="45" rx="6" fill="#ffffff" stroke="#bae6fd"/>
      <text x="15" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Data Processing Latency:</text>
      <text x="15" y="146" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16a34a">&lt; 0.5 ms (Sub-millisecond)</text>

      <rect y="165" width="220" height="45" rx="6" fill="#ffffff" stroke="#bae6fd"/>
      <text x="15" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Throughput Capacity:</text>
      <text x="15" y="201" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0284c7">Up to 100 Gbps per AZ</text>
    </g>
  </g>

  <!-- Middle: CIPU Hardware Offload Layer -->
  <g transform="translate(320, 75)">
    <rect width="250" height="325" rx="12" fill="#fff7ed" stroke="#FF6A00" stroke-width="2"/>
    <rect x="15" y="15" width="220" height="35" rx="6" fill="#FF6A00"/>
    <text x="125" y="38" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CIPU Silicon Acceleration</text>

    <g transform="translate(18, 65)">
      <rect width="214" height="60" rx="6" fill="#ffffff" stroke="#fed7aa"/>
      <text x="12" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">Hardware Fast-Path</text>
      <text x="12" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Zero host CPU overhead</text>

      <rect y="70" width="214" height="60" rx="6" fill="#ffffff" stroke="#fed7aa"/>
      <text x="12" y="94" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">Native Source IP Pass</text>
      <text x="12" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Direct client IP to backend</text>

      <rect y="140" width="214" height="60" rx="6" fill="#ffffff" stroke="#fed7aa"/>
      <text x="12" y="164" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">Active-Active Multi-Zone</text>
      <text x="12" y="184" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Cross-zone auto failover</text>
    </g>
  </g>

  <!-- Right: Ideal Use Cases -->
  <g transform="translate(595, 75)">
    <rect width="250" height="325" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="15" y="15" width="220" height="35" rx="6" fill="#1e293b"/>
    <text x="125" y="38" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Mission-Critical Scenarios</text>

    <g transform="translate(18, 65)">
      <rect width="214" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">🎮 Online Gaming (TCP/UDP)</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Real-time battle royale &amp; MMORPG low ping requirements</text>

      <rect y="75" width="214" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="99" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">📡 IoT Telemetry Streaming</text>
      <text x="12" y="117" font-family="system-ui, sans-serif" font-size="10" fill="#475569">MQTT, CoAP &amp; industrial sensor clusters with millions of devices</text>

      <rect y="150" width="214" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="174" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">🔒 PrivateLink Service Publishing</text>
      <text x="12" y="192" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Secure private endpoint service without public IP exposure</text>
    </g>
  </g>
</svg>