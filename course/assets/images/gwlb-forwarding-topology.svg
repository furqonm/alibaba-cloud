  <!-- ==================== FLOW CONNECTORS (ON TOP) ==================== -->
  <!-- 1. Client to GWLBe (Dark Gray) -->
  <path d="M 312 56 L 312 188" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- 2. GWLBe to GWLB across PrivateLink (Dark Gray Forward Traffic) -->
  <path d="M 360 225 L 538 225" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-gray)"/>

  <!-- 3. GWLB to Server Group NVAs (Dark Gray Forward Traffic Branching) -->
