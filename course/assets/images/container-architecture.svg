<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="auto">
  <defs>
    <filter id="cnt-shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Outer Container -->
    <rect x="5" y="5" width="530" height="370" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Top: 6 Containerized Applications -->
    <!-- App A -->
    <g filter="url(#cnt-shadow)">
      <rect x="25" y="20" width="74" height="155" rx="6" fill="#3A88C8" stroke="#2C75B0" stroke-width="1.2" />
      <text x="62" y="103" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">App A</text>
    </g>

    <!-- App B -->
    <g filter="url(#cnt-shadow)">
      <rect x="108" y="20" width="74" height="155" rx="6" fill="#3A88C8" stroke="#2C75B0" stroke-width="1.2" />
      <text x="145" y="103" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">App B</text>
    </g>

    <!-- App C -->
    <g filter="url(#cnt-shadow)">
      <rect x="191" y="20" width="74" height="155" rx="6" fill="#3A88C8" stroke="#2C75B0" stroke-width="1.2" />
      <text x="228" y="103" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">App C</text>
    </g>

    <!-- App D -->
    <g filter="url(#cnt-shadow)">
      <rect x="274" y="20" width="74" height="155" rx="6" fill="#3A88C8" stroke="#2C75B0" stroke-width="1.2" />
      <text x="311" y="103" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">App D</text>
    </g>

    <!-- App E -->
    <g filter="url(#cnt-shadow)">
      <rect x="357" y="20" width="74" height="155" rx="6" fill="#3A88C8" stroke="#2C75B0" stroke-width="1.2" />
      <text x="394" y="103" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">App E</text>
    </g>

    <!-- App F -->
    <g filter="url(#cnt-shadow)">
      <rect x="440" y="20" width="75" height="155" rx="6" fill="#3A88C8" stroke="#2C75B0" stroke-width="1.2" />
      <text x="477" y="103" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">App F</text>
    </g>

    <!-- Layer 3: Docker -->
    <g filter="url(#cnt-shadow)">
      <rect x="25" y="190" width="490" height="50" rx="8" fill="#3A88C8" stroke="#2C75B0" stroke-width="1.5" />
      <text x="270" y="221" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Docker</text>
    </g>

    <!-- Layer 2: Host Operating System (Identical to VM) -->
    <g filter="url(#cnt-shadow)">
      <rect x="25" y="250" width="490" height="50" rx="8" fill="#E1F0F8" stroke="#B0D7EC" stroke-width="1.5" />
      <text x="270" y="281" fill="#1E3A5F" font-size="15" font-weight="700" text-anchor="middle">Host Operating System</text>
    </g>

    <!-- Layer 1: Host Hardware (Identical to VM) -->
    <g filter="url(#cnt-shadow)">
      <rect x="25" y="310" width="490" height="50" rx="8" fill="#48B092" stroke="#31977A" stroke-width="1.5" />
      <text x="270" y="341" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Host Hardware</text>
    </g>
  </g>
</svg>