<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto">
  <defs>
    <filter id="ep-shd" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Canvas frame -->
    <rect x="10" y="10" width="940" height="400" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Title Bar -->
    <text x="30" y="38" fill="#0F172A" font-size="14" font-weight="700">Auto Scaling Operational Patterns &amp; Dynamic Rule Architectures</text>
    <text x="930" y="38" fill="#64748B" font-size="11" font-weight="500" text-anchor="end">Simple &bull; Scheduled &bull; Target Tracking &bull; Predictive</text>

    <!-- 4 Pattern Cards -->
    <!-- Pattern 1: Scheduled Scaling -->
    <g filter="url(#ep-shd)">
      <rect x="30" y="60" width="215" height="330" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
      <rect x="30" y="60" width="215" height="26" rx="8" fill="#0284C7" />
      <rect x="30" y="78" width="215" height="8" fill="#0284C7" />
      <text x="137" y="77" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">1. Scheduled Scaling</text>

      <rect x="42" y="95" width="191" height="55" rx="5" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
      <text x="137" y="115" fill="#0369A1" font-size="11" font-weight="700" text-anchor="middle">Predictable Timers</text>
      <text x="137" y="133" fill="#64748B" font-size="9" text-anchor="middle">Launch Expiration: 600s</text>

      <text x="45" y="170" fill="#0F172A" font-size="10" font-weight="700">How It Works:</text>
      <text x="45" y="188" fill="#334155" font-size="9">&bull; Triggers scaling rules at</text>
      <text x="45" y="202" fill="#334155" font-size="9">  exact timestamps or cron.</text>
      <text x="45" y="216" fill="#334155" font-size="9">&bull; Bypasses cooldown lock!</text>
      <text x="45" y="230" fill="#334155" font-size="9">&bull; Executes only 1 task</text>
      <text x="45" y="244" fill="#334155" font-size="9">  at a time per group.</text>

      <rect x="42" y="270" width="191" height="105" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="137" y="290" fill="#0284C7" font-size="10" font-weight="700" text-anchor="middle">Ideal Use Case</text>
      <text x="50" y="310" fill="#475569" font-size="9">&bull; Daily morning office peak</text>
      <text x="50" y="325" fill="#475569" font-size="9">&bull; Weekend batch processing</text>
      <text x="50" y="340" fill="#475569" font-size="9">&bull; Scheduled TV broadcast</text>
      <text x="50" y="355" fill="#475569" font-size="9">&bull; Regular flash campaign</text>
    </g>

    <!-- Pattern 2: Dynamic CloudMonitor -->
    <g filter="url(#ep-shd)">
      <rect x="260" y="60" width="215" height="330" rx="8" fill="#FFFFFF" stroke="#FF6A00" stroke-width="1.5" />
      <rect x="260" y="60" width="215" height="26" rx="8" fill="#FF6A00" />
      <rect x="260" y="78" width="215" height="8" fill="#FF6A00" />
      <text x="367" y="77" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">2. Dynamic Alarm</text>

      <rect x="272" y="95" width="191" height="55" rx="5" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1" />
      <text x="367" y="115" fill="#C2410C" font-size="11" font-weight="700" text-anchor="middle">Metric-Driven Scaling</text>
      <text x="367" y="133" fill="#64748B" font-size="9" text-anchor="middle">Respects Cooldown Period</text>

      <text x="275" y="170" fill="#0F172A" font-size="10" font-weight="700">How It Works:</text>
      <text x="275" y="188" fill="#334155" font-size="9">&bull; Evaluates CloudMonitor</text>
      <text x="275" y="202" fill="#334155" font-size="9">  telemetry every 1-5 mins.</text>
      <text x="275" y="216" fill="#334155" font-size="9">&bull; e.g. CPU &ge; 80% &rarr; Add 2</text>
      <text x="275" y="230" fill="#334155" font-size="9">&bull; e.g. CPU &le; 30% &rarr; Remove 1</text>
      <text x="275" y="244" fill="#DC2626" font-size="9">&bull; <strong>Blocked during cooldown!</strong></text>

      <rect x="272" y="270" width="191" height="105" rx="5" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1" />
      <text x="367" y="290" fill="#EA580C" font-size="10" font-weight="700" text-anchor="middle">Ideal Use Case</text>
      <text x="280" y="310" fill="#7C2D12" font-size="9">&bull; Unpredictable viral traffic</text>
      <text x="280" y="325" fill="#7C2D12" font-size="9">&bull; Sudden API request spike</text>
      <text x="280" y="340" fill="#7C2D12" font-size="9">&bull; Background worker queue</text>
      <text x="280" y="355" fill="#7C2D12" font-size="9">&bull; Real-time data surge</text>
    </g>

    <!-- Pattern 3: Target Tracking -->
    <g filter="url(#ep-shd)">
      <rect x="490" y="60" width="215" height="330" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
      <rect x="490" y="60" width="215" height="26" rx="8" fill="#059669" />
      <rect x="490" y="78" width="215" height="8" fill="#059669" />
      <text x="597" y="77" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">3. Target Tracking</text>

      <rect x="502" y="95" width="191" height="55" rx="5" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
      <text x="597" y="115" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">Self-Tuning Thermostat</text>
      <text x="597" y="133" fill="#64748B" font-size="9" text-anchor="middle">Target Value: e.g. 50% CPU</text>

      <text x="505" y="170" fill="#0F172A" font-size="10" font-weight="700">How It Works:</text>
      <text x="505" y="188" fill="#334155" font-size="9">&bull; User sets target metric.</text>
      <text x="505" y="202" fill="#334155" font-size="9">&bull; ESS automatically calculates</text>
      <text x="505" y="216" fill="#334155" font-size="9">  exact instances to add/cut.</text>
      <text x="505" y="230" fill="#334155" font-size="9">&bull; Smooth proportional adjustments</text>
      <text x="505" y="244" fill="#334155" font-size="9">  avoiding step calculation.</text>

      <rect x="502" y="270" width="191" height="105" rx="5" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
      <text x="597" y="290" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">Ideal Use Case</text>
      <text x="510" y="310" fill="#064E3B" font-size="9">&bull; Microservice web clusters</text>
      <text x="510" y="325" fill="#064E3B" font-size="9">&bull; Steady business growth</text>
      <text x="510" y="340" fill="#064E3B" font-size="9">&bull; Consistent SLA response</text>
      <text x="510" y="355" fill="#064E3B" font-size="9">&bull; Hands-off management</text>
    </g>

    <!-- Pattern 4: Predictive AI Scaling -->
    <g filter="url(#ep-shd)">
      <rect x="720" y="60" width="215" height="330" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" />
      <rect x="720" y="60" width="215" height="26" rx="8" fill="#7C3AED" />
      <rect x="720" y="78" width="215" height="8" fill="#7C3AED" />
      <text x="827" y="77" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">4. Predictive (AI/ML)</text>

      <rect x="732" y="95" width="191" height="55" rx="5" fill="#FDF4FF" stroke="#E9D5FF" stroke-width="1" />
      <text x="827" y="115" fill="#6B21A8" font-size="11" font-weight="700" text-anchor="middle">Proactive Pre-Warming</text>
      <text x="827" y="133" fill="#64748B" font-size="9" text-anchor="middle">Deep Learning Forecast</text>

      <text x="735" y="170" fill="#0F172A" font-size="10" font-weight="700">How It Works:</text>
      <text x="735" y="188" fill="#334155" font-size="9">&bull; Analyzes min. 24h historical</text>
      <text x="735" y="202" fill="#334155" font-size="9">  telemetry curves.</text>
      <text x="735" y="216" fill="#334155" font-size="9">&bull; <strong>Scales out BEFORE the surge</strong></text>
      <text x="735" y="230" fill="#334155" font-size="9">  arrives, eliminating VM</text>
      <text x="735" y="244" fill="#334155" font-size="9">  boot latency penalty!</text>

      <rect x="732" y="270" width="191" height="105" rx="5" fill="#FDF4FF" stroke="#E9D5FF" stroke-width="1" />
      <text x="827" y="290" fill="#7C3AED" font-size="10" font-weight="700" text-anchor="middle">Ideal Use Case</text>
      <text x="740" y="310" fill="#581C87" font-size="9">&bull; High-traffic e-commerce</text>
      <text x="740" y="325" fill="#581C87" font-size="9">&bull; Video on demand peaks</text>
      <text x="740" y="340" fill="#581C87" font-size="9">&bull; Massive multiplayer gaming</text>
      <text x="740" y="355" fill="#581C87" font-size="9">&bull; Slow-booting enterprise apps</text>
    </g>
  </g>
</svg>