<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 415" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-3%" y="-5%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0.5, 6 3.5, 0 6.5" fill="#0284c7"/>
    </marker>
    <marker id="arrow-ack" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0.5, 6 3.5, 0 6.5" fill="#d97706"/>
    </marker>
    <marker id="arrow-client" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0.5, 6 3.5, 0 6.5" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0.5, 6 3.5, 0 6.5" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ==================== LEFT PANEL: SEMI-SYNCHRONOUS REPLICATION ==================== -->
  <g transform="translate(15, 15)">
    <!-- Container Card -->
    <rect width="465" height="385" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="465" height="42" rx="10" fill="#f8fafc"/>
    <rect y="32" width="465" height="10" fill="#f8fafc"/>
    <line x1="0" y1="42" x2="465" y2="42" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Title & Badge -->
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
      Semi-Synchronous Replication
    </text>
    <rect x="305" y="10" width="145" height="22" rx="11" fill="#dcfce7"/>
    <text x="377" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#15803d">
      Alibaba Cloud Default HA
    </text>

    <!-- Source Timeline Axis -->
    <text x="18" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">
      Source
    </text>
    <line x1="72" y1="100" x2="450" y2="100" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Client Request Arrow -->
    <line x1="45" y1="65" x2="74" y2="94" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
    <text x="48" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0284c7">
      Tx
    </text>

    <!-- Source Step Boxes -->
    <rect x="78" y="82" width="66" height="36" rx="6" fill="#0284c7"/>
    <text x="111" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
      execute
    </text>

    <rect x="150" y="82" width="62" height="36" rx="6" fill="#0284c7"/>
    <text x="181" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
      binlog
    </text>

    <!-- Waiting Bracket / Interval -->
    <line x1="218" y1="100" x2="284" y2="100" stroke="#d97706" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="251" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#d97706">
      wait ACK
    </text>

    <rect x="288" y="82" width="68" height="36" rx="6" fill="#059669"/>
    <text x="322" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
      commit
    </text>

    <!-- Client Response Arrow -->
    <line x1="356" y1="94" x2="395" y2="65" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-client)"/>
    <text x="400" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#059669">
      Response OK
    </text>

    <!-- Binlog Transfer Arrow to Replica -->
    <path d="M 181 118 L 235 193" fill="none" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

    <!-- Upward ACK Arrow from Replica Relay Log -->
    <path d="M 270 197 L 293 126" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-ack)"/>
    <rect x="258" y="146" width="38" height="20" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="277" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#b45309">
      ACK
    </text>

    <!-- Replica Timeline Axis -->
    <text x="18" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">
      Replica
    </text>
    <line x1="72" y1="215" x2="450" y2="215" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Replica Step Boxes -->
    <rect x="220" y="197" width="70" height="36" rx="6" fill="#38bdf8"/>
    <text x="255" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">
      relay log
    </text>

    <rect x="296" y="197" width="56" height="36" rx="6" fill="#94a3b8"/>
    <text x="324" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">
      apply
    </text>

    <rect x="358" y="197" width="60" height="36" rx="6" fill="#94a3b8"/>
    <text x="388" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">
      commit
    </text>

    <!-- Summary Feature Box -->
    <g transform="translate(15, 255)">
      <rect width="435" height="115" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#166534">
        🛡️ How It Works (Default HA Standard):
      </text>
      <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#166534">
        • Primary <tspan font-weight="700" fill="#b45309">waits for ACK</tspan> from Standby before committing &amp; replying.
      </text>
      <text x="18" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#15803d">
        • Standby writes binlog into local relay log before sending acknowledgement.
      </text>
      <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#15803d">
        • Guarantees <tspan font-weight="700" fill="#166534">Zero Data Loss (RPO = 0)</tspan>; auto-falls back to async if timeout occurs.
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: ASYNCHRONOUS REPLICATION ==================== -->
  <g transform="translate(500, 15)">
    <!-- Container Card -->
    <rect width="465" height="385" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="465" height="42" rx="10" fill="#f8fafc"/>
    <rect y="32" width="465" height="10" fill="#f8fafc"/>
    <line x1="0" y1="42" x2="465" y2="42" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Title & Badge -->
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
      Asynchronous Replication
    </text>
    <rect x="330" y="10" width="120" height="22" rx="11" fill="#e0f2fe"/>
    <text x="390" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0284c7">
      Immediate Commit
    </text>

    <!-- Source Timeline Axis -->
    <text x="18" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">
      Source
    </text>
    <line x1="72" y1="100" x2="450" y2="100" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Client Request Arrow -->
    <line x1="45" y1="65" x2="74" y2="94" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
    <text x="48" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0284c7">
      Tx
    </text>

    <!-- Source Step Boxes -->
    <rect x="78" y="82" width="66" height="36" rx="6" fill="#0284c7"/>
    <text x="111" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
      execute
    </text>

    <rect x="150" y="82" width="62" height="36" rx="6" fill="#0284c7"/>
    <text x="181" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
      binlog
    </text>

    <rect x="220" y="82" width="68" height="36" rx="6" fill="#059669"/>
    <text x="254" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
      commit
    </text>

    <!-- Client Response Arrow -->
    <line x1="288" y1="94" x2="328" y2="65" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-client)"/>
    <text x="333" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#059669">
      Response OK
    </text>

    <!-- Binlog Transfer Arrow to Replica -->
    <path d="M 181 118 L 235 193" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)"/>
    <text x="238" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#0284c7">
      async send
    </text>

    <!-- Replica Timeline Axis -->
    <text x="18" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">
      Replica
    </text>
    <line x1="72" y1="215" x2="450" y2="215" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Replica Step Boxes -->
    <rect x="220" y="197" width="70" height="36" rx="6" fill="#38bdf8"/>
    <text x="255" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">
      relay log
    </text>

    <rect x="296" y="197" width="56" height="36" rx="6" fill="#94a3b8"/>
    <text x="324" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">
      apply
    </text>

    <rect x="358" y="197" width="60" height="36" rx="6" fill="#94a3b8"/>
    <text x="388" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">
      commit
    </text>

    <!-- Summary Feature Box -->
    <g transform="translate(15, 255)">
      <rect width="435" height="115" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">
        ⚡ How It Works (Maximum Throughput):
      </text>
      <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#475569">
        • Primary writes binlog and <tspan font-weight="700" fill="#059669">commits immediately</tspan> without waiting for replicas.
      </text>
      <text x="18" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#475569">
        • Client receives response with lowest latency and maximum write throughput.
      </text>
      <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#dc2626">
        • Trade-off: Un-replicated logs in transit risk loss on crash <tspan font-weight="700" fill="#dc2626">(RPO &gt; 0)</tspan>.
      </text>
    </g>
  </g>
</svg>
